<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14112a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%B7%3C/text%3E%3C/svg%3E">
<title>Bloodline Dojo: Idle Ninja</title>
<style>
:root{--bg:#14112a;--bg2:#1e1940;--card:#262052;--card2:#2f2863;--ink:#f3eefc;--mut:#a79fcb;--acc:#ff8a3d;--acc2:#ffc65c;--good:#5fe0a0;--bad:#ff6b7a;--blue:#7cc4ff;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
body{touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;background:linear-gradient(180deg,#1b1638,#14112a 40%);position:relative;padding-top:env(safe-area-inset-top)}
header{padding:10px 14px 6px;text-align:center;position:relative}
.ki{font-size:30px;font-weight:800;letter-spacing:.5px;line-height:1.1}
.ki small{font-size:15px;color:var(--acc2);font-weight:700;margin-left:4px}
.kps{color:var(--mut);font-size:14px;margin-top:2px}
.buffs{min-height:20px;font-size:13px;color:var(--acc2);font-weight:700}
#soundBtn{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);font-size:20px}
#seal{position:absolute;left:10px;top:10px;min-width:44px;height:44px;padding:0 10px;border-radius:22px;background:var(--card);font-size:13px;font-weight:700;display:flex;flex-direction:column;justify-content:center;line-height:1.15;max-width:96px;overflow:hidden;white-space:nowrap}
#divW{color:#ffe08a;display:none}
.buffs .six{display:inline-block;background:linear-gradient(90deg,#fff1a8,#ffb347);color:#2a1440;border-radius:10px;padding:0 8px;box-shadow:0 0 12px #fff1a8;animation:sixg 1.6s ease-in-out infinite alternate}
@keyframes sixg{to{box-shadow:0 0 22px #ffd23d}}
#tapZone{position:relative;flex:0 0 34vh;min-height:190px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#orb{width:min(30vh,240px);height:min(30vh,240px);min-width:150px;min-height:150px;border-radius:50%;border:0;position:relative;touch-action:none;
 background:radial-gradient(circle at 35% 30%,#fff3c4 0,#ffb347 18%,#ff6a2b 45%,#9c1f5a 75%,#3b1060 100%);
 box-shadow:0 0 40px #ff7a3a88,0 0 90px #b03cff44,inset 0 -12px 30px #0005;transition:transform .06s}
#orb.hit{transform:scale(.93)}
#orb .ring{position:absolute;inset:-14px;border-radius:50%;border:3px dashed #ffc65c66;animation:spin 14s linear infinite;pointer-events:none}
#orb .glyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(11vh,86px);font-weight:900;color:#fff8;text-shadow:0 0 18px #fff;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.float{position:absolute;pointer-events:none;font-weight:900;font-size:22px;color:#fff;text-shadow:0 2px 6px #000,0 0 10px var(--acc);animation:up .9s ease-out forwards;white-space:nowrap;z-index:5}
.float.crit{color:var(--acc2);font-size:30px}
@keyframes up{0%{transform:translate(-50%,-50%) scale(.7);opacity:1}20%{transform:translate(-50%,-80%) scale(1.15)}100%{transform:translate(-50%,-260%) scale(1);opacity:0}}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--acc2);pointer-events:none;animation:spark .6s ease-out forwards;z-index:4}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
#fox,.foxb{position:absolute;width:64px;height:64px;border-radius:50%;border:0;background:radial-gradient(circle,#fff 0,#bdf3ff 40%,#5ab6ff00 72%);font-size:38px;display:none;z-index:6;animation:bob 1.4s ease-in-out infinite;touch-action:none}
@keyframes bob{50%{transform:translateY(-10px) scale(1.08)}}
#panel{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 10px 16px;border-top:1px solid #ffffff14;background:var(--bg2);border-radius:18px 18px 0 0}
nav{display:flex;background:#100d22;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #ffffff14}
nav button{flex:1;border:0;background:none;padding:8px 2px 9px;min-height:58px;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button b{font-size:21px;line-height:1.1}
nav button.on{color:var(--acc2);background:#ffffff08}
nav button .dot{position:absolute;top:6px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--acc);display:none}
nav button.has .dot{display:block}
h3{margin:8px 4px 6px;font-size:15px;color:var(--acc2);display:flex;justify-content:space-between;align-items:center}
.hint{color:var(--mut);font-size:13px;margin:0 4px 8px;line-height:1.35}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--r);padding:10px;margin-bottom:8px;min-height:64px}
.row.locked{opacity:.45}
.row .ic{font-size:30px;width:42px;text-align:center;flex:0 0 42px}
.row .mid{flex:1;min-width:0}
.row .nm{font-weight:700;font-size:15px}
.row .nm .own{color:var(--acc2);margin-left:6px}
.row .ds{color:var(--mut);font-size:12.5px;line-height:1.3;margin-top:2px}
.bar{height:5px;background:#0004;border-radius:3px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0}
.buy{flex:0 0 auto;min-width:92px;min-height:48px;border:0;border-radius:12px;background:linear-gradient(180deg,#ff9b4f,#e2602a);font-weight:800;font-size:13.5px;padding:6px 8px;line-height:1.2;box-shadow:0 3px 0 #9a3a12}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #9a3a12}
.buy.no{background:#3d3670;box-shadow:0 3px 0 #1d1840;color:#b3abd6}
.buy.done{background:#2b6b52;box-shadow:none;color:#c9ffe6}
.buy small{display:block;font-weight:600;font-size:11.5px;opacity:.9}
.seg{display:flex;gap:6px}
.seg button{border:0;background:var(--card);border-radius:10px;min-width:48px;min-height:40px;font-weight:700;font-size:13px}
.seg button.on{background:var(--acc);color:#1b1030}
.big{width:100%;min-height:54px;border:0;border-radius:14px;font-weight:800;font-size:16px;background:linear-gradient(180deg,#b57cff,#7a3fe0);box-shadow:0 3px 0 #45208a;margin:6px 0}
.big.no{background:#3d3670;box-shadow:none;color:#b3abd6}
.big.alt{background:var(--card2);box-shadow:none;font-size:15px}
.big.danger{background:#7a2235;box-shadow:none;font-size:15px}
.card{background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:8px;font-size:14px;line-height:1.45}
.card b{color:var(--acc2)}
.stat{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid #ffffff10;font-size:14px}
.stat span:last-child{font-weight:700}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach div{background:var(--card);border-radius:12px;padding:9px;font-size:12.5px;color:var(--mut);opacity:.5}
.ach div.got{opacity:1;color:var(--ink);background:linear-gradient(135deg,#3a2f7a,#2a235c);outline:1px solid #ffc65c55}
.ach div b{display:block;font-size:13.5px;color:var(--ink);margin-bottom:2px}
#toasts{position:absolute;top:calc(84px + env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:20}
.toast{background:#2c2466ee;border:1px solid #ffc65c88;border-radius:12px;padding:9px 14px;font-size:14px;max-width:90%;animation:tin 3.2s ease forwards;text-align:center}
@keyframes tin{0%{opacity:0;transform:translateY(-10px)}10%,85%{opacity:1;transform:none}100%{opacity:0}}
#modal{position:absolute;inset:0;background:#05031099;display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
#modal.show{display:flex}
#modal .box{background:var(--bg2);border-radius:18px;padding:18px;width:100%;max-width:420px;border:1px solid #ffffff22;max-height:90%;overflow:auto}
#modal h2{margin:0 0 8px;font-size:20px;color:var(--acc2)}
#modal p{margin:6px 0;line-height:1.45;color:#ddd6f5}
textarea{width:100%;min-height:110px;background:#0e0b20;color:var(--ink);border:1px solid #ffffff22;border-radius:10px;padding:8px;font-size:12px;font-family:ui-monospace,monospace;-webkit-user-select:text;user-select:text}
.two{display:flex;gap:8px}.two>*{flex:1}
.foxb.swarm{display:block}
.sub{display:flex;gap:6px;margin:2px 0 8px}.sub button{flex:1;min-height:46px;border:0;border-radius:12px;background:var(--card);font-weight:800;font-size:14px;color:var(--mut)}
.sub button.on{background:linear-gradient(180deg,#ffd27a,#ff9b4f);color:#1b1030}
.row.beast{position:relative;overflow:hidden;background:linear-gradient(135deg,#3a1d63,#1c2a63);box-shadow:0 0 16px var(--bc),inset 0 0 0 1.5px var(--bc)}
.row.beast::before{content:'';position:absolute;left:-50%;top:-150%;width:200%;height:400%;background:conic-gradient(from 0deg,transparent 0 70%,var(--bc) 85%,transparent 100%);animation:spin 5s linear infinite;opacity:.35;pointer-events:none}
.row.beast>*{position:relative}
.row.beast .ic{filter:drop-shadow(0 0 8px var(--bc))}
.row.beast.sleep{box-shadow:none;filter:grayscale(.85);opacity:.55}.row.beast.sleep::before{display:none}
.row.god{background:linear-gradient(135deg,#43306e,#2b2156);box-shadow:inset 0 0 0 1px #ffe08a55}
.tails{color:var(--acc2);font-size:11.5px;letter-spacing:1px}
#orb.beastorb{background:radial-gradient(circle at 35% 30%,#fff 0,var(--bc) 28%,#7a1f8a 70%,#22093f 100%);box-shadow:0 0 50px var(--bc),0 0 120px var(--bc),inset 0 -12px 30px #0006}
#orb.storm{animation:stormp .35s ease-in-out infinite alternate}
@keyframes stormp{to{box-shadow:0 0 70px #9ee7ff,0 0 140px #5a8cff,inset 0 -12px 30px #0006}}
#abar{position:absolute;left:6px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:7}
#abar button{width:46px;height:46px;border-radius:50%;border:0;background:radial-gradient(circle,#4b3a8f,#2a2160);box-shadow:0 0 10px #ffe08a88;font-size:21px;position:relative;padding:0}
#abar button.cd{filter:grayscale(1);opacity:.55;box-shadow:none}
#abar button i{position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);font-style:normal;font-size:9.5px;font-weight:800;background:#100d22;border-radius:6px;padding:0 3px;white-space:nowrap;color:var(--ink)}
#fx{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#0008 0,#000d 70%);pointer-events:none}
#fx.show{display:flex;animation:fxin 2.8s ease forwards}
#fx .em{font-size:130px;line-height:1;animation:summ 2.8s ease forwards;filter:drop-shadow(0 0 30px var(--bc)) drop-shadow(0 0 60px var(--bc))}
#fx .tx{font-size:22px;font-weight:900;color:#fff;text-shadow:0 0 14px var(--bc);margin-top:14px;text-align:center;padding:0 20px}
#fx .tx small{display:block;font-size:14px;color:var(--acc2);margin-top:4px}
@keyframes summ{0%{transform:scale(.1) rotate(-40deg);opacity:0}30%{transform:scale(1.35) rotate(6deg);opacity:1}45%{transform:scale(1) rotate(0)}85%{opacity:1}100%{opacity:0;transform:scale(1.15)}}
@keyframes fxin{0%{opacity:0}8%,85%{opacity:1}100%{opacity:0}}
.toggle{display:flex;gap:8px;align-items:center}
@media (min-height:820px){#tapZone{flex-basis:36vh}}
@media (hover:hover){.buy:hover{filter:brightness(1.08)} nav button:hover{color:var(--ink)}}
</style>
</head>
<body>
<div id="app">
 <header>
  <div id="seal" title="Spirit Seals / Divinity"><span>🔮 <span id="sealN">0</span></span><span id="divW">✴️ <span id="divN">0</span></span></div>
  <button id="soundBtn" aria-label="Toggle sound">🔊</button>
  <div class="ki"><span id="ki">0</span><small>Ki</small></div>
  <div class="kps"><span id="kps">0</span> Ki/sec · <span id="tapv">1</span> per tap</div>
  <div class="buffs" id="buffs"></div>
 </header>
 <div id="toasts"></div>
 <div id="tapZone">
  <button id="orb" aria-label="Train"><span class="ring"></span><span class="glyph">気</span></button>
  <button id="fox" class="foxb" aria-label="Spirit fox">🦊</button>
  <div id="abar"></div>
 </div>
 <div id="panel"></div>
 <nav id="nav">
  <button data-tab="clan" class="on"><span class="dot"></span><b>🥷</b>Clan</button>
  <button data-tab="tech"><span class="dot"></span><b>📜</b>Train</button>
  <button data-tab="blood"><span class="dot"></span><b>🩸</b>Blood</button>
  <button data-tab="beast"><span class="dot"></span><b>🐾</b>Beasts</button>
  <button data-tab="ascend"><span class="dot"></span><b>🔮</b>Rebirth</button>
  <button data-tab="more"><span class="dot"></span><b>🏆</b>More</button>
 </nav>
 <div id="modal"><div class="box" id="mbox"></div></div>
 <div id="fx"><div class="em" id="fxEm"></div><div class="tx" id="fxTx"></div></div>
</div>
<script>
(function(){
"use strict";
var VERSION='2.0.0', KEY='bloodlineDojo.save.v1';

/* ---------- DATA ---------- */
var GENS=[
 {id:'recruit',name:'Village Recruit',ic:'🧒',base:15,rate:0.1,d:'Sweeps the dojo floor and dreams big.'},
 {id:'student',name:'Dojo Student',ic:'🥋',base:100,rate:1,d:'Practices forms from dawn to dusk.'},
 {id:'scout',name:'Forest Scout',ic:'🏹',base:1100,rate:8,d:'Gathers Ki from the whispering woods.'},
 {id:'runner',name:'Shadow Runner',ic:'🥷',base:12000,rate:47,d:'Moves faster than rumors.'},
 {id:'warrior',name:'Clan Warrior',ic:'⚔️',base:130000,rate:260,d:'Sworn protector of the clan gates.'},
 {id:'blade',name:'Blade Master',ic:'🗡️',base:1.4e6,rate:1400,d:'Cuts waterfalls in half for practice.'},
 {id:'sage',name:'Mountain Sage',ic:'🧙',base:2e7,rate:7800,d:'Meditates above the clouds.'},
 {id:'tamer',name:'Spirit Beast Tamer',ic:'🐺',base:3.3e8,rate:44000,d:'Bonded with wolves of living wind.'},
 {id:'elder',name:'Elder Council',ic:'⛩️',base:5.1e9,rate:260000,d:'Ancient minds guiding the whole clan.'},
 {id:'storm',name:'Storm Monastery',ic:'🌩️',base:7.5e10,rate:1.6e6,d:'Monks who bottle lightning.'},
 {id:'phoenix',name:'Phoenix Shrine',ic:'🔥',base:1e12,rate:1e7,d:'Eternal flame, eternal training.'},
 {id:'voidt',name:'Void Temple',ic:'🌌',base:1.4e13,rate:6.5e7,d:'Draws Ki from the space between stars.'}
];
var GROWTH=1.15, MILES=[10,25,50,100,150,200,250,300,400,500,600,700,800,900,1000];

var TECHS=[
 {id:'focus',name:'Focus Training',ic:'👊',max:200,cost:function(l){return 25*Math.pow(1.45,l)},d:function(l){return '+1 base Ki per tap (now +'+l+'). Every 25 levels doubles taps.'}},
 {id:'flow',name:'Flowing Strike',ic:'🌊',max:15,cost:function(l){return 5000*Math.pow(9,l)},d:function(l){return 'Each tap also adds 1% of your Ki/sec (now '+l+'%).'}},
 {id:'drill',name:'Clan Drills',ic:'🏯',max:20,cost:function(l){return 20000*Math.pow(12,l)},d:function(l){return 'All clan production +25% per level (now +'+(l*25)+'%).'}}
];

// effects: tap, all, gens:{id:mult}, crit, critX, offline, offX, offH, fox, foxR, foxF, frz, frzT, echo, tapK, beast, seal
// req: {asc:n} lifetime Ascensions or {god:n} God Rebirths needed before it can be awakened
var BLOODS=[
 {id:'ember',name:'Ember Eye',ic:'👁️',cost:500,d:'Taps ×2. Your eyes glow like coals.',fx:{tap:2}},
 {id:'thorn',name:'Thornblood',ic:'🌵',cost:2500,req:{asc:1},d:'Taps ×2. Critical taps hit ×25 instead of ×10.',fx:{tap:2,critX:25}},
 {id:'stone',name:'Stoneblood',ic:'🪨',cost:6000,d:'Recruits, Students and Scouts ×3.',fx:{gens:{recruit:3,student:3,scout:3}}},
 {id:'wind',name:'Swift Wind',ic:'🍃',cost:60000,d:'All production ×1.5.',fx:{all:1.5}},
 {id:'ash',name:'Ashen Root',ic:'🌳',cost:2e5,req:{asc:3},d:'Recruits, Students, Scouts and Shadow Runners ×5.',fx:{gens:{recruit:5,student:5,scout:5,runner:5}}},
 {id:'lotus',name:'Crimson Lotus',ic:'🌺',cost:600000,d:'10% of taps are critical hits for ×10.',fx:{crit:1}},
 {id:'mist',name:'Mistwalker',ic:'🌫️',cost:4e6,d:'Offline earnings at 100% (not 50%) and +4h offline limit.',fx:{offline:1}},
 {id:'iron',name:'Iron Will',ic:'🛡️',cost:3e7,d:'Runners, Warriors and Blade Masters ×3.',fx:{gens:{runner:3,warrior:3,blade:3}}},
 {id:'drift',name:'Dreamdrift',ic:'💤',cost:5e7,req:{asc:5},d:'Offline earnings ×2 and +6h offline limit.',fx:{offX:2,offH:6}},
 {id:'storm',name:'Storm Veins',ic:'⚡',cost:2.5e8,d:'All production ×2. Taps ×2.',fx:{all:2,tap:2}},
 {id:'lantern',name:'Lanternkin',ic:'🏮',cost:1e9,req:{asc:8},d:'Spirit fox gifts ×5 and foxes appear 50% more often.',fx:{foxR:5,foxF:1.5}},
 {id:'moon',name:'Moon Fang',ic:'🌙',cost:3e9,d:'Spirit foxes appear twice as often and give double rewards.',fx:{fox:1}},
 {id:'sagel',name:'Sage Lineage',ic:'📿',cost:4e10,d:'Sages, Beast Tamers and the Elder Council ×3.',fx:{gens:{sage:3,tamer:3,elder:3}}},
 {id:'hollow',name:'Hollow Echo',ic:'🔔',cost:1e11,req:{asc:12},d:'Auto Clicker taps ×5. Taps ×3.',fx:{echo:5,tap:3}},
 {id:'celest',name:'Celestial Iris',ic:'✨',cost:8e11,d:'All production ×3. Taps ×3.',fx:{all:3,tap:3}},
 {id:'voidh',name:'Void Heart',ic:'🖤',cost:5e13,d:'Monastery, Shrine and Void Temple ×3. All production ×2.',fx:{all:2,gens:{storm:3,phoenix:3,voidt:3}}},
 {id:'gale',name:'Galeborn',ic:'🌪️',cost:1e14,req:{asc:20},d:'Fox Frenzy is ×12 (not ×5) and lasts twice as long. All production ×2.',fx:{frz:12,frzT:2,all:2}},
 {id:'dragon',name:'Dragon Soul',ic:'🐉',cost:5e15,d:'All production ×5.',fx:{all:5}},
 {id:'cinder',name:'Cinder Crown',ic:'👑',cost:1e17,req:{asc:30},d:'Warriors, Blade Masters, Sages and Beast Tamers ×6.',fx:{gens:{warrior:6,blade:6,sage:6,tamer:6}}},
 {id:'abyss',name:'Abyssal Tide',ic:'🌊',cost:3e21,req:{asc:45},d:'All production ×4. +8h offline limit.',fx:{all:4,offH:8}},
 {id:'starf',name:'Starforged',ic:'☄️',cost:3e27,req:{asc:65},d:'Each tap also adds 5% of your Ki/sec. All production ×3.',fx:{tapK:0.05,all:3}},
 {id:'wild',name:'Wildheart Bond',ic:'🐾',cost:1e38,req:{asc:100},d:'Spirit beasts ×10.',fx:{beast:10}},
 {id:'sealw',name:'Sealweaver',ic:'🪬',cost:1e40,req:{asc:125},d:'+50% Spirit Seals from Ascending. All production ×3.',fx:{seal:1.5,all:3}},
 {id:'aurora',name:'Aurora Veil',ic:'🌈',cost:1e30,req:{god:1},d:'All production ×10. Taps ×10.',fx:{all:10,tap:10}},
 {id:'eternal',name:'Eternal Ember',ic:'🕯️',cost:1e35,req:{god:2},d:'Monastery, Shrine and Void Temple ×25. Spirit beasts ×5.',fx:{gens:{storm:25,phoenix:25,voidt:25},beast:5}},
 {id:'godspark',name:'Godspark Blood',ic:'✴️',cost:1e42,req:{god:3},d:'All production ×25. Offline at 100% with +12h limit. Spirit beasts ×3.',fx:{all:25,offline:1,offH:12,beast:3}}
];

var CLICK_TPS=[0,1,2,3,5,8,12,20,30,50,75,100,150,200,300];
function clickTps(l){return CLICK_TPS[Math.min(l,CLICK_TPS.length-1)]}
// Rebirth Shop: bought with Spirit Seals, kept through Ascension, reset by God Rebirth. eff(l) = effect at tier l.
var PERKS=[
 {id:'echo',cat:'⚙️ Auto Clicker',name:'Auto Clicker',ic:'🖱️',max:14,cost:function(l){return Math.ceil(Math.pow(1.6,l))},eff:function(l){return l?clickTps(l)+' auto-taps/sec':'No auto-taps'}},

var ACH_BONUS=0.02, SEAL_BONUS=0.10, SEAL_DIV=7.5e5, ASC_MIN=3e6, ASC_G=2, GOD_ASC=100, BASE_OFFLINE_H=2, MASTERY=0.03, DIV_BONUS=0.5, MAXN=1e300;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var rng=(typeof window!=='undefined'&&typeof window.BD_SEED==='number')?mulberry32(window.BD_SEED):Math.random;
var SIXTH_BASE=0.01,SIXTH_STEP=0.005,SIXTH_MULT=10;
function cl(x){return x>=MAXN?MAXN:(x>0?x:0)} // clamp: no Infinity / NaN / negatives ever reach the save

/* ---------- STATE ---------- */
function fresh(){
 var s={v:2,ki:0,run:0,life:0,taps:0,crits:0,foxes:0,asc:0,sealsTotal:0,sealsSpent:0,offlineGot:0,
  gens:{},tech:{},bloods:{},perks:{},ach:{},sound:true,sci:false,buyQty:1,
  started:Date.now(),runStart:Date.now(),played:0,lastSeen:Date.now(),frenzyUntil:0,best:0,
  ascLife:0,god:0,divTotal:0,divSpent:0,beasts:{},abil:{},cd:{},stormUntil:0,rampUntil:0,autoAsc:false,autoPct:0,autoBuy:true,runT:0,sixth:0,sixthLife:0};
 GENS.forEach(function(g){s.gens[g.id]=0});TECHS.forEach(function(t){s.tech[t.id]=0});PERKS.forEach(function(p){s.perks[p.id]=0});
 BEASTS.forEach(function(b){s.beasts[b.id]=0});ABIL.forEach(function(a){s.abil[a.id]=0});
 return s;
}
var S=fresh();

/* ---------- FORMAT ---------- */
var SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','UDc','DDc','TDc','QaDc','QiDc','SxDc','SpDc','OcDc','NoDc','Vg'];
function fmt(n){
 if(n!==n)return '0';
 if(!isFinite(n))return '∞';
 if(n<0)return '-'+fmt(-n);
 if(n<1000){return (n<100&&n%1>0.0001&&n<10)?n.toFixed(1):Math.floor(n).toString();}
 var e=Math.floor(Math.log10(n)/3);
 if(S.sci||e>=SUF.length){return n.toExponential(2).replace('e+','e');}
 var v=n/Math.pow(1000,e);
 var t=v<10?v.toFixed(2):v<100?v.toFixed(1):Math.floor(v).toString();
 if(parseFloat(t)>=1000&&e+1<SUF.length){return '1.00'+SUF[e+1];}
 return t+SUF[e];
}
function fmtTime(sec){sec=Math.floor(sec);var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?h+'h '+m+'m':m?m+'m '+s+'s':s+'s'}

/* ---------- MATH ---------- */
function totalGens(){var t=0;for(var k in S.gens)t+=S.gens[k];return t}
function countBloods(){var c=0;for(var k in S.bloods)if(S.bloods[k])c++;return c}
function countAch(){var c=0;for(var k in S.ach)if(S.ach[k])c++;return c}
function has(fx){return BLOODS.some(function(b){return S.bloods[b.id]&&b.fx[fx]})}
function bloodMult(kind){var m=1;BLOODS.forEach(function(b){if(S.bloods[b.id]&&b.fx[kind])m*=b.fx[kind]});return m}
function bloodSum(kind){var m=0;BLOODS.forEach(function(b){if(S.bloods[b.id]&&b.fx[kind])m+=b.fx[kind]});return m}
function bloodMax(kind,d){var m=d;BLOODS.forEach(function(b){if(S.bloods[b.id]&&b.fx[kind]&&b.fx[kind]>m)m=b.fx[kind]});return m}
function genBloodMult(id){var m=1;BLOODS.forEach(function(b){if(S.bloods[b.id]&&b.fx.gens&&b.fx.gens[id])m*=b.fx.gens[id]});return m}
function bloodOpen(b){var r=b.req;if(!r)return true;if(r.asc&&S.ascLife<r.asc)return false;if(r.god&&S.god<r.god)return false;return true}
function reqText(b){var r=b.req;return r.god?'God Rebirth '+r.god+'×':'Ascend '+r.asc+'× total'}
function mileMult(n){var m=1;for(var i=0;i<MILES.length;i++)if(n>=MILES[i])m*=2;return m}
function nextMile(n){for(var i=0;i<MILES.length;i++)if(n<MILES[i])return MILES[i];return 0}
function sealMult(){return 1+SEAL_BONUS*S.sealsTotal}
function achMult(){return 1+ACH_BONUS*countAch()}
function masteryMult(){return 1+MASTERY*S.ascLife}
function divAvail(){return S.divTotal-S.divSpent}
function divMult(){return 1+DIV_BONUS*S.divTotal}
function globalMult(){return cl(bloodMult('all')*sealMult()*achMult()*(1+0.25*S.tech.drill)*masteryMult()*divMult()*Math.pow(1.5,S.perks.kimult)*sixthMult())}
function sixthMult(){return S.sixth?SIXTH_MULT:1}
function sixthChance(){return sixthChanceAt(S.perks.sixc||0)}
// Sixth Path: rare roll at the start of every run; x10 production for that run only
function rollSixth(quiet){S.sixth=rng()<sixthChance()?1:0;if(S.sixth){S.sixthLife++;if(!quiet&&typeof document!=='undefined'&&document.getElementById('fx')){bigFx('🌟','#fff1a8','Born on the Sixth Path!<small>This run: ×10 total production</small>');snd('asc')}}return S.sixth}
function frenzyX(){return bloodMax('frz',5)}
function frenzy(){return Date.now()<S.frenzyUntil?frenzyX():1}
function stormX(){return Date.now()<S.stormUntil?100:1}
function rampX(){return Date.now()<S.rampUntil?10:1}
function genRate(g){return cl(g.rate*mileMult(S.gens[g.id])*genBloodMult(g.id)*globalMult())} // per unit
/* spirit beasts: unlocked by lifetime Ascensions, levels persist through Ascension */
function beastOpen(b){return S.ascLife>=b.at}
function beastLv(b){return S.beasts[b.id]||0}
function beastCount(){var c=0;BEASTS.forEach(function(b){if(beastLv(b)>0)c++});return c}
function beastMult(){return bloodMult('beast')*Math.pow(3,S.abil.bascend||0)}
function beastCost(b){return cl(BEAST_C0*Math.pow(BEAST_CS,b.tails-1)*Math.pow(BEAST_G,beastLv(b)))}
function beastRate(b){var L=beastLv(b);if(!L)return 0;return cl(BEAST_R0*Math.pow(BEAST_RS,b.tails-1)*L*Math.pow(2,Math.floor(L/BEAST_MILE))*beastMult()*globalMult()*rampX())}
function beastKps(){var t=0;BEASTS.forEach(function(b){t+=beastRate(b)});return cl(t)}
function clanKps(){var t=0;GENS.forEach(function(g){t+=S.gens[g.id]*genRate(g)});return cl(t)}
function baseKps(){return cl(clanKps()+beastKps())}
function kps(){return cl(baseKps()*frenzy())}
function tapValue(){
 var f=S.tech.focus;
 var v=(1+f)*Math.pow(2,Math.floor(f/25))*bloodMult('tap')*sealMult()*achMult()*masteryMult()*divMult()*Math.pow(1.5,S.perks.kimult)*sixthMult()+kps()*(0.01*S.tech.flow+bloodSum('tapK'))+beastKps()*0.02*beastCount();
 return cl(v*stormX());
}
function gBase(g){return g.base*(1-0.05*S.perks.thrift)}
function genCost(g,n,k){var c=gBase(g)*Math.pow(GROWTH,n);return c*(Math.pow(GROWTH,k)-1)/(GROWTH-1)}
function genMaxAfford(g){var n=S.gens[g.id],c=gBase(g)*Math.pow(GROWTH,n);if(!isFinite(c))return 0;var k=Math.floor(Math.log(S.ki*(GROWTH-1)/c+1)/Math.log(GROWTH));while(k>0&&genCost(g,n,k)>S.ki)k--;return Math.max(0,k)}
function bloodCost(b){return b.cost*(1-0.1*S.perks.memory)}
function sealGainMult(){return (1+0.25*S.perks.reson)*(1+0.5*(S.abil.font||0))*bloodMult('seal')}
function ascMin(){return cl(ASC_MIN*Math.pow(ASC_G,S.asc))} // first rebirth at 3M Ki, doubling with each Ascension in this God cycle
var SWIFT=[420,360,300,270,240,210,180,150];
function minRun(){return SWIFT[Math.min(S.perks.swift,SWIFT.length-1)]*Math.pow(0.75,S.abil.dilate||0)} // seconds a run must last before it can Ascend
function runWait(){return Math.max(0,minRun()-S.runT)}
function sealsOnAscend(){return (S.run<ascMin()||S.runT<minRun())?0:Math.floor(cl(Math.sqrt(S.run/SEAL_DIV)*sealGainMult()))}
function divOnGod(){return S.asc<GOD_ASC?0:Math.floor(cl(10*Math.pow(1.05,S.asc-GOD_ASC)))} // 10 Divinity at 100 Ascensions, +5% per extra one
function sealsAvail(){return S.sealsTotal-S.sealsSpent}
function offlineCapH(){return BASE_OFFLINE_H+2*S.perks.deep+(has('offline')?4:0)+bloodSum('offH')}
function offlineRate(){return ((has('offline')?1:0.5)+0.1*S.perks.offrate)*bloodMult('offX')}

function earn(x){if(!(x>0))return;S.ki=cl(S.ki+x);S.run=cl(S.run+x);S.life=cl(S.life+x)}

/* ---------- ACTIONS ---------- */
function tap(x,y,echo){
 var v=tapValue(),crit=false;
 if(echo)v*=bloodMult('echo');
 if(has('crit')&&Math.random()<0.10){v*=bloodMax('critX',10);crit=true;S.crits++}
 v=cl(v);earn(v);S.taps++;
 if(x!=null){floatNum(x,y,'+'+fmt(v),crit);sparks(x,y,crit?10:5);snd(crit?'crit':'tap')}
 return v;
}
function buyGen(id,qty,quiet){
 var g=GENS.find(function(x){return x.id===id});if(!g)return false;
 var k=qty==='max'?genMaxAfford(g):qty;if(k<1)return false;
 var c=genCost(g,S.gens[id],k);if(!isFinite(c)||!(c<=S.ki*(1+1e-12)+1e-9))return false;
 var before=nextMile(S.gens[id]);
 S.ki=cl(S.ki-c);S.gens[id]+=k;
 if(!quiet&&before&&S.gens[id]>=before)toast('⚡ '+g.name+' milestone! Production ×2');
 return true;
}
function buyTech(id){var t=TECHS.find(function(x){return x.id===id});var l=S.tech[id];if(l>=t.max)return false;var c=t.cost(l);if(c>S.ki)return false;S.ki=cl(S.ki-c);S.tech[id]++;return true}
function buyBlood(id,quiet){var b=BLOODS.find(function(x){return x.id===id});if(!b||S.bloods[id]||!bloodOpen(b))return false;var c=bloodCost(b);if(c>S.ki)return false;S.ki=cl(S.ki-c);S.bloods[id]=1;if(!quiet)toast(b.ic+' '+b.name+' awakened!');return true}
function buyPerk(id){var p=PERKS.find(function(x){return x.id===id});var l=S.perks[id];if(l>=p.max)return false;var c=p.cost(l);if(c>sealsAvail())return false;S.sealsSpent+=c;S.perks[id]++;return true}
function autoTaps(n){ // Auto Clicker: n taps in one batch (keeps 300 taps/sec cheap on phones)
 var v=tapValue()*bloodMult('echo'),p=0,x=bloodMax('critX',10);
 if(has('crit'))p+=0.10;p+=0.10*S.perks.critc;p=Math.min(p,1);
 var c=0;if(p>0){if(n<=20){for(var i=0;i<n;i++)if(Math.random()<p)c++}else{c=Math.floor(n*p);if(Math.random()<n*p-c)c++}}
 earn(cl(v*(n+c*(x-1))));S.taps+=n;S.crits+=c;return c}
function buyBeast(id,quiet){var b=BEASTS.find(function(x){return x.id===id});if(!b||!beastOpen(b))return false;var c=beastCost(b);if(!(c<=S.ki))return false;
 var first=!beastLv(b);S.ki=cl(S.ki-c);S.beasts[id]=beastLv(b)+1;if(first&&!quiet){summonFx(b);snd('asc')}if(first)checkAch();return true}
function legacyKeep(){var n=6*(S.abil.legacy||0)+S.perks.keep,out=[];for(var i=0;i<BLOODS.length&&out.length<n;i++){if(bloodOpen(BLOODS[i]))out.push(BLOODS[i].id)}return out}
function ascend(){
 var g=sealsOnAscend();if(g<1)return false;
 var opened=BEASTS.filter(beastOpen).length;
 S.sealsTotal=cl(S.sealsTotal+g);S.asc++;S.ascLife++;
 S.ki=startKi(S.perks.start);S.run=0;S.frenzyUntil=0;S.runStart=Date.now();S.runT=0;
 GENS.forEach(function(x){S.gens[x.id]=0});TECHS.forEach(function(t){S.tech[t.id]=0});

function step(dt){ // seconds, online
 earn(kps()*dt);S.played+=dt;S.runT+=dt;
 if(S.perks.echo){echoAcc+=dt*clickTps(S.perks.echo);var n=Math.floor(echoAcc);if(n>0){echoAcc-=n;autoTaps(n)}}

 achAcc+=dt;if(achAcc>=1){achAcc=0;checkAch()}
 if(!(S.ki>=0))S.ki=0;if(!(S.run>=0))S.run=0;
}
function tick(){
 var now=Date.now(),dt=(now-last)/1000;last=now;
 if(paused)return;
 if(dt<0)dt=0;
 if(dt>10){applyOffline(dt,true);dt=0}
 step(dt);
 if(!foxUntil&&now>=foxAt&&foxAt)showFox();
 if(foxUntil&&now>foxUntil){$('fox').style.display='none';foxUntil=0;scheduleFox()}
}

function onOrb(e){e.preventDefault();ac();var z=$('tapZone').getBoundingClientRect();var x=(e.clientX||z.width/2+z.left)-z.left,y=(e.clientY||z.height/2+z.top)-z.top;
