<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14112a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%B7%3C/text%3E%3C/svg%3E">
<title>Bloodline Dojo: Idle Ninja</title>
<style>
:root{--bg:#14112a;--bg2:#1e1940;--card:#262052;--card2:#2f2863;--ink:#f3eefc;--mut:#a79fcb;--acc:#ff8a3d;--acc2:#ffc65c;--good:#5fe0a0;--bad:#ff6b7a;--blue:#7cc4ff;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
body{touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;background:linear-gradient(180deg,#1b1638,#14112a 40%);position:relative;padding-top:env(safe-area-inset-top)}
header{padding:10px 14px 6px;text-align:center;position:relative}
.ki{font-size:30px;font-weight:800;letter-spacing:.5px;line-height:1.1}
.ki small{font-size:15px;color:var(--acc2);font-weight:700;margin-left:4px}
.kps{color:var(--mut);font-size:14px;margin-top:2px}
.buffs{min-height:20px;font-size:13px;color:var(--acc2);font-weight:700}
#soundBtn{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);font-size:20px}
#seal{position:absolute;left:10px;top:10px;min-width:44px;height:44px;padding:0 10px;border-radius:22px;background:var(--card);font-size:13px;font-weight:700;display:flex;flex-direction:column;justify-content:center;line-height:1.15;max-width:96px;overflow:hidden;white-space:nowrap}
#divW{color:#ffe08a;display:none}
.buffs .six{display:inline-block;background:linear-gradient(90deg,#fff1a8,#ffb347);color:#2a1440;border-radius:10px;padding:0 8px;box-shadow:0 0 12px #fff1a8;animation:sixg 1.6s ease-in-out infinite alternate}
@keyframes sixg{to{box-shadow:0 0 22px #ffd23d}}
#tapZone{position:relative;flex:0 0 34vh;min-height:190px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#orb{width:min(30vh,240px);height:min(30vh,240px);min-width:150px;min-height:150px;border-radius:50%;border:0;position:relative;touch-action:none;
 background:radial-gradient(circle at 35% 30%,#fff3c4 0,#ffb347 18%,#ff6a2b 45%,#9c1f5a 75%,#3b1060 100%);
 box-shadow:0 0 40px #ff7a3a88,0 0 90px #b03cff44,inset 0 -12px 30px #0005;transition:transform .06s}
#orb.hit{transform:scale(.93)}
#orb .ring{position:absolute;inset:-14px;border-radius:50%;border:3px dashed #ffc65c66;animation:spin 14s linear infinite;pointer-events:none}
#orb .glyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(11vh,86px);font-weight:900;color:#fff8;text-shadow:0 0 18px #fff;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.float{position:absolute;pointer-events:none;font-weight:900;font-size:22px;color:#fff;text-shadow:0 2px 6px #000,0 0 10px var(--acc);animation:up .9s ease-out forwards;white-space:nowrap;z-index:5}
.float.crit{color:var(--acc2);font-size:30px}
@keyframes up{0%{transform:translate(-50%,-50%) scale(.7);opacity:1}20%{transform:translate(-50%,-80%) scale(1.15)}100%{transform:translate(-50%,-260%) scale(1);opacity:0}}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--acc2);pointer-events:none;animation:spark .6s ease-out forwards;z-index:4}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
#fox,.foxb{position:absolute;width:64px;height:64px;border-radius:50%;border:0;background:radial-gradient(circle,#fff 0,#bdf3ff 40%,#5ab6ff00 72%);font-size:38px;display:none;z-index:6;animation:bob 1.4s ease-in-out infinite;touch-action:none}
@keyframes bob{50%{transform:translateY(-10px) scale(1.08)}}
#panel{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 10px 16px;border-top:1px solid #ffffff14;background:var(--bg2);border-radius:18px 18px 0 0}
nav{display:flex;background:#100d22;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #ffffff14}
nav button{flex:1;border:0;background:none;padding:8px 2px 9px;min-height:58px;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button b{font-size:21px;line-height:1.1}
nav button.on{color:var(--acc2);background:#ffffff08}
nav button .dot{position:absolute;top:6px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--acc);display:none}
nav button.has .dot{display:block}
h3{margin:8px 4px 6px;font-size:15px;color:var(--acc2);display:flex;justify-content:space-between;align-items:center}
.hint{color:var(--mut);font-size:13px;margin:0 4px 8px;line-height:1.35}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--r);padding:10px;margin-bottom:8px;min-height:64px}
.row.locked{opacity:.45}
.row .ic{font-size:30px;width:42px;text-align:center;flex:0 0 42px}
.row .mid{flex:1;min-width:0}
.row .nm{font-weight:700;font-size:15px}
.row .nm .own{color:var(--acc2);margin-left:6px}
.row .ds{color:var(--mut);font-size:12.5px;line-height:1.3;margin-top:2px}
.bar{height:5px;background:#0004;border-radius:3px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0}
.buy{flex:0 0 auto;min-width:92px;min-height:48px;border:0;border-radius:12px;background:linear-gradient(180deg,#ff9b4f,#e2602a);font-weight:800;font-size:13.5px;padding:6px 8px;line-height:1.2;box-shadow:0 3px 0 #9a3a12}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #9a3a12}
.buy.no{background:#3d3670;box-shadow:0 3px 0 #1d1840;color:#b3abd6}
.buy.done{background:#2b6b52;box-shadow:none;color:#c9ffe6}
.buy small{display:block;font-weight:600;font-size:11.5px;opacity:.9}
.seg{display:flex;gap:6px}
.seg button{border:0;background:var(--card);border-radius:10px;min-width:48px;min-height:40px;font-weight:700;font-size:13px}
.seg button.on{background:var(--acc);color:#1b1030}
.big{width:100%;min-height:54px;border:0;border-radius:14px;font-weight:800;font-size:16px;background:linear-gradient(180deg,#b57cff,#7a3fe0);box-shadow:0 3px 0 #45208a;margin:6px 0}
.big.no{background:#3d3670;box-shadow:none;color:#b3abd6}
.big.alt{background:var(--card2);box-shadow:none;font-size:15px}
.big.danger{background:#7a2235;box-shadow:none;font-size:15px}
.card{background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:8px;font-size:14px;line-height:1.45}
.card b{color:var(--acc2)}
.stat{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid #ffffff10;font-size:14px}
.stat span:last-child{font-weight:700}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach div{background:var(--card);border-radius:12px;padding:9px;font-size:12.5px;color:var(--mut);opacity:.5}
.ach div.got{opacity:1;color:var(--ink);background:linear-gradient(135deg,#3a2f7a,#2a235c);outline:1px solid #ffc65c55}
.ach div b{display:block;font-size:13.5px;color:var(--ink);margin-bottom:2px}
#toasts{position:absolute;top:calc(84px + env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:20}
.toast{background:#2c2466ee;border:1px solid #ffc65c88;border-radius:12px;padding:9px 14px;font-size:14px;max-width:90%;animation:tin 3.2s ease forwards;text-align:center}
@keyframes tin{0%{opacity:0;transform:translateY(-10px)}10%,85%{opacity:1;transform:none}100%{opacity:0}}
#modal{position:absolute;inset:0;background:#05031099;display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
#modal.show{display:flex}
#modal .box{background:var(--bg2);border-radius:18px;padding:18px;width:100%;max-width:420px;border:1px solid #ffffff22;max-height:90%;overflow:auto}
#modal h2{margin:0 0 8px;font-size:20px;color:var(--acc2)}
#modal p{margin:6px 0;line-height:1.45;color:#ddd6f5}
textarea{width:100%;min-height:110px;background:#0e0b20;color:var(--ink);border:1px solid #ffffff22;border-radius:10px;padding:8px;font-size:12px;font-family:ui-monospace,monospace;-webkit-user-select:text;user-select:text}
.two{display:flex;gap:8px}.two>*{flex:1}
.foxb.swarm{display:block}
.sub{display:flex;gap:6px;margin:2px 0 8px}.sub button{flex:1;min-height:46px;border:0;border-radius:12px;background:var(--card);font-weight:800;font-size:14px;color:var(--mut)}
.sub button.on{background:linear-gradient(180deg,#ffd27a,#ff9b4f);color:#1b1030}
.row.beast{position:relative;overflow:hidden;background:linear-gradient(135deg,#3a1d63,#1c2a63);box-shadow:0 0 16px var(--bc),inset 0 0 0 1.5px var(--bc)}
.row.beast::before{content:'';position:absolute;left:-50%;top:-150%;width:200%;height:400%;background:conic-gradient(from 0deg,transparent 0 70%,var(--bc) 85%,transparent 100%);animation:spin 5s linear infinite;opacity:.35;pointer-events:none}
.row.beast>*{position:relative}
.row.beast .ic{filter:drop-shadow(0 0 8px var(--bc))}
.row.beast.sleep{box-shadow:none;filter:grayscale(.85);opacity:.55}.row.beast.sleep::before{display:none}
.row.god{background:linear-gradient(135deg,#43306e,#2b2156);box-shadow:inset 0 0 0 1px #ffe08a55}
.tails{color:var(--acc2);font-size:11.5px;letter-spacing:1px}
#orb.beastorb{background:radial-gradient(circle at 35% 30%,#fff 0,var(--bc) 28%,#7a1f8a 70%,#22093f 100%);box-shadow:0 0 50px var(--bc),0 0 120px var(--bc),inset 0 -12px 30px #0006}
#orb.storm{animation:stormp .35s ease-in-out infinite alternate}
@keyframes stormp{to{box-shadow:0 0 70px #9ee7ff,0 0 140px #5a8cff,inset 0 -12px 30px #0006}}
#abar{position:absolute;left:6px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:7}
#abar button{width:46px;height:46px;border-radius:50%;border:0;background:radial-gradient(circle,#4b3a8f,#2a2160);box-shadow:0 0 10px #ffe08a88;font-size:21px;position:relative;padding:0}
#abar button.cd{filter:grayscale(1);opacity:.55;box-shadow:none}
#abar button i{position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);font-style:normal;font-size:9.5px;font-weight:800;background:#100d22;border-radius:6px;padding:0 3px;white-space:nowrap;color:var(--ink)}
#fx{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#0008 0,#000d 70%);pointer-events:none}
#fx.show{display:flex;animation:fxin 2.8s ease forwards}
#fx .em{font-size:130px;line-height:1;animation:summ 2.8s ease forwards;filter:drop-shadow(0 0 30px var(--bc)) drop-shadow(0 0 60px var(--bc))}
#fx .tx{font-size:22px;font-weight:900;color:#fff;text-shadow:0 0 14px var(--bc);margin-top:14px;text-align:center;padding:0 20px}
#fx .tx small{display:block;font-size:14px;color:var(--acc2);margin-top:4px}
@keyframes summ{0%{transform:scale(.1) rotate(-40deg);opacity:0}30%{transform:scale(1.35) rotate(6deg);opacity:1}45%{transform:scale(1) rotate(0)}85%{opacity:1}100%{opacity:0;transform:scale(1.15)}}
@keyframes fxin{0%{opacity:0}8%,85%{opacity:1}100%{opacity:0}}
.toggle{display:flex;gap:8px;align-items:center}
@media (min-height:820px){#tapZone{flex-basis:36vh}}
@media (hover:hover){.buy:hover{filter:brightness(1.08)} nav button:hover{color:var(--ink)}}
/* ---- v2.1 ---- */
#panel{padding:8px 10px 20px}
h3 .cnt,.cnt{font-size:12.5px;color:var(--mut);font-weight:700}
h3.cat{font-size:13.5px;color:var(--mut);margin-top:12px}
.sub{gap:6px;margin:2px 0 10px}
.sub button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:50px;padding:4px 2px;font-size:12px;line-height:1.1;min-width:0}
.sub button b{font-size:18px;line-height:1.1}
.sdot{position:absolute;top:5px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--acc);display:none}.sdot.on{display:block}
.hero{background:linear-gradient(135deg,#3b2a78,#26205a);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:inset 0 0 0 1px #ffc65c33}
.hero.god{background:linear-gradient(135deg,#4a3672,#2b2156);box-shadow:inset 0 0 0 1px #ffe08a55}
.hero.boss{text-align:center;box-shadow:inset 0 0 0 1.5px var(--bc),0 0 18px -6px var(--bc)}
.hero .lbl,.tile .lbl{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.hero .gain{font-size:28px;font-weight:900;color:var(--acc2);line-height:1.15;margin-top:2px}
.hero.god .gain{color:#ffe08a}
.hs{font-size:12.5px;color:var(--mut);margin-top:3px;line-height:1.35}
.bossic{font-size:56px;line-height:1;filter:drop-shadow(0 0 14px var(--bc))}
.prog{margin-top:10px}.prog .pl{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mut)}.prog .pl b{color:var(--ink);text-align:right}
.prog .bar{height:8px;border-radius:4px}.prog.ok .bar i{background:linear-gradient(90deg,#3fcf8e,var(--good))}
.hero .big{margin:12px 0 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tile{background:var(--card);border-radius:12px;padding:10px;min-width:0}
.tile .v{font-size:17px;font-weight:800;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .s{font-size:11.5px;color:var(--mut);margin-top:2px;line-height:1.3}
details.card summary{font-weight:700;cursor:pointer;min-height:24px;color:var(--ink)}
.arow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;min-height:44px}
.tog{border:0;border-radius:22px;min-width:72px;min-height:40px;font-weight:800;font-size:14px;background:#3d3670;color:#b3abd6;flex:0 0 auto}
.tog.on{background:var(--good);color:#10291c}
.lockt{font-size:12.5px;color:var(--mut);text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 2px 6px}
.chips button{border:0;border-radius:20px;background:var(--card);min-height:40px;min-width:48px;padding:0 14px;font-weight:700;font-size:13px;color:var(--mut)}
.chips button.on{background:var(--acc2);color:#1b1030}
.achg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.achc{background:var(--card);border-radius:12px;padding:9px;font-size:12px;color:var(--mut);min-width:0;line-height:1.3}
.achc.got{color:var(--ink);background:linear-gradient(135deg,#3a2f7a,#2a235c);box-shadow:inset 0 0 0 1px #ffc65c55}
.achc b{display:block;font-size:13px;color:var(--ink);margin-bottom:2px}
.achc .bar{height:4px}.achc .pv{font-size:11px;margin-top:3px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.days div{background:#0003;border-radius:8px;padding:5px 0;text-align:center;font-size:10.5px;color:var(--mut);line-height:1.35}
.days div.got{background:#2b6b52;color:#c9ffe6}.days div.now{background:var(--acc2);color:#1b1030;font-weight:800}
.card.ev{font-size:13px}
.expg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.expg .buy{min-width:0;width:100%}
.tree{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.br{display:flex;flex-direction:column;gap:14px;min-width:0}
.br h4{margin:0;text-align:center;font-size:13px;color:var(--acc2)}
.node{position:relative;border:0;border-radius:14px;background:var(--card);min-height:70px;padding:6px 4px;font-size:11.5px;line-height:1.2;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;opacity:.6}
.node b{font-size:20px}.node small{font-size:10.5px;font-weight:700}
.node.open{opacity:1;color:var(--ink);box-shadow:inset 0 0 0 1.5px #ffffff33}
.node.can{box-shadow:inset 0 0 0 1.5px var(--acc2),0 0 10px #ffc65c55}
.node.own{opacity:1;background:linear-gradient(135deg,#3a7a5a,#245a44);color:#eafff4}
.node.sel{outline:2px solid var(--acc2);outline-offset:1px}
.node+.node::before{content:'';position:absolute;top:-14px;left:50%;width:3px;height:14px;background:#ffffff22;transform:translateX(-50%)}
.node.own+.node::before{background:var(--good)}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skin{border:0;border-radius:14px;background:var(--card);padding:8px 4px;min-height:104px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);line-height:1.2}
.skin small{font-size:10.5px;color:var(--mut)}.skin.lock{opacity:.5}.skin.on{box-shadow:inset 0 0 0 2px var(--acc2)}
.sw{display:block;width:46px;height:46px;border-radius:50%;box-shadow:0 0 10px #0006}
#boss{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:min(90%,360px);background:#100d22e6;border-radius:12px;padding:6px 10px;z-index:8;pointer-events:none;display:none;font-size:12.5px;text-align:center;border:1px solid #ff6b7a88}
#boss.show{display:block}#boss .bic{font-size:18px}
#boss .hp{height:10px;background:#0008;border-radius:5px;overflow:hidden;margin-top:4px}#boss .hp i{display:block;height:100%;background:linear-gradient(90deg,#ff3d5a,#ff9b4f);width:100%}
#tip{display:none;align-items:center;gap:6px;margin:0 10px 6px;padding:4px 4px 4px 12px;background:#2c2466;border:1px solid #ffc65c66;border-radius:12px;font-size:13px;line-height:1.3}
#tip.show{display:flex}#tip span{flex:1}
#tip button{border:0;border-radius:10px;background:var(--acc2);color:#1b1030;font-weight:800;min-height:40px;min-width:64px;font-size:13px}
#tip button+button{min-width:40px;background:#ffffff14;color:var(--ink)}
.toast b{color:var(--acc2);margin-left:4px}
.toast.bump{animation:tin2 3.2s ease forwards}
@keyframes tin2{0%{transform:scale(1.06)}10%,85%{opacity:1;transform:none}100%{opacity:0}}
.bcol{display:flex;flex-direction:column;gap:6px}
.mbig{font-size:26px;font-weight:900;color:var(--acc2);text-align:center;margin:10px 0!important}
#rsIn{width:100%;min-height:46px;font-size:16px;border-radius:10px;border:1px solid #ffffff33;background:#0e0b20;color:var(--ink);padding:0 12px;margin:4px 0 10px;-webkit-user-select:text;user-select:text;text-transform:uppercase;letter-spacing:2px}
.buffs{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 8px;padding:0 50px}
.buffs .evb{background:#ff6b7a33;border-radius:10px;padding:0 8px;color:#ffd6dc}
.buy.alt{background:var(--card2);box-shadow:0 3px 0 #1d1840;color:var(--ink)}
.row .nm .own{font-size:13px}
</style>
</head>
<body>
<div id="app">
 <header>
  <div id="seal" title="Spirit Seals / Divinity"><span>🔮 <span id="sealN">0</span></span><span id="divW">✴️ <span id="divN">0</span></span></div>
  <button id="soundBtn" aria-label="Toggle sound">🔊</button>
  <div class="ki"><span id="ki">0</span><small>Ki</small></div>
  <div class="kps"><span id="kps">0</span> Ki/sec · <span id="tapv">1</span> per tap</div>
  <div class="buffs" id="buffs"></div>
 </header>
 <div id="toasts"></div>
 <div id="tapZone">
  <button id="orb" aria-label="Train"><span class="ring"></span><span class="glyph">気</span></button>
  <button id="fox" class="foxb" aria-label="Spirit fox">🦊</button>
  <div id="abar"></div>
  <div id="boss"></div>
 </div>
 <div id="tip"></div>
 <div id="panel"></div>
 <nav id="nav">
  <button data-tab="clan" class="on"><span class="dot"></span><b>🥷</b>Clan</button>
  <button data-tab="blood"><span class="dot"></span><b>🩸</b>Blood</button>
  <button data-tab="beast"><span class="dot"></span><b>🐾</b>Beasts</button>

function fmt(n){
 if(n!==n)return '0';
 if(!isFinite(n))return '∞';
 if(n<0)return '-'+fmt(-n);
 if(n<1000){return (n<100&&n%1>0.0001&&n<10)?n.toFixed(1):Math.floor(n).toString();}
 var e=Math.floor(Math.log10(n)/3);
 if(S.nf===1||e>=SUF.length){return n.toExponential(2).replace('e+','e');}
 var v=n/Math.pow(1000,e);
 if(S.nf===2){if(v>=999.995){v/=1000;e++}return (v<10?v.toFixed(2):v<100?v.toFixed(1):Math.floor(v).toString())+'e'+(3*e)}
 var t=v<10?v.toFixed(2):v<100?v.toFixed(1):Math.floor(v).toString();
 if(parseFloat(t)>=1000&&e+1<SUF.length){return '1.00'+SUF[e+1];}
 return t+SUF[e];
}

 k=Math.min(k,100000);var c=cl(c0*(Math.pow(G,k)-1)/(G-1));if(q==='max'){while(k>1&&!(c<=S.ki)){k--;c=cl(c0*(Math.pow(G,k)-1)/(G-1))}}return {k:k,c:c,ok:c<=S.ki&&c<MAXN}}

 var before=nextMile(S.gens[id]);
 S.ki=cl(S.ki-c);S.gens[id]+=k;S.bought+=k;

function buyAllBlood(){var p=bloodPlan(),n=0;p.list.forEach(function(b){if(buyBlood(b.id,true))n++});return n}
function buyPerk(id,q){var p=PERKS.find(function(x){return x.id===id});if(!p)return false;var pl=planLv(S.perks[id],p.max,p.cost,sealsAvail(),q||1);if(!pl.ok)return false;S.sealsSpent+=pl.c;S.perks[id]+=pl.k;return pl.k}
function autoTaps(n){ // Auto Clicker: n taps in one batch (keeps thousands of taps/sec cheap on phones)
 var v=tapValue()*echoMult(),p=Math.min(1,critChance()+0.10*S.perks.critc),x=bloodMax('critX',10);
 var c=0;if(p>0){if(n<=20){for(var i=0;i<n;i++)if(Math.random()<p)c++}else{c=Math.floor(n*p);if(Math.random()<n*p-c)c++}}

 var first=!beastLv(b);S.ki=cl(S.ki-p.c);S.beasts[id]=beastLv(b)+p.k;if(first&&!quiet){summonFx(b);snd('asc')}if(first)checkAch();return true}

 if(win){var mp=trialMp(TR.lv),sl=trialSeals();gainMp(mp);addSeals(sl);S.gloryT=Math.min(S.gloryT+300,900);S.trWins++;S.trLv++;S.trCd=TRIAL_CD_WIN;
  toast('⚔️ '+b[1]+' defeated! +'+mp+' Mastery · +'+fmt(sl)+' Seals · Ki ×3 for 5m');if(typeof document!=='undefined'&&$('fx')){bigFx(b[0],b[2],'Victory!<small>'+b[1]+' falls · +'+mp+' Mastery Point'+(mp>1?'s':'')+'</small>');snd('asc')}}

/* ---------- DAILY GIFT (local calendar date; 7-day cycle; a missed day resets the streak) ---------- */
function pad2(n){return (n<10?'0':'')+n}

function dailyText(r){return '+'+fmt(r.ki)+' Ki'+(r.surge?' · Ki ×2 for '+(r.surge/60)+'m':'')+(r.mp?' · +'+r.mp+' Mastery':'')+(r.sl?' · +'+fmt(r.sl)+' Seals':'')}

 S.dStreak=st;S.dBest=Math.max(S.dBest,st);S.dLast=dayKey();S.dTotal++;checkAch();save();return {day:day,r:r,streak:st}}

/* ---------- TIMERS (game-time seconds; also advanced by offline time) ---------- */
function timers(dt,offline){
 if(S.surgeT>0)S.surgeT=Math.max(0,S.surgeT-dt);if(S.gloryT>0)S.gloryT=Math.max(0,S.gloryT-dt);
 if(S.trCd>0)S.trCd=Math.max(0,S.trCd-dt);if(S.qRr>0)S.qRr=Math.max(0,S.qRr-dt);
 for(var i=0;i<S.q.length;i++){if(S.q[i].cd>0)S.q[i].cd=Math.max(0,S.q[i].cd-dt)}
 var back=0;S.exp.forEach(function(x){if(x.left>0){x.left=Math.max(0,x.left-dt);if(!x.left)back++}});
 if(offline){if(S.evT>0){S.evT=Math.max(0,S.evT-dt);if(!S.evT)S.evId=''}if(TR.on)trialEnd(false)}
 else{evTick(dt);if(TR.on){TR.t-=dt;if(TR.t<=0)trialEnd(false)}}
 return back}

/* offline: returns amount */
function applyOffline(sec,show){
 var cap=offlineCapH()*3600,use=Math.min(sec,cap);
 var amt=cl(baseKps()*use*offlineRate());S.runT+=sec;S.offMax=Math.max(S.offMax,sec);
 var back=timers(sec,true);
 if(amt>0){earn(amt);S.offlineGot++;}
 if(show&&sec>=60&&(amt>0||back))modalQ('<h2>🌙 Welcome back!</h2><p>You were away for <b>'+fmtTime(sec)+'</b>.</p>'+(amt>0?'<p>Your clan trained while you rested and gathered</p><p style="font-size:28px;font-weight:900;color:var(--acc2);text-align:center;margin:12px 0">+'+fmt(amt)+' Ki</p><p style="color:var(--mut);font-size:13px">Offline rate '+fmt(offlineRate()*100)+'% · limit '+offlineCapH()+'h'+(sec>cap?' (limit reached)':'')+'</p>':'')+(back?'<p>🧭 <b>'+back+' expedition'+(back>1?'s':'')+'</b> came back. Claim '+(back>1?'them':'it')+' in Quests › Expeditions.</p>':'')+'<button class="big" data-act="close">Collect</button>');
 return amt;
}

function save(){S.lastSeen=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){return false}}
function num(v,d){return typeof v==='number'&&isFinite(v)?cl(v):(d||0)}
function cleanQ(x){if(!x||typeof x!=='object')return {cd:0};if(typeof x.t==='string'&&QT[x.t])return {t:x.t,b:num(x.b),n:Math.max(1,num(x.n,1)),rw:['mp','seals','surge','ki'].indexOf(x.rw)>=0?x.rw:'ki'};return {cd:Math.min(Q_REFRESH,num(x.cd))}}
function cleanExp(x){if(!x||typeof x!=='object')return null;var d=Math.floor(num(x.d));if(!EXPD[d])return null;return {d:d,left:Math.min(EXPD[d].s,num(x.left)),ki:num(x.ki),sl:num(x.sl),n:Math.max(1,Math.floor(num(x.n,1)))}}
var SPECIAL={q:1,exp:1,buyQty:1};
function merge(o){var s=fresh();if(!o||typeof o!=='object')return s;
 for(var k in s){if(SPECIAL[k]||o[k]===undefined||o[k]===null)continue;
  if(typeof s[k]==='object'&&s[k]!==null){if(typeof o[k]!=='object')continue;for(var j in o[k]){var v=o[k][j];if(typeof v==='number'&&isFinite(v))s[k][j]=cl(v)}}
  else if(typeof s[k]===typeof o[k]){if(typeof o[k]!=='number')s[k]=typeof o[k]==='string'?o[k].slice(0,40):o[k];else if(isFinite(o[k]))s[k]=cl(o[k])}}
 if(o.buyQty==='max'||[1,10,25].indexOf(o.buyQty)>=0)s.buyQty=o.buyQty;
 if(Array.isArray(o.q))s.q=o.q.slice(0,3).map(cleanQ);
 if(Array.isArray(o.exp))s.exp=o.exp.slice(0,2).map(cleanExp).filter(Boolean);
 // ---- migrations ----
 var ov=typeof o.v==='number'?o.v:1;
 if(ov<2){s.ascLife=Math.max(s.ascLife,s.asc);s.runT=Math.max(0,(Date.now()-s.runStart)/1000);var e=s.perks.echo,t=0;while(clickTps(t)<e)t++;s.perks.echo=t;} // v1 had a single ascension counter: it becomes the lifetime count too
 if(ov<3){if(o.sci===true)s.nf=1;s.vib=o.sound!==false;} // v2.0 -> v2.1: shop tiers, seals spent and achievements carry over untouched (no refunds, no wipes)
 if(s.ascLife<s.asc)s.ascLife=s.asc;
 if([0,10,25,50].indexOf(s.autoPct)<0)s.autoPct=0;
 if([0,1,2].indexOf(s.nf)<0)s.nf=0;
 if(!/^\d{4}-\d{2}-\d{2}$/.test(s.dLast))s.dLast='';
 if(!SKINS.some(function(k){return k.id===s.skin}))s.skin='ember';
 if(!EVENTS.some(function(e){return e.id===s.evId})){s.evId='';s.evT=0}
 if(s.mpSpent>s.mp){s.mpSpent=0;TAL.forEach(function(t){s.tal[t.id]=0})}
 s.tappers=Math.min(MAX_TAPPERS,Math.floor(s.tappers));
 s.v=3;
 return s}

 g.gain.setValueAtTime(0.0001,a.currentTime+t0);g.gain.exponentialRampToValueAtTime(vol||0.15,a.currentTime+t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+t0+dur);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+dur+0.02)}

 setCls(el,'show');setTxt(el.querySelector('.bt'),Math.max(0,TR.t).toFixed(1)+'s');setW(el.querySelector('.hp i'),pct(TR.hp,TR.max))}

function rDots(){
 var dots={clan:GENS.some(function(g,i){return genOpen(i)&&genCost(g,S.gens[g.id],1)<=S.ki})||TECHS.some(function(t){return S.tech[t.id]<t.max&&t.cost(S.tech[t.id])<=S.ki}),
  blood:BLOODS.some(function(b){return !S.bloods[b.id]&&bloodOpen(b)&&bloodCost(b)<=S.ki}),
  beast:BEASTS.some(function(b){return beastOpen(b)&&beastCost(b)<=S.ki}),
  ascend:sealsOnAscend()>=1||godReady()||PERKS.some(function(q){return S.perks[q.id]<q.max&&q.cost(S.perks[q.id])<=sealsAvail()})||ABIL.some(function(a){return (S.abil[a.id]||0)<a.max&&a.cost(S.abil[a.id]||0)<=divAvail()}),
  quest:dailyReady()||S.q.some(qDone)||S.exp.some(function(x){return x.left<=0})||(trialOpen()&&!TR.on&&S.trCd<=0&&S.trWins===0)||TAL.some(function(t){return !S.tal[t.id]&&talOpen(t)&&t.cost<=mpAvail()}),more:false};
 document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('has',!!dots[b.dataset.tab]&&b.dataset.tab!==tab)});
 if(tab==='quest'){var sd={goals:dailyReady()||S.q.some(qDone),trial:trialOpen()&&!TR.on&&S.trCd<=0,exp:S.exp.some(function(x){return x.left<=0}),tal:TAL.some(function(t){return !S.tal[t.id]&&talOpen(t)&&t.cost<=mpAvail()})};
  for(var k in sd){var e=$('sd_'+k);if(e)setCls(e,'sdot'+(sd[k]&&subs.quest!==k?' on':''))}}}
function refresh(full){
 var t0=performance.now();rc++;var slow=full||rc%4===0;
 setTxt($('ki'),fmt(S.ki));setTxt($('kps'),fmt(kps()));setTxt($('tapv'),fmt(tapValue()));setTxt($('sealN'),fmt(S.sealsTotal));
 var showDiv=S.god>0||S.divTotal>0;setDisp($('divW'),showDiv,'block');if(showDiv)setTxt($('divN'),fmt(S.divTotal));
 var now=Date.now(),bf=[],e=evCur();if(S.sixth)bf.push('<span class="six">🌟 Sixth Path ×10</span>');if(e)bf.push('<span class="evb">'+e.ic+' '+e.name+' · '+shortT(S.evT)+'</span>');
 if(frenzy()>1)bf.push('🦊 ×'+frenzyX()+' · '+Math.ceil((S.frenzyUntil-now)/1000)+'s');if(S.surgeT>0)bf.push('⚡ ×2 · '+shortT(S.surgeT));if(S.gloryT>0)bf.push('⚔️ ×3 · '+shortT(S.gloryT));
 if(stormX()>1)bf.push('🌩️ Storm ×100 · '+Math.ceil((S.stormUntil-now)/1000)+'s');if(rampX()>1)bf.push('🌀 Rampage · '+Math.ceil((S.rampUntil-now)/1000)+'s');
 setH($('buffs'),bf.join(' '));
 refreshOrb();refreshAbar();refreshBoss();setTxt($('soundBtn'),S.sound?'🔊':'🔇');
 if(slow)refreshTip();
 var p=$('panel'),sb=subs[tab];
 if(tab==='clan'){if(sb==='clan')rClan(p);else rTech(p)}
 else if(tab==='blood')rBlood(p);else if(tab==='beast')rBeast(p);
 else if(tab==='ascend'){if(sb==='asc')rAsc();else if(sb==='shop')rShop(p);else rGod(p)}
 else if(tab==='quest'){if(sb==='goals')rGoals();else if(sb==='trial')rTrial();else if(sb==='exp')rExp();else rTal()}
 else{if(sb==='ach'){if(slow)rAch()}else if(sb==='stats'){if(slow)rStats()}else if(sb==='set')rSet();else if(slow)rSkins()}
 if(slow)rDots();
 var dt=performance.now()-t0;perfT+=dt;perfN++;if(dt>perfMax)perfMax=dt;
}

/* ---------- LOOP ---------- */
var last=Date.now(),echoAcc=0,achAcc=0,autoAcc=0,paused=false;
function step(dt){ // seconds, online
 earn(kps()*dt);S.played+=dt;S.runT+=dt;
 var tps=autoTps();if(tps){echoAcc+=dt*tps;var n=Math.floor(echoAcc);if(n>0){echoAcc-=n;autoTaps(n)}}
 var back=timers(dt,false);if(back)toast('🧭 Expedition back home! Claim it in Quests.','exp');
 autoAcc+=dt;if(autoAcc>=1){autoAcc=0;if(S.perks.steward&&S.autoBuy)autoBuy(S.perks.steward);tryAutoAsc();fillQ()}
 achAcc+=dt;if(achAcc>=1){achAcc=0;checkAch()}
 if(!(S.ki>=0))S.ki=0;if(!(S.run>=0))S.run=0;
}
function tick(){
 var now=Date.now(),dt=(now-last)/1000;last=now;
 if(paused)return;
 if(dt<0)dt=0;
 if(dt>10){applyOffline(dt,true);dt=0}
 step(dt);
 if(!foxUntil&&now>=foxAt&&foxAt)showFox();
 if(foxUntil&&now>foxUntil){$('fox').style.display='none';foxUntil=0;S.foxMiss++;scheduleFox()}
}

function onOrb(e){e.preventDefault();ac();var z=$('tapZone').getBoundingClientRect();var x=(e.clientX||z.width/2+z.left)-z.left,y=(e.clientY||z.height/2+z.top)-z.top;
 tap(x,y);setTxt($('ki'),fmt(S.ki));if(TR.on)refreshBoss();var o=$('orb');o.classList.add('hit');clearTimeout(o._t);o._t=setTimeout(function(){o.classList.remove('hit')},70);

function dailyModal(){var st=dailyNextStreak(),day=cycDay(st),h='<h2>🎁 Daily gift · Day '+day+'</h2><p>'+(st>1?'Your login streak is <b>'+(st-1)+' day'+(st>2?'s':'')+'</b>. Keep it going!':'Log in every day for bigger gifts. Missing a day resets the streak.')+'</p><div class="days">';
 for(var d=1;d<=7;d++)h+='<div class="'+(d<day?'got':d===day?'now':'')+'">Day '+d+'<br>'+DAILY[d-1].ic+'</div>';
 return h+'</div><p style="text-align:center;font-weight:800;color:var(--acc2)">'+dailyText(dailyReward(day))+'</p><button class="big" data-act="daily">Claim</button>'}

  else if(a==='beast'){var bb=BEASTS.find(function(x){return x.id===id});ok=buyBeast(id,false,beastLv(bb)?S.buyQty:1);if(!ok)snd('no');else if(beastLv(bb)>1)snd('buy');refresh()}
  else if(a==='sub'){subs[tab]=b.dataset.s;$('panel').scrollTop=0;buildPanel()}
  else if(a==='autobuy'){S.autoBuy=!S.autoBuy;snd('buy');refresh();save()}
  else if(a==='autoasc'){S.autoAsc=!S.autoAsc;snd('buy');refresh();save()}
  else if(a==='apct'){S.autoPct=+b.dataset.q;refresh();save()}
  else if(a==='abil'){ok=buyAbil(id);snd(ok?'ach':'no');if(ok){buildPanel();save()}}
  else if(a==='use'){ok=useAbil(id);snd(ok?'asc':'no');refresh()}
  else if(a==='god'){var d=divOnGod();if(d<1){snd('no');return}
   modal('<h2>✴️ God Rebirth?</h2><p>You will gain <b style="color:#ffe08a">+'+fmt(d)+' Divinity</b> (+'+fmt(d*DIV_BONUS*100)+'% Ki forever, and points for God Abilities).</p><p>Resets: Ki, clan, training, bloodlines, <b>all Spirit Seals and Rebirth Shop upgrades</b>'+(S.abil.eternal?' (Phantom Steward, Cycle Sigil and Swift Rebirth are kept by Eternal Cycle)':'')+', and this cycle\'s Ascensions. Beast levels drop to 1.</p><p>Kept: Divinity, God Abilities, beast bonds, total Ascensions, talents, Shadow Tappers, achievements and stats.</p><div class="two"><button class="big alt" data-act="close">Not yet</button><button class="big" data-act="dogod">Become a god</button></div>')}
  else if(a==='dogod'){var got=godRebirth();closeModal();if(got){snd('asc');bigFx('✴️','#ffe08a','God Rebirth!<small>+'+fmt(got)+' Divinity</small>');buildPanel()}}
  else if(a==='qty'){S.buyQty=b.dataset.q==='max'?'max':+b.dataset.q;buildPanel();save()}
  else if(a==='ascend'){var g=sealsOnAscend();if(g<1){snd('no');return}
   modal('<h2>🔮 Ascend?</h2><p class="mbig">+'+fmt(g)+' Spirit Seals</p><p>That is <b>+'+fmt(g*10)+'% Ki</b> forever'+(S.sixth?'. Your Sixth Path ends with this run, and the next run rolls again':'')+'.</p><p>Resets: Ki, clan, training and bloodlines'+(legacyKeep().length?' (your first '+legacyKeep().length+' bloodlines stay)':'')+'.<br>Kept: seals, Shop upgrades, beasts, talents, achievements and stats.</p><div class="two"><button class="big alt" data-act="close">Not yet</button><button class="big" data-act="doascend">Ascend</button></div>')}
  else if(a==='doascend'){var got2=ascend();closeModal();if(got2){snd('asc');toast('🔮 Ascended! +'+fmt(got2)+' Spirit Seals');buildPanel()}}

 $('modal').addEventListener('click',function(e){if(e.target===$('modal'))closeModal()});
