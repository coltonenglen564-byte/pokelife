<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14112a">
<title>Bloodline Dojo: Idle Ninja</title>
<style>
:root{--bg:#14112a;--bg2:#1e1940;--card:#262052;--card2:#2f2863;--ink:#f3eefc;--mut:#a79fcb;--acc:#ff8a3d;--acc2:#ffc65c;--good:#5fe0a0;--bad:#ff6b7a;--blue:#7cc4ff;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
body{touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;background:linear-gradient(180deg,#1b1638,#14112a 40%);position:relative;padding-top:env(safe-area-inset-top)}
header{padding:10px 14px 6px;text-align:center;position:relative}
.ki{font-size:30px;font-weight:800;letter-spacing:.5px;line-height:1.1}
.ki small{font-size:15px;color:var(--acc2);font-weight:700;margin-left:4px}
.kps{color:var(--mut);font-size:14px;margin-top:2px}
.buffs{min-height:20px;font-size:13px;color:var(--acc2);font-weight:700}
#soundBtn{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);font-size:20px}
#seal{position:absolute;left:10px;top:10px;min-width:44px;height:44px;padding:0 10px;border-radius:22px;background:var(--card);font-size:14px;font-weight:700;display:flex;align-items:center;gap:4px}
#tapZone{position:relative;flex:0 0 34vh;min-height:190px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#orb{width:min(30vh,240px);height:min(30vh,240px);min-width:150px;min-height:150px;border-radius:50%;border:0;position:relative;touch-action:none;
 background:radial-gradient(circle at 35% 30%,#fff3c4 0,#ffb347 18%,#ff6a2b 45%,#9c1f5a 75%,#3b1060 100%);
 box-shadow:0 0 40px #ff7a3a88,0 0 90px #b03cff44,inset 0 -12px 30px #0005;transition:transform .06s}
#orb.hit{transform:scale(.93)}
#orb .ring{position:absolute;inset:-14px;border-radius:50%;border:3px dashed #ffc65c66;animation:spin 14s linear infinite;pointer-events:none}
#orb .glyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(11vh,86px);font-weight:900;color:#fff8;text-shadow:0 0 18px #fff;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.float{position:absolute;pointer-events:none;font-weight:900;font-size:22px;color:#fff;text-shadow:0 2px 6px #000,0 0 10px var(--acc);animation:up .9s ease-out forwards;white-space:nowrap;z-index:5}
.float.crit{color:var(--acc2);font-size:30px}
@keyframes up{0%{transform:translate(-50%,-50%) scale(.7);opacity:1}20%{transform:translate(-50%,-80%) scale(1.15)}100%{transform:translate(-50%,-260%) scale(1);opacity:0}}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--acc2);pointer-events:none;animation:spark .6s ease-out forwards;z-index:4}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
#fox{position:absolute;width:64px;height:64px;border-radius:50%;border:0;background:radial-gradient(circle,#fff 0,#bdf3ff 40%,#5ab6ff00 72%);font-size:38px;display:none;z-index:6;animation:bob 1.4s ease-in-out infinite;touch-action:none}
@keyframes bob{50%{transform:translateY(-10px) scale(1.08)}}
#panel{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 10px 16px;border-top:1px solid #ffffff14;background:var(--bg2);border-radius:18px 18px 0 0}
nav{display:flex;background:#100d22;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #ffffff14}
nav button{flex:1;border:0;background:none;padding:8px 2px 9px;min-height:58px;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button b{font-size:21px;line-height:1.1}
nav button.on{color:var(--acc2);background:#ffffff08}
nav button .dot{position:absolute;top:6px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--acc);display:none}
nav button.has .dot{display:block}
h3{margin:8px 4px 6px;font-size:15px;color:var(--acc2);display:flex;justify-content:space-between;align-items:center}
.hint{color:var(--mut);font-size:13px;margin:0 4px 8px;line-height:1.35}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--r);padding:10px;margin-bottom:8px;min-height:64px}
.row.locked{opacity:.45}
.row .ic{font-size:30px;width:42px;text-align:center;flex:0 0 42px}
.row .mid{flex:1;min-width:0}
.row .nm{font-weight:700;font-size:15px}
.row .nm .own{color:var(--acc2);margin-left:6px}
.row .ds{color:var(--mut);font-size:12.5px;line-height:1.3;margin-top:2px}
.bar{height:5px;background:#0004;border-radius:3px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0}
.buy{flex:0 0 auto;min-width:92px;min-height:48px;border:0;border-radius:12px;background:linear-gradient(180deg,#ff9b4f,#e2602a);font-weight:800;font-size:13.5px;padding:6px 8px;line-height:1.2;box-shadow:0 3px 0 #9a3a12}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #9a3a12}
.buy.no{background:#3d3670;box-shadow:0 3px 0 #1d1840;color:#b3abd6}
.buy.done{background:#2b6b52;box-shadow:none;color:#c9ffe6}
.buy small{display:block;font-weight:600;font-size:11.5px;opacity:.9}
.seg{display:flex;gap:6px}
.seg button{border:0;background:var(--card);border-radius:10px;min-width:48px;min-height:40px;font-weight:700;font-size:13px}
.seg button.on{background:var(--acc);color:#1b1030}
.big{width:100%;min-height:54px;border:0;border-radius:14px;font-weight:800;font-size:16px;background:linear-gradient(180deg,#b57cff,#7a3fe0);box-shadow:0 3px 0 #45208a;margin:6px 0}
.big.no{background:#3d3670;box-shadow:none;color:#b3abd6}
.big.alt{background:var(--card2);box-shadow:none;font-size:15px}
.big.danger{background:#7a2235;box-shadow:none;font-size:15px}
.card{background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:8px;font-size:14px;line-height:1.45}
.card b{color:var(--acc2)}
.stat{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid #ffffff10;font-size:14px}
.stat span:last-child{font-weight:700}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach div{background:var(--card);border-radius:12px;padding:9px;font-size:12.5px;color:var(--mut);opacity:.5}
.ach div.got{opacity:1;color:var(--ink);background:linear-gradient(135deg,#3a2f7a,#2a235c);outline:1px solid #ffc65c55}
.ach div b{display:block;font-size:13.5px;color:var(--ink);margin-bottom:2px}
#toasts{position:absolute;top:calc(84px + env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:20}
.toast{background:#2c2466ee;border:1px solid #ffc65c88;border-radius:12px;padding:9px 14px;font-size:14px;max-width:90%;animation:tin 3.2s ease forwards;text-align:center}
@keyframes tin{0%{opacity:0;transform:translateY(-10px)}10%,85%{opacity:1;transform:none}100%{opacity:0}}
#modal{position:absolute;inset:0;background:#05031099;display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
#modal.show{display:flex}
#modal .box{background:var(--bg2);border-radius:18px;padding:18px;width:100%;max-width:420px;border:1px solid #ffffff22;max-height:90%;overflow:auto}
#modal h2{margin:0 0 8px;font-size:20px;color:var(--acc2)}
#modal p{margin:6px 0;line-height:1.45;color:#ddd6f5}
textarea{width:100%;min-height:110px;background:#0e0b20;color:var(--ink);border:1px solid #ffffff22;border-radius:10px;padding:8px;font-size:12px;font-family:ui-monospace,monospace;-webkit-user-select:text;user-select:text}
.two{display:flex;gap:8px}.two>*{flex:1}
@media (min-height:820px){#tapZone{flex-basis:36vh}}
@media (hover:hover){.buy:hover{filter:brightness(1.08)} nav button:hover{color:var(--ink)}}
</style>
</head>
<body>
<div id="app">
 <header>
  <div id="seal" title="Spirit Seals">🔮 <span id="sealN">0</span></div>
  <button id="soundBtn" aria-label="Toggle sound">🔊</button>
  <div class="ki"><span id="ki">0</span><small>Ki</small></div>
  <div class="kps"><span id="kps">0</span> Ki/sec · <span id="tapv">1</span> per tap</div>
  <div class="buffs" id="buffs"></div>
 </header>
 <div id="toasts"></div>
 <div id="tapZone">
  <button id="orb" aria-label="Train"><span class="ring"></span><span class="glyph">気</span></button>
  <button id="fox" aria-label="Spirit fox">🦊</button>
 </div>
 <div id="panel"></div>
 <nav id="nav">
  <button data-tab="clan" class="on"><span class="dot"></span><b>🥷</b>Clan</button>
  <button data-tab="tech"><span class="dot"></span><b>📜</b>Training</button>
  <button data-tab="blood"><span class="dot"></span><b>🩸</b>Bloodlines</button>
  <button data-tab="ascend"><span class="dot"></span><b>🔮</b>Ascend</button>
  <button data-tab="more"><span class="dot"></span><b>🏆</b>More</button>
 </nav>
 <div id="modal"><div class="box" id="mbox"></div></div>
</div>
<script>
(function(){
"use strict";
var VERSION='1.0.0', KEY='bloodlineDojo.save.v1';

/* ---------- DATA ---------- */
var GENS=[
 {id:'recruit',name:'Village Recruit',ic:'🧒',base:15,rate:0.1,d:'Sweeps the dojo floor and dreams big.'},
 {id:'student',name:'Dojo Student',ic:'🥋',base:100,rate:1,d:'Practices forms from dawn to dusk.'},
 {id:'scout',name:'Forest Scout',ic:'🏹',base:1100,rate:8,d:'Gathers Ki from the whispering woods.'},
 {id:'runner',name:'Shadow Runner',ic:'🥷',base:12000,rate:47,d:'Moves faster than rumors.'},
 {id:'warrior',name:'Clan Warrior',ic:'⚔️',base:130000,rate:260,d:'Sworn protector of the clan gates.'},
 {id:'blade',name:'Blade Master',ic:'🗡️',base:1.4e6,rate:1400,d:'Cuts waterfalls in half for practice.'},
 {id:'sage',name:'Mountain Sage',ic:'🧙',base:2e7,rate:7800,d:'Meditates above the clouds.'},
 {id:'tamer',name:'Spirit Beast Tamer',ic:'🐺',base:3.3e8,rate:44000,d:'Bonded with wolves of living wind.'},
 {id:'elder',name:'Elder Council',ic:'⛩️',base:5.1e9,rate:260000,d:'Ancient minds guiding the whole clan.'},
 {id:'storm',name:'Storm Monastery',ic:'🌩️',base:7.5e10,rate:1.6e6,d:'Monks who bottle lightning.'},
 {id:'phoenix',name:'Phoenix Shrine',ic:'🔥',base:1e12,rate:1e7,d:'Eternal flame, eternal training.'},
 {id:'voidt',name:'Void Temple',ic:'🌌',base:1.4e13,rate:6.5e7,d:'Draws Ki from the space between stars.'}
];
var GROWTH=1.15, MILES=[10,25,50,100,150,200,250,300,400,500,600,700,800,900,1000];

var TECHS=[
 {id:'focus',name:'Focus Training',ic:'👊',max:200,cost:function(l){return 25*Math.pow(1.45,l)},d:function(l){return '+1 base Ki per tap (now +'+l+'). Every 25 levels doubles taps.'}},
 {id:'flow',name:'Flowing Strike',ic:'🌊',max:15,cost:function(l){return 5000*Math.pow(9,l)},d:function(l){return 'Each tap also adds 1% of your Ki/sec (now '+l+'%).'}},
 {id:'drill',name:'Clan Drills',ic:'🏯',max:20,cost:function(l){return 20000*Math.pow(12,l)},d:function(l){return 'All clan production +25% per level (now +'+(l*25)+'%).'}}
];

// effects: tap, all, gens:{id:mult}, crit, offline, fox
var BLOODS=[
 {id:'ember',name:'Ember Eye',ic:'👁️',cost:500,d:'Taps ×2. Your eyes glow like coals.',fx:{tap:2}},
 {id:'stone',name:'Stoneblood',ic:'🪨',cost:6000,d:'Recruits, Students and Scouts ×3.',fx:{gens:{recruit:3,student:3,scout:3}}},
 {id:'wind',name:'Swift Wind',ic:'🍃',cost:60000,d:'All production ×1.5.',fx:{all:1.5}},
 {id:'lotus',name:'Crimson Lotus',ic:'🌺',cost:600000,d:'10% of taps are critical hits for ×10.',fx:{crit:1}},
 {id:'mist',name:'Mistwalker',ic:'🌫️',cost:4e6,d:'Offline earnings at 100% (not 50%) and +4h offline limit.',fx:{offline:1}},
 {id:'iron',name:'Iron Will',ic:'🛡️',cost:3e7,d:'Runners, Warriors and Blade Masters ×3.',fx:{gens:{runner:3,warrior:3,blade:3}}},
 {id:'storm',name:'Storm Veins',ic:'⚡',cost:2.5e8,d:'All production ×2. Taps ×2.',fx:{all:2,tap:2}},
 {id:'moon',name:'Moon Fang',ic:'🌙',cost:3e9,d:'Spirit foxes appear twice as often and give double rewards.',fx:{fox:1}},
 {id:'sagel',name:'Sage Lineage',ic:'📿',cost:4e10,d:'Sages, Beast Tamers and the Elder Council ×3.',fx:{gens:{sage:3,tamer:3,elder:3}}},
 {id:'celest',name:'Celestial Iris',ic:'✨',cost:8e11,d:'All production ×3. Taps ×3.',fx:{all:3,tap:3}},
 {id:'voidh',name:'Void Heart',ic:'🖤',cost:5e13,d:'Monastery, Shrine and Void Temple ×3. All production ×2.',fx:{all:2,gens:{storm:3,phoenix:3,voidt:3}}},
 {id:'dragon',name:'Dragon Soul',ic:'🐉',cost:5e15,d:'All production ×5. The final bloodline.',fx:{all:5}}
];

var PERKS=[
 {id:'echo',name:'Ancestral Echo',ic:'👻',max:10,cost:function(l){return 1+l},d:function(l){return 'Auto-taps '+(l)+'/sec (next: '+(l+1)+'/sec).'}},
 {id:'start',name:'Head Start',ic:'🎒',max:6,cost:function(l){return 2+2*l},d:function(l){return l?'Start each run with '+fmt(startKi(l))+' Ki.':'Start each run with bonus Ki.'}},
 {id:'deep',name:'Deep Meditation',ic:'🧘',max:5,cost:function(l){return 2+l},d:function(l){return 'Offline limit +2h per level (now +'+(2*l)+'h).'}},
 {id:'memory',name:'Blood Memory',ic:'🧬',max:5,cost:function(l){return 3+2*l},d:function(l){return 'Bloodlines cost '+(l*10)+'% less.'}},
 {id:'lure',name:'Fox Lure',ic:'🍡',max:5,cost:function(l){return 2+l},d:function(l){return 'Spirit foxes appear '+(l*15)+'% more often.'}}
];
function startKi(l){return l?Math.pow(10,2+l):0}

var ACH=[
 ['tap1','First Breath','Tap once.',function(){return S.taps>=1}],
 ['tap100','Warm Up','Tap 100 times.',function(){return S.taps>=100}],
 ['tap1k','Iron Fingers','Tap 1,000 times.',function(){return S.taps>=1000}],
 ['tap10k','Thousand Fists','Tap 10,000 times.',function(){return S.taps>=10000}],
 ['crit','Crimson Bloom','Land a critical tap.',function(){return S.crits>=1}],
 ['k1','Spark','Earn 1K Ki total.',function(){return S.life>=1e3}],
 ['m1','Flame','Earn 1M Ki total.',function(){return S.life>=1e6}],
 ['b1','Inferno','Earn 1B Ki total.',function(){return S.life>=1e9}],
 ['t1','Star Fire','Earn 1T Ki total.',function(){return S.life>=1e12}],
 ['qa1','Supernova','Earn 1Qa Ki total.',function(){return S.life>=1e15}],
 ['s10','Humming','Reach 10 Ki/sec.',function(){return kps()>=10}],
 ['s1k','Roaring','Reach 1K Ki/sec.',function(){return kps()>=1e3}],
 ['s1m','Thunderous','Reach 1M Ki/sec.',function(){return kps()>=1e6}],
 ['s1b','World Shaking','Reach 1B Ki/sec.',function(){return kps()>=1e9}],
 ['r50','Full Courtyard','Own 50 Village Recruits.',function(){return S.gens.recruit>=50}],
 ['c100','Growing Clan','Own 100 clan members.',function(){return totalGens()>=100}],
 ['c500','Great Clan','Own 500 clan members.',function(){return totalGens()>=500}],
 ['all','Every Path','Own at least 1 of every clan member.',function(){return GENS.every(function(g){return S.gens[g.id]>0})}],
 ['bl1','Awakened','Unlock a bloodline.',function(){return countBloods()>=1}],
 ['bl6','Mixed Heritage','Unlock 6 bloodlines in one run.',function(){return countBloods()>=6}],
 ['blall','Pure Legend','Unlock every bloodline in one run.',function(){return countBloods()>=BLOODS.length}],
 ['fox1','Fox Friend','Catch a spirit fox.',function(){return S.foxes>=1}],
 ['fox25','Fox Whisperer','Catch 25 spirit foxes.',function(){return S.foxes>=25}],
 ['asc1','Ascended','Ascend once.',function(){return S.asc>=1}],
 ['asc5','Cycle of Rebirth','Ascend 5 times.',function(){return S.asc>=5}],
 ['seal50','Seal Keeper','Hold 50 Spirit Seals.',function(){return S.sealsTotal>=50}],
 ['away','Rested','Come back to offline earnings.',function(){return S.offlineGot>=1}],
 ['focus50','Disciplined','Reach Focus Training level 50.',function(){return S.tech.focus>=50}]
];
var ACH_BONUS=0.02, SEAL_BONUS=0.10, SEAL_DIV=1e8, ASC_MIN=1e9, BASE_OFFLINE_H=2;

/* ---------- STATE ---------- */
function fresh(){
 var s={v:1,ki:0,run:0,life:0,taps:0,crits:0,foxes:0,asc:0,sealsTotal:0,sealsSpent:0,offlineGot:0,
  gens:{},tech:{},bloods:{},perks:{},ach:{},sound:true,sci:false,buyQty:1,
  started:Date.now(),runStart:Date.now(),played:0,lastSeen:Date.now(),frenzyUntil:0,best:0};
 GENS.forEach(function(g){s.gens[g.id]=0});TECHS.forEach(function(t){s.tech[t.id]=0});PERKS.forEach(function(p){s.perks[p.id]=0});
 return s;
}
var S=fresh();

/* ---------- FORMAT ---------- */
var SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','UDc','DDc','TDc','QaDc','QiDc','SxDc','SpDc','OcDc','NoDc','Vg'];
function fmt(n){
 if(n!==n)return '0';
 if(!isFinite(n))return '∞';
 if(n<0)return '-'+fmt(-n);
 if(n<1000){return (n<100&&n%1>0.0001&&n<10)?n.toFixed(1):Math.floor(n).toString();}
 var e=Math.floor(Math.log10(n)/3);
 if(S.sci||e>=SUF.length){return n.toExponential(2).replace('e+','e');}
 var v=n/Math.pow(1000,e);
 var t=v<10?v.toFixed(2):v<100?v.toFixed(1):Math.floor(v).toString();
 if(parseFloat(t)>=1000&&e+1<SUF.length){return '1.00'+SUF[e+1];}
 return t+SUF[e];
}
function fmtTime(sec){sec=Math.floor(sec);var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?h+'h '+m+'m':m?m+'m '+s+'s':s+'s'}

/* ---------- MATH ---------- */
function totalGens(){var t=0;for(var k in S.gens)t+=S.gens[k];return t}
function countBloods(){var c=0;for(var k in S.bloods)if(S.bloods[k])c++;return c}
function countAch(){var c=0;for(var k in S.ach)if(S.ach[k])c++;return c}
function has(fx){return BLOODS.some(function(b){return S.bloods[b.id]&&b.fx[fx]})}
function bloodMult(kind){var m=1;BLOODS.forEach(function(b){if(S.bloods[b.id]&&b.fx[kind])m*=b.fx[kind]});return m}
function genBloodMult(id){var m=1;BLOODS.forEach(function(b){if(S.bloods[b.id]&&b.fx.gens&&b.fx.gens[id])m*=b.fx.gens[id]});return m}
function mileMult(n){var m=1;for(var i=0;i<MILES.length;i++)if(n>=MILES[i])m*=2;return m}
function nextMile(n){for(var i=0;i<MILES.length;i++)if(n<MILES[i])return MILES[i];return 0}
function sealMult(){return 1+SEAL_BONUS*S.sealsTotal}
function achMult(){return 1+ACH_BONUS*countAch()}
function globalMult(){return bloodMult('all')*sealMult()*achMult()*(1+0.25*S.tech.drill)}
function frenzy(){return Date.now()<S.frenzyUntil?5:1}
function genRate(g){return g.rate*mileMult(S.gens[g.id])*genBloodMult(g.id)*globalMult()} // per unit
function baseKps(){var t=0;GENS.forEach(function(g){t+=S.gens[g.id]*genRate(g)});return t}
function kps(){return baseKps()*frenzy()}
function tapValue(){
 var f=S.tech.focus;
 return (1+f)*Math.pow(2,Math.floor(f/25))*bloodMult('tap')*sealMult()*achMult()+kps()*0.01*S.tech.flow;
}
function genCost(g,n,k){var c=g.base*Math.pow(GROWTH,n);return c*(Math.pow(GROWTH,k)-1)/(GROWTH-1)}
function genMaxAfford(g){var n=S.gens[g.id],c=g.base*Math.pow(GROWTH,n);var k=Math.floor(Math.log(S.ki*(GROWTH-1)/c+1)/Math.log(GROWTH));return Math.max(0,k)}
function bloodCost(b){return b.cost*(1-0.1*S.perks.memory)}
function sealsOnAscend(){return S.run<ASC_MIN?0:Math.floor(Math.sqrt(S.run/SEAL_DIV))}
function sealsAvail(){return S.sealsTotal-S.sealsSpent}
function offlineCapH(){return BASE_OFFLINE_H+2*S.perks.deep+(has('offline')?4:0)}
function offlineRate(){return has('offline')?1:0.5}

function earn(x){if(!(x>0))return;S.ki+=x;S.run+=x;S.life+=x}

/* ---------- ACTIONS ---------- */
function tap(x,y){
 var v=tapValue(),crit=false;
 if(has('crit')&&Math.random()<0.10){v*=10;crit=true;S.crits++}
 earn(v);S.taps++;
 if(x!=null){floatNum(x,y,'+'+fmt(v),crit);sparks(x,y,crit?10:5);snd(crit?'crit':'tap')}
 return v;
}
function buyGen(id,qty){

function save(){S.lastSeen=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){return false}}
function merge(o){var s=fresh();if(!o||typeof o!=='object')return s;
 for(var k in s){if(o[k]===undefined)continue;
  if(typeof s[k]==='object'&&s[k]!==null){for(var j in o[k]){var v=o[k][j];if(typeof v==='number'&&isFinite(v))s[k][j]=v}}
  else if(typeof s[k]===typeof o[k]){if(typeof o[k]!=='number'||isFinite(o[k]))s[k]=o[k]}}
 return s}
function load(){var raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
 if(!raw)return false;try{S=merge(JSON.parse(raw));return true}catch(e){return false}}

 g.gain.setValueAtTime(0.0001,a.currentTime+t0);g.gain.exponentialRampToValueAtTime(vol||0.15,a.currentTime+t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+t0+dur);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+dur+0.02)}

 });
