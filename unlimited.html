  if(e.friendDies){const fr=ctx&&ctx.fr&&ctx.fr.alive&&ctx.fr.type==='friend'?ctx.fr:(peopleOf('friend').length?pick(peopleOf('friend')):null);
    if(fr){if(ctx)ctx.fr=fr;personDies(fr,{quiet:true});out.push(`${fr.name} passed away`);}}
  if(e.addAsset){const spec=typeof e.addAsset==='string'?{name:e.addAsset}:e.addAsset;const x=assetByName(spec.name);if(x){const v=giveAsset(x,spec.value,'gift');out.push(`+${x.n} (${fmt(v)})`);}}
  if(e.death){die(fill(e.death,ctx));}
  return out.join(', ');}

/* ---------- education ---------- */
const inSchool=()=>['elementary','middle','high','college','grad'].includes(S.edu.stage);
const STAGE_NAME={elementary:'Trainer School (Elementary)',middle:'Middle School',high:'High School',college:'University',grad:'Graduate School (PhD)'};
function eduYear(){const e=S.edu;
  if(S.age===5&&e.stage==='none'){e.stage='elementary';e.years=0;log(`🎒 You started at the ${S.town} Trainer School.`);}
  else if(S.age===11&&e.stage==='elementary'){e.stage='middle';e.years=0;log('🏫 You moved up to middle school.');}
  else if(S.age===14&&e.stage==='middle'){e.stage='high';e.years=0;log('🏫 You started high school.');}
  if(!inSchool())return;e.years++;
  addStat('smarts',ri(0,2)+(e.stage==='college'||e.stage==='grad'?1:0));
  e.grades=clamp(Math.round(e.grades*.7+S.stats.smarts*.3+ri(-8,8)),0,100);
  if(e.stage==='high'&&S.age>=18){if(e.grades>=25){e.stage='none';e.done='highschool';log('🎓 You graduated from high school!','good big');addStat('happiness',6);gradPopup();}else{log('You failed your final year of high school and have to repeat it.','bad');addStat('happiness',-6);}}
  if(e.stage==='college'){S.money-=8000;if(e.years>=4){e.stage='none';e.done='college';log(`🎓 You graduated from ${S.region} University!`,'good big');addStat('happiness',8);addStat('smarts',4);}}
  else if(e.stage==='grad'&&e.years>=5){e.stage='none';e.done='phd';log('🎓 You earned your PhD in Pokémon Studies! Dr. '+S.last+'!','good big');addStat('smarts',6);addStat('happiness',8);}
}
function gradPopup(){popup({icon:'🎓',title:'You graduated!',html:'What do you want to do next?',buttons:[
  {t:'Apply to university',fn:()=>applyCollege()},{t:'Become a full-time Pokémon Trainer',cls:'good',fn:()=>{takeJob(D.careerById.trainer);}},{t:'Look for a job',cls:'sec2',fn:()=>{setTimeout(()=>openCareer(),50);}},{t:'Take a gap year',cls:'sec2',fn:()=>{log('You took a gap year to figure things out.');addStat('happiness',4);}}]});}
function applyCollege(){if(S.edu.done==='none'){popup({icon:'📚',title:'Not eligible',html:'You need a high school diploma first.'});return;}
  if(inSchool()){toast('You are already in school.');return;}
  const ch=clamp((S.stats.smarts-15)/60,.1,.95);if(R()<ch){S.edu.stage='college';S.edu.years=0;log(`📚 You were accepted to ${S.region} University! Tuition is ₽8,000/yr.`,'good');if(S.job&&S.job.cat!=='parttime')quitJob(true);popup({icon:'🎉',title:'Accepted!',html:`Welcome to ${esc(S.region)} University.`});}
  else{log('Your university application was rejected.','bad');addStat('happiness',-5);popup({icon:'📭',title:'Rejected',html:'The admissions office turned you down. Study harder and try again next year.'});}}
function applyGrad(){if(S.edu.done!=='college'||inSchool())return;if(S.stats.smarts<55){popup({icon:'📭',title:'Rejected',html:'Grad school requires at least 55 Smarts.'});return;}
  S.edu.stage='grad';S.edu.years=0;log('🔬 You entered a PhD program in Pokémon Studies.','good');if(S.job&&S.job.cat!=='parttime')quitJob(true);refreshSheet();}

/* events.json effect {"school":"college"}: enroll directly (the event already says you were accepted). */
function enrollFromEvent(kind){if(kind!=='college')return'';
  if(S.edu.stage==='college'||S.edu.stage==='grad')return'Already enrolled';
  if(S.edu.done==='none')return'Need a high school diploma first';
  if(EDU_RANK[S.edu.done]>=EDU_RANK.college)return'Already have a degree';
  S.edu.stage='college';S.edu.years=0;if(S.job&&S.job.cat!=='parttime')quitJob(true);
  log(`📚 You enrolled at ${S.region} University. Tuition is ₽8,000/yr.`,'good');return`Enrolled at ${S.region} University`;}

/* ---------- careers ---------- */
const EDU_RANK={none:0,highschool:1,college:2,phd:3};
// requires.region: a region id or array of ids (as in gyms.json); the player must currently be in one of them (S.region).
function careerRegions(c){const g=(c.requires||{}).region;return g==null?null:[].concat(g);}
function careerRegionOk(c){const rs=careerRegions(c);return !rs||rs.includes(S.region);}
/* Career text may use {region} (current region) and {city} (a city in the current region, fixed per career). */
function careerCity(c){const r=D.regions[S.region];const ts=(r&&r.towns&&r.towns.length?r.towns:[S.town]);let h=0;for(const ch of String(c.id))h=(h*31+ch.charCodeAt(0))>>>0;return ts[h%ts.length];}
function careerText(c,t){return String(t==null?'':t).replace(/\{region\}/g,S.region).replace(/\{city\}/g,careerCity(c)).replace(/\{town\}/g,S.town);}
function careerReqs(c){const r=c.requires||{};const out=[];
  const rs=careerRegions(c);if(rs)out.push([`In ${rs.join(' or ')}`,rs.includes(S.region)]);
  out.push([`Age ${c.minAge}+`,S.age>=c.minAge]);
  if(r.education&&r.education!=='none')out.push([{highschool:'High school diploma',college:'University degree',phd:'PhD'}[r.education]||r.education,EDU_RANK[S.edu.done]>=EDU_RANK[r.education]]);
  if(r.minStat)for(const k in r.minStat)out.push([`${STAT_LABEL[k]||k} ${r.minStat[k]}+`,(S.stats[k]||0)>=r.minStat[k]]);
  if(r.minBadges)out.push([`${r.minBadges} badges (total)`,totalBadges()>=r.minBadges]);
  if(r.minPokemon)out.push([`${r.minPokemon}+ Pokémon`,allMons().length>=r.minPokemon]);
  if(r.minDex)out.push([`${r.minDex}+ Pokédex caught`,dexCaught()>=r.minDex]);
  if(r.championBeaten)out.push(['Beat a Champion',Object.keys(S.champion).length>0]);
  if(c.category!=='parttime'&&c.id!=='trainer'&&inSchool())out.push(['Not in full-time school',false]);
  return out;}
function takeJob(c){S.job={id:c.id,title:careerText(c,c.title),cat:c.category,salary:c.salary,years:0,tier:-1,perf:55,emoji:c.emoji};S.cnt.jobs++;S.retired=false;
  log(`${c.emoji||'💼'} You started working as ${an(careerText(c,c.title))}${c.salary?' ('+fmt(c.salary)+'/yr)':''}.`,'good');}
function applyJob(c){const reqs=careerReqs(c);if(reqs.some(x=>!x[1])){toast('You don\'t meet the requirements.');return;}
  if(S.job){popup({title:'Quit current job?',icon:'💼',html:`You'll leave your job as ${esc(S.job.title)}.`,buttons:[{t:'Quit & apply',fn:()=>{quitJob(true);applyJob(c)}},{t:'Cancel',cls:'sec2'}]});return;}
  const ch=['trainer','breeder','daycare','mart_clerk'].includes(c.id)?1:clamp(.35+S.stats.smarts/300+S.stats.looks/400+(S.stats.happiness-50)/500,.2,.95);
  if(R()<ch){takeJob(c);popup({icon:c.emoji||'💼',title:'You got the job!',html:`You're now a <b>${esc(c.title)}</b>.`});}
  else{log(`You interviewed for ${c.title} but didn't get the job.`,'bad');popup({icon:'📭',title:'Not hired',html:`The ${esc(c.title)} position went to someone else.`});}
  save();refreshSheet();render();}
function quitJob(quiet){if(!S.job)return;if(!quiet)log(`You quit your job as ${S.job.title}.`);S.job=null;}
function jobYear(){const j=S.job;if(!j){if(S.retired&&S.pension){earn(S.pension);}return;}
  const c=D.careerById[j.id]||{promotions:[],stress:5,perks:{}};j.years++;
  earn(j.salary);
  if(j.id==='trainer'){const b=totalBadges();if(b){const sp_=Math.min(b,16)*1500+Math.max(0,b-16)*500+Object.keys(S.champion).length*15000;earn(sp_);log(`Trainer sponsorships paid ${fmt(sp_)} this year.`);}}
  const st=c.stress||0;if(st){addStat('happiness',-Math.round(st/5));if(st>9)addStat('health',-1);}
  const pk=c.perks||{};
  for(const k of['smarts','health','looks','happiness'])if(pk[k+'Gain'])addStat(k,pk[k+'Gain']);
  const kd=(typeof pk.karma==='number'?pk.karma:0)+(pk.badKarma?-4:0)+(typeof c.karma==='number'?c.karma:0);
  if(kd){S.karma=clamp(S.karma+kd,0,100);}
  if((pk.badKarma||kd<0)&&S.karma<30&&R()<.15){const fine=Math.min(Math.max(0,S.money),ri(5,30)*1000);S.money-=fine;log(`🚓 You were arrested for your work as ${an(j.title)}! Fined ${fmt(fine)} and fired.`,'bad big');addStat('happiness',-15);S.job=null;return;}
  // Full-time trainers are self-employed: their standing comes from badges, not a boss's review.
  if(j.id==='trainer')j.perf=clamp(40+totalBadges()*5,0,100);else j.perf=clamp(j.perf-ri(3,8)+Math.round((S.stats.smarts-50)/25),0,100);
  const nx=(c.promotions||[])[j.tier+1];
  if(nx&&j.years>=nx.years&&j.perf>=55&&R()<.7){j.tier++;j.title=careerText(c,nx.title);j.salary=nx.salary;log(`📈 You were promoted to ${j.title}! New salary ${fmt(nx.salary)}.`,'good big');addStat('happiness',8);}
  else if(j.salary&&j.perf>=75&&R()<.3){j.salary=Math.round(j.salary*1.06);log(`You got a raise to ${fmt(j.salary)}.`,'good');}
  if(j.perf<15&&j.id!=='trainer'&&R()<.5)fireFromJob();
  if(j.id==='gym_leader'&&S.job){const n=ri(8,40),w=Math.round(n*(.5+R()*.4));log(`🏟️ ${n} challengers faced your gym this year. You won ${w}.`);}
  if(j.id==='professor'&&S.job&&R()<.6){const s=D.regions[S.region].starters;if(s.length)log(`🔬 You handed ${an(sp(pick(s)).name)} to a nervous 10-year-old.`);}
}
function retire(){if(!S.job)return;S.pension=Math.round(S.job.salary*.45);log(`🏖️ You retired from your job as ${S.job.title}. Pension: ${fmt(S.pension)}/yr.`,'good');S.job=null;S.retired=true;addStat('happiness',10);}

/* ---------- people ---------- */
function peopleYear(){
  for(const p of S.people){if(!p.alive)continue;p.age++;
    if(p.type!=='child'||p.age>18)p.rel=clamp(p.rel-ri(0,3),0,100);
    const dp=p.age<55?.001:Math.pow((p.age-50)/45,4)*.3;
    if(R()<dp)personDies(p);
  }
  // allowance & sibling births
  const par=peopleOf('mother','father');
  if(S.age>=6&&S.age<18&&par.length&&R()<.5){const a=ri(1,6)*100;S.money+=a;log(`Your parents gave you ${fmt(a)} in allowance.`);}
  if(S.age>0&&S.age<12&&par.length===2&&par.every(p=>p.age<44)&&R()<.1){const b=newPerson('sibling',{last:S.last});b.age=0;S.people.push(b);log(`👶 Your parents had a baby: your new sibling ${b.name}!`,'good');}
  const pa=partner();if(pa){pa.years=(pa.years||0)+1;if(pa.rel<15&&R()<.5){log(`💔 ${pa.name} broke up with you.`,'bad big');pa.type='ex';addStat('happiness',-12);}}
  for(const k of kids()){if(k.age===10&&!k.gotStarter){k.gotStarter=true;log(`🎒 Your child ${k.name} turned 10 and left on their own Pokémon journey!`,'good');}}
}
function relLabel(p){return{mother:'mother',father:'father',sibling:'sibling',friend:'friend',rival:'rival',partner:p.gender==='female'?'girlfriend':p.gender==='male'?'boyfriend':'partner',fiance:'fiancé(e)',spouse:p.gender==='female'?'wife':p.gender==='male'?'husband':'spouse',ex:'ex','late partner':'late partner',child:p.gender==='female'?'daughter':p.gender==='male'?'son':'child','late spouse':'late spouse'}[p.type]||p.type;}

/* ---------- pokemon yearly ---------- */
function pokemonYear(){
  const gone=[];
  const fainted=[];
  for(const m of S.party){m.age++;m.with=(m.with??m.age-1)+1;
    if(!m.touched){m.bond=clamp(m.bond-ri(6,12),0,100);}
    if(m.hp<=0){m.bond=clamp(m.bond-8,0,100);fainted.push(m.nick);}
    m.hp=1;m.touched=false;m.played=false;
    if(m.bond>25){m.warn=0;}
    else{m.warn=(m.warn||0)+1;
      if(m.warn>=4&&m.bond<=12){gone.push(m);log(`💔 Your ${m.nick} felt neglected and ran away.`,'bad big');addStat('happiness',-8);continue;}
      if(m.warn===1)log(`⚠️ Your ${m.nick} seems distant (bond ${m.bond}%). Play with it or train together.`,'bad');
      else if(m.warn===2)log(`⚠️⚠️ Your ${m.nick} is ignoring you (bond ${m.bond}%). It may leave if this goes on.`,'bad');
      else{const mm=m;log(`🚨 Your ${m.nick} is about to run away (bond ${m.bond}%)!`,'bad big');
        popupIfAlive(()=>S.party.includes(mm)?{icon:'🚨',title:`${mm.nick} is about to leave!`,html:`Bond ${mm.bond}%. This is your last warning: spend time with ${esc(mm.nick)} this year or it will run away.`,
          buttons:[{t:`Play with ${mm.nick} now (1⚡)`,fn:()=>{if(!useAP())return;mm.bond=clamp(mm.bond+18,0,100);mm.touched=true;mm.played=true;if(mm.bond>25)mm.warn=0;log(`You spent the afternoon with ${mm.nick}. It looks happier.`,'good');}},{t:'Later',cls:'sec2'}]}:null);}}
    if(m.age>30&&R()<.06){gone.push(m);const yrs=m.with??m.age;log(`🕊️ Your beloved ${m.nick} passed away${yrs>=1?` after ${yrs} year${yrs===1?'':'s'} together`:''}.`,'bad big');addStat('happiness',-12);}
  }
  if(fainted.length)log(fainted.length===1?`Your ${fainted[0]} was left fainted for too long and is upset with you.`:`${fainted.length} of your Pokémon (${fainted.join(', ')}) were left fainted for too long and are upset with you.`,'bad');
  for(const m of S.pc){m.age++;m.with=(m.with??m.age-1)+1;m.hp=1;}
  S.party=S.party.filter(m=>!gone.includes(m));
  if(S.egg){const s=sp(S.egg);if(s){const m=makeMon(s.id,1,{met:'egg',bond:70});const w=addMon(m);log(`🥚 Your egg hatched into ${an(s.name)}! (${w})`,'poke big');}S.egg=null;}
  // Under-10 heirs keep inherited Pokémon in the PC until their own journey starts.
  if(!S.party.length&&S.pc.length&&S.age>=10&&S.starterGiven){S.party.push(S.pc.shift());}
}

/* ---------- health ---------- */
function healthYear(){
  if(S.age>=45)addStat('health',-ri(0,S.age>75?5:S.age>60?3:2));
  if(S.age>=50&&R()<.08)addStat('looks',-ri(1,4));
  for(const il of S.illness){il.years++;addStat('health',-il.sev*ri(1,2));addStat('happiness',-1);if((il.sev<=2&&R()<.5)||(il.sev<=4&&R()<.15)){il.cured=true;log(`You recovered from your ${il.name}.`,'good');}}
  S.illness=S.illness.filter(i=>!i.cured);
  if(S.age<40&&!S.illness.length)addStat('health',ri(0,2));
  if(S.stats.health<25&&S.alive)log('⚠️ Your health is failing. See a doctor (Activities → Doctor)!','bad');
  const pr=S.age<15?.04:S.age<50?.06:.12;
  if(R()<pr){const pool=ILLNESSES.filter(i=>S.age>40||i[1]<=3);const i=pick(pool);if(!S.illness.find(x=>x.name===i[0])){S.illness.push({name:i[0],sev:i[1],years:0});log(`🤒 You were diagnosed with ${i[0]}.`,'bad');}}
  if(S.party.length&&S.age>=10)addStat('health',R()<.5?1:0);
  S.assets.forEach(a=>{a.value=Math.round(a.value*(a.k==='home'?1+(R()*.07-.015):.9));});
  if(S.assets.length)addStat('happiness',1);
  if(S.money<-20000&&!(S.debtMsgAge!=null&&S.age-S.debtMsgAge<3)&&R()<.4){S.debtMsgAge=S.age;addStat('happiness',-5);log(`Your debts are stressing you out.${canBankrupt()?' (Bankruptcy is an option under Activities.)':''}`,'bad');}
}
function deathCheck(){if(!S.alive)return;
  if(S.stats.health<=0){const worst=S.illness.slice().sort((a,b)=>b.sev-a.sev)[0];die(worst&&worst.sev>=3?worst.name:S.age>75?'old age':'poor health');return;}
  let p=S.age<50?.0008:Math.pow((S.age-52)/40,4)*.25*(1.6-S.stats.health/100);
  if(S.illness.some(i=>i.sev>=5))p+=.04;
  if(R()<p)die(S.age>75?'old age':pick(['a heart attack','a stroke',['Kanto','Hoenn'].includes(S.region)?'an accident on Cycling Road':'a bike accident','complications of illness']));}
function die(cause){if(!S.alive)return;S.alive=false;S.cause=cause;log(`⚰️ You died at age ${S.age} from ${cause}.`,'bad big');}

/* ---------- yearly random events ---------- */
const evIllness=e=>[e.effects||{}].concat((e.choices||[]).map(c=>c.effects||{}),(e.choices||[]).map(c=>c.failEffects||{})).map(f=>f.illness).filter(Boolean);
/* Per-event cooldown: an event can't fire again until `cooldown` years have passed (default 2; milestones exempt:
   once:true events and events whose age window is 2 years or less). `cooldown: 0` in data disables it. */
const evCooldown=e=>e.cooldown!=null?e.cooldown:(e.once||(e.maxAge-e.minAge)<=2)?0:2;
const evCooling=e=>{const l=(S.evLast||{})[e.id];return l!=null&&S.age-l<evCooldown(e);};
function eligibleEvents(){return D.events.filter(e=>S.age>=e.minAge&&S.age<=e.maxAge&&!(e.once&&S.flags['ev_'+e.id])&&!evCooling(e)&&meets(e.requires)&&(!e.requires||!e.requires.hasPokemon||S.party.length)
  &&!evIllness(e).some(n=>S.illness.some(i=>i.name===n)));}
/* Choice events are queued as lazy popups: text is filled when the popup is actually shown (so an
   age-10 event shown after the starter pick sees the new starter), and the popup is skipped
   entirely if the character died earlier in the queue. Several choice popups can happen per year. */
/* An optional choice costing more than your cash + ₽2,000 is marked "can't afford" and picking it just passes (no cost,
   no effects), as long as some other choice is affordable. Keeps optional spending from driving players into debt. */
const choiceCost=c=>c&&c.effects&&c.effects.money<0?-c.effects.money:0;
function cantAfford(c,all){const lim=Math.max(0,S.money)+2000;return choiceCost(c)>lim&&all.some(x=>choiceCost(x)<=lim);}
function fireEvent(e){if(e.once)S.flags['ev_'+e.id]=1;(S.evLast=S.evLast||{})[e.id]=S.age;const ctx={};const year=S.age;
  const gspecs=[e.effects].concat((e.choices||[]).map(c=>c.effects)).filter(f=>f&&f.pokemon!=null).map(f=>f.pokemon);
  if(gspecs.length){ctx.gifts=true;const ids=[...new Set(gspecs.map(g=>JSON.stringify(g&&typeof g==='object'?g.id:g)))];if(ids.length===1)ctx.giftSpec=gspecs[0];}
  if(e.choices&&e.choices.length){popupIfAlive(()=>{if(S.age!==year)return null;const text=fill(e.text,ctx);return{icon:e.emoji||'❔',title:e.title?fill(e.title,ctx):`Age ${S.age}`,html:esc(text),buttons:e.choices.map((c,ci,all)=>({t:fill(c.label,ctx)+(cantAfford(c,all)?` (can't afford ${fmt(-c.effects.money)})`:''),fn:()=>{if(cantAfford(c,all)){log(esc(text));const r=`You couldn't afford it (${fmt(choiceCost(c))}), so you passed.`;log(esc(r),'mute');popupFront({icon:'💸',title:'Not enough money',html:esc(r)});render();save();return;}
      let ok=c.chance==null||R()<c.chance;const block=ok?lifeBlock(c.effects):null;if(block)ok=false; // can't qualify = the choice fails
      const eff=ok?c.effects:(c.failEffects||{});
      log(esc(text));let sum=applyEffects(eff,ctx);if(block)sum=sum?`${block}, ${sum}`:block;
      const res=fill(ok?c.result:(c.failResult||(block?"It didn't work out.":c.result)),ctx);log(esc(res)+(sum?` (${esc(sum)})`:''),ok?'':'bad');
      popupFront({icon:ok?'✅':'❌',title:ok?'Result':'Uh oh…',html:esc(res)+(sum?`<div class="small" style="margin-top:8px">${esc(sum)}</div>`:'')});
      if(!S.alive)deathPopup();render();save();}}))};});}
  else{if(lifeBlock(e.effects))return; // auto event whose life change can't happen: skip it rather than log a contradiction
    const sum=applyEffects(e.effects,ctx);log(esc(fill(e.text,ctx))+(sum?` <span class="mute">(${esc(sum)})</span>`:''));}
}
const MAX_CHOICES_PER_YEAR=2;
function randomEvents(){const el=eligibleEvents();if(!el.length)return;
  const n=S.age<3?(R()<.5?1:0):ri(1,2);let choices=0;const used=new Set();
  for(let i=0;i<n;i++){const e=wpick(el.filter(x=>!used.has(x)&&!(choices>=MAX_CHOICES_PER_YEAR&&x.choices)),x=>x.weight);if(!e)break;used.add(e);if(e.choices)choices++;fireEvent(e);if(!S.alive)return;}}
function systemEvents(){
  const r=D.regions[S.homeRegion];
  if(S.age===10&&!S.starterGiven){starterPopup();}
  if(S.age>=10&&S.age<=30&&S.rivalId&&S.party.length&&R()<.3){const rv=person(S.rivalId);if(rv&&rv.alive){popupIfAlive({icon:'😤',title:'Your rival appears!',html:`${esc(rv.name)} blocks your path: "Let's see how strong you've gotten!"`,buttons:[{t:'Battle!',fn:()=>{if(alive().length)rivalBattle(rv);else log(`${rv.name} wanted a battle, but your team was too worn out.`);}},{t:'Not now',cls:'sec2',fn:()=>{log(`You dodged a battle with ${rv.name}.`);rv.rel=clamp(rv.rel-3,0,100);}}]});}}
  trainerNudge();romanceNudges();
  if(S.age>=5&&R()<.12){const s=randSpecies(S.region);markSeen(s.id);log(pick([`You watched a wild ${s.name} play in the park.`,`${an(s.name).replace(/^a/,'A')} wandered through ${S.town}.`,`You saw ${an(s.name)} on TV and looked it up.`]),'poke');}
  if(S.age>=3&&R()<.08&&S.party.length<1&&S.age<10){log(pick(['You begged your parents for a Pokémon. "When you\'re ten!" they said.','You drew pictures of the Pokémon you wanted as a starter.','You pretended your plush Pokémon was real.']));}

/* Bankruptcy: wipes debt once every 10 years, at a cost (assets seized, karma and happiness hit). */
function canBankrupt(){return S.alive&&S.age>=18&&S.money<=-10000&&!(S.bankruptAge!=null&&S.age-S.bankruptAge<10);}
function declareBankruptcy(){if(!canBankrupt())return false;const debt=-S.money;const seized=S.assets.length;S.assets=[];S.money=0;S.bankruptAge=S.age;S.cnt.bankrupt=(S.cnt.bankrupt||0)+1;
  S.karma=clamp(S.karma-10,0,100);addStat('happiness',-15);addStat('smarts',-2);

  const others=D.regions[S.homeRegion].starters.filter(x=>x!==id);let rs=others.find(o=>sp(o)&&sp(o).types.some(t=>eff(t,s.types)>1))||others[0]||id;

function rivalTeam(rv){const L=Math.max(5,Math.round(avgTopLevel()+ri(-1,2)));const n=clamp(Math.floor(S.age/3)-2,1,6);let st=rv.starter||pick(D.mons).id;

  return[{id:cur,lvl:L+1}].concat(randomTeam(n-1,L-1,{region:S.region}));}
function rivalBattle(rv){const res=simBattle(rivalTeam(rv),{foeName:rv.name});

function stateDefaults(){return{v:1,karma:50,ap:2,money:0,log:[],party:[],pc:[],dex:{seen:{},caught:{}},items:{},badges:{},champion:{},ribbons:[],contestRank:{},

/* popups */
const Q=[];let curPop=null;

let inPopHandler=false;
function popup(p){if(curPop&&!Q.length&&isInfoPop(curPop)&&isInfoPop(p)&&(curPop.parts||[curPop]).length<6){curPop=mergePops((curPop.parts||[curPop]).concat([p]));drawPop();return;}
  Q.push(p);if(!curPop&&!inPopHandler)nextPop();}
function popupFront(p){Q.unshift(p);if(!curPop&&!inPopHandler)nextPop();}
/* A queued popup may be {lazy:fn}: fn runs when the popup reaches the front and returns the real
   popup, or null to skip it (e.g. the character already died this year). */
function popupIfAlive(p){popup({lazy:()=>S&&S.alive?(typeof p==='function'?p():p):null});}
/* Info-only popups (no button actions) that pile up are shown as ONE dialog, so one tap clears them. */
const isInfoPop=p=>p&&!p.lazy&&!p.death&&!p.noClose&&!(p.buttons&&p.buttons.some(b=>b.fn));
function nextPop(){curPop=Q.shift()||null;
  while(curPop&&curPop.lazy){let r=null;try{r=curPop.lazy();}catch(e){console.error(e);}curPop=r||Q.shift()||null;}
  const m=$('modal');if(!curPop){m.classList.add('hidden');updateAgeBtn();return;}
  if(isInfoPop(curPop)){const parts=[curPop];while(Q.length&&isInfoPop(Q[0])&&parts.length<6)parts.push(Q.shift());if(parts.length>1)curPop=mergePops(parts);}
  drawPop();}
function mergePops(parts){const f=parts[0];return{icon:f.icon,title:f.title,parts,log:f.log,
  html:(f.html||'')+parts.slice(1).map(x=>`<div class="mergedpop">${x.icon?`<span class="mi2">${x.icon}</span> `:''}<b>${esc(x.title||'')}</b>${x.html?`<div>${x.html}</div>`:''}${x.log?`<div class="battlelog">${x.log}</div>`:''}</div>`).join('')};}
function drawPop(){const m=$('modal');
  const p=curPop;const btns=(p.buttons&&p.buttons.length?p.buttons:[{t:'OK'}]);
  $('modalCard').innerHTML=`${p.icon?`<div class="mi">${p.icon}</div>`:''}<h3>${esc(p.title||'')}</h3><div class="mb">${p.html||''}</div>${p.log?`<div class="battlelog">${p.log}</div>`:''}<div class="btns">${btns.map((b,i)=>`<button class="btn ${b.cls||''}" data-i="${i}" ${b.dis?'disabled':''}>${esc(b.t)}</button>`).join('')}</div>`;
  m.classList.remove('hidden');updateAgeBtn();

const VACATIONS={Kanto:['on Cinnabar Island','at the Seafoam Islands','on One Island in the Sevii Islands','at a Vermilion seaside inn'],Johto:['at the Mt. Mortar hot springs','on Cianwood\'s beaches','by the Lake of Rage','at an Ecruteak ryokan'],

function simpleAct(eff,text){if(!useAP())return;const sum=applyEffects(eff);log(text+(sum?` <span class="mute">(${esc(sum)})</span>`:''));toast(sum||text);}
function doDoctor(){if(!useAP())return;const cost=S.illness.length?S.illness.reduce((a,i)=>a+i.sev*600,0):200;S.money-=cost;
  if(!S.illness.length){addStat('health',ri(1,3));log(`You got a checkup (${fmt(cost)}). The doctor says you're doing fine.`);toast('Healthy!');return;}
  const cured=[];S.illness=S.illness.filter(i=>{if(R()<(i.sev>=6?.35:.8)){cured.push(i.name);return false}return true;});
  addStat('health',cured.length?ri(4,10):1);log(cured.length?`🩺 The doctor cured your ${cured.join(', ')} (${fmt(cost)}).`:`The treatment didn't work this time (${fmt(cost)}).`,cured.length?'good':'bad');
  popup({icon:'🩺',title:cured.length?'Treatment worked!':'No luck',html:cured.length?'Cured: '+esc(cured.join(', ')):'Your illness persists. Try again later.'});}
function doTrain(){if(!useAP())return;const L=[];const ups=[];S.party.forEach((m,i)=>{m.touched=true;m.bond=clamp(m.bond+2,0,100);const b=m.lvl;gainXp(m,nextLvGain(m.lvl)*(i===0?1:.7),L);if(m.lvl>b)ups.push(`${m.nick} → Lv ${m.lvl}`);});
  log(`💪 You trained your team.${ups.length?' '+ups.join(', ')+'.':''}`);addStat('health',1);
  popup({icon:'💪',title:'Training complete',html:ups.length?esc(ups.join(' · ')):'Your team got a little stronger.',log:L.map(esc).join('<br>')||null});}
function doCenter(){const fainted=S.party.filter(m=>m.hp<=0).length;const free=S.age<18||perk('healFree');const fee=free?0:fainted*150;
  if(fee&&S.money<fee){toast(`Reviving costs ${fmt(fee)} (₽150 per fainted Pokémon).`);return;}
  S.money-=fee;S.party.forEach(m=>{m.hp=1;m.touched=true;});toast(`Your Pokémon are fully healed! ♪${fee?' (-'+fmt(fee)+')':free&&perk('healFree')?' (staff: free)':''}`);}
function showBattle(res,title){popup({icon:res.win?'🏆':'💥',title,html:'',log:res.lines.map(l=>typeof l==='string'?`<div>${esc(l)}</div>`:`<div class="${l.c}">${esc(l.t)}</div>`).join('')});}
function needAlive(){if(!alive().length){popup({icon:'🏥',title:'Your Pokémon are exhausted',html:'All your party Pokémon have fainted. Visit the Pokémon Center first.',buttons:[{t:'Go to Pokémon Center',fn:doCenter},{t:'Cancel',cls:'sec2'}]});return false}return true;}
const TRAINER_CLASSES=['Youngster','Lass','Bug Catcher','Hiker','Swimmer','Ace Trainer','Bird Keeper','Picnicker','Camper','Black Belt','Psychic','Beauty','Fisherman','Gentleman','Cooltrainer','Ruin Maniac','Pokéfan','Rich Boy','Battle Girl','Dragon Tamer'];
function doTrainerBattle(){if(!needAlive()||!useAP())return;const L=Math.max(3,Math.round(avgTopLevel()+ri(-4,1)));const n=clamp(ri(1,Math.floor(S.age/5)),1,4);
  const nm=`${pick(TRAINER_CLASSES)} ${pick(NAMES[R()<.5?'male':'female'])}`;const team=randomTeam(n,L,{region:S.region});const res=simBattle(team,{foeName:nm});
  const pz=Math.round(team.reduce((a,t)=>a+t.lvl,0)*(15+2*Math.min(16,totalBadges())));
  if(res.win){earn(pz);addStat('happiness',2);log(`⚔️ You defeated ${nm} and won ${fmt(pz)}.`,'good');}else{const lo=Math.min(Math.max(0,S.money),Math.round(pz/2));S.money-=lo;addStat('happiness',-2);log(`⚔️ You lost to ${nm}${lo?' and paid '+fmt(lo):''}.`,'bad');}
  showBattle(res,res.win?`You beat ${nm}! +${fmt(pz)}`:`${nm} won…`);}
function matchHint(m,type){if(!TYPES.includes(type))return'';const s=sp(m.id);const off=Math.max(...s.types.map(t=>eff(t,[type])));const def=eff(type,s.types);
  return off>1&&def<=1?' ✅ strong':def>1?' ⚠️ weak':off<1?' ➖ resisted':'';}
/* Pick a lead, then fight with one optional switch (offered each time the foe sends out a new Pokémon). */
function interactiveBattle(foes,o,done){const al=alive();
  const start=lead=>{if(lead){S.party.splice(S.party.indexOf(lead),1);S.party.unshift(lead);}const st=battleInit(foes,Object.assign({},o,{interactive:true}));step(st);};
  const step=st=>{const r=battleRun(st);if(r==='done'){done(battleFinish(st));return;}
    const a=st.A[st.ai],b=st.B[st.bi];const bench=st.A.map((c,j)=>({c,j})).filter(x=>x.j>st.ai&&x.c.hp>0);
    const tail=st.lines.slice(-6).map(l=>typeof l==='string'?`<div>${esc(l)}</div>`:`<div class="${l.c}">${esc(l.t)}</div>`).join('');
    popupFront({icon:'🔁',title:`${o.foeName}: ${b.s.name} (Lv ${b.lvl})`,html:`Foe: ${b.s.types.map(typeBadge).join('')}<br>Your <b>${esc(a.m.nick)}</b> (Lv ${a.lvl}, ${Math.round(a.hp/a.st.hp*100)}% HP)${matchHint(a.m,b.s.types[0])}<div class="small" style="margin-top:6px">You have <b>1 switch</b> this battle. The incoming Pokémon takes a hit.</div>`,log:tail,noClose:true,
      buttons:[{t:`Keep ${a.m.nick} in`,fn:()=>step(st)},...bench.map(x=>({t:`Switch to ${x.c.m.nick} (Lv ${x.c.lvl})${matchHint(x.c.m,b.s.types[0])}`,cls:'sec2',fn:()=>{battleSwitch(st,x.j);step(st);}}))]});};
  if(al.length<=1){start(al[0]);return;}
  const ft=o.foeType;popupFront({icon:'🎯',title:`Choose your lead vs ${o.foeName}`,html:TYPES.includes(ft)?`They use <b>${esc(ft)}</b>-type Pokémon. ${typeBadge(ft)}`:'Pick who goes first.',noClose:true,
    buttons:al.map(m=>({t:`${m.nick} Lv ${m.lvl} (${sp(m.id).types.join('/')})${matchHint(m,ft)}`,cls:m===S.party[0]?'':'sec2',fn:()=>start(m)}))});}
function gymTeam(g){return scaleTeam(resolveTeam(g.team,g.type),g.order||1,g.type);}
function doGym(g){if(!needAlive())return;if(!useAP())return;const team=gymTeam(g);
  interactiveBattle(team,{foeName:`Leader ${g.leader}`,foeType:g.type},res=>{

function rollWild(loc){const special=loc.habitats.includes('special');const champ=S.champion[S.region];

  const legChance=special&&badgeCount()>=8?(champ?.07:.04):0;
  if(R()<legChance){const pool=D.mons.filter(s=>s.rarity==='legendary'&&s.region===S.region&&!owned.has(s.id));const l=wpick(pool,s=>s.habitats.some(h=>h!=='special'&&loc.habitats.includes(h))?1:.1);if(l)return{s:l,lvl:clamp(Math.max(45,Math.round(avgTopLevel()+ri(0,8))),40,75)};}

  const hab=loc.habitats.filter(h=>h!=='special');const pool=D.mons.filter(s=>!isLegend(s));
  const s=wpick(pool,s=>{let w=RARITY_W[s.rarity]||1;w*=s.habitats.some(h=>hab.includes(h))?1:.02;w*=regionW(s.region,S.region);if(D.minLv[s.id]>L+3)w*=.03;return w;})||pick(pool);

function catchP(mult){const e=ENC;if(mult>=255)return 1;const perkB=+perk('catchBonus')||0;

  else if(r<.06){earn(1000);log('🎟️ You won ₽1,000 in the lottery.');toast('Won ₽1,000!');}
  else toast('No luck. Better luck next year!');}
function openAssets(){openSheet('Assets',()=>`${S.assets.length?`<div class="sec">Owned</div><div class="list">${S.assets.map((a,i)=>item(a.e,esc(a.n),'Value '+fmt(a.value),()=>{popup({icon:a.e,title:`Sell ${a.n}?`,html:`You'll get ${fmt(a.value)}.`,buttons:[{t:'Sell',fn:()=>{S.money+=a.value;S.assets.splice(S.assets.indexOf(a),1);log(`You sold your ${a.n} for ${fmt(a.value)}.`);refreshSheet();}},{t:'Keep',cls:'sec2'}]});})).join('')}</div>`:''}
  <div class="sec">For sale</div><div class="list">${ASSETS.map(x=>item(x.e,esc(x.n),x.k==='home'?'Appreciates over time':'Depreciates yearly',()=>{if(S.money<x.p)return toast('Not enough money.');S.money-=x.p;giveAsset(x,x.p,'buy');toast('Purchased '+x.n);},{rt:fmt(x.p)})).join('')}</div>`);}

/* ---------- People ---------- */
function openPeople(){openSheet('Relationships',()=>{const groups=[['Family',['mother','father','sibling','spouse','fiance','partner','child','late spouse','late partner']],['Friends & Rivals',['friend','rival']],['Exes',['ex']]];
  return groups.map(([g,ts])=>{const ps=S.people.filter(p=>ts.includes(p.type));if(!ps.length)return'';return`<div class="sec">${g}</div><div class="list">${ps.map(p=>`<button class="item chev ${p.alive?'':'dis'}" ${act(()=>openPerson(p.id))}><div class="ic">${p.alive?personEmoji(p):'🪦'}</div><div class="tx"><b>${esc(p.name)}</b><small>${relLabel(p)} · ${p.alive?'age '+p.age:'deceased'}</small>${p.alive?`<div class="relbar"><i style="width:${p.rel}%"></i></div>`:''}</div></button>`).join('')}</div>`}).join('')||'<div class="card">No one yet.</div>';});}
function personEmoji(p){const a=p.age;if(a<3)return'👶';if(a<13)return p.gender==='female'?'👧':'👦';if(a<60)return p.gender==='female'?'👩':'👨';return p.gender==='female'?'👵':'👴';}
function openPerson(id){openSheet(()=>{const p=person(id);return p?p.name:''},()=>{const p=person(id);if(!p)return'';const done=p.lastYear===S.age;const lbl=relLabel(p);
  let h=`<div class="card center"><div style="font-size:54px">${p.alive?personEmoji(p):'🪦'}</div><h2 style="margin:4px 0">${esc(p.name)}</h2><div class="small">Your ${lbl} · ${p.alive?'age '+p.age:'deceased'}${p.job?' · '+esc(p.job):''}</div>${p.alive?`<div class="relbar" style="height:9px;margin-top:10px"><i style="width:${p.rel}%"></i></div><div class="small">Relationship ${p.rel}%</div>`:''}${done?'<div class="small" style="margin-top:6px">You\'ve already interacted this year.</div>':''}</div>`;
  if(!p.alive)return h;const once=fn=>()=>{if(p.lastYear===S.age)return toast('Already interacted this year.');p.lastYear=S.age;fn();};
  h+=`<div class="list">${item('☕','Spend time together','',once(()=>{p.rel=clamp(p.rel+ri(4,10),0,100);addStat('happiness',3);log(`You spent quality time with your ${lbl}, ${p.name}.`);toast('Relationship improved!');}),{dis:done})}
   ${item('🎁','Give a gift (₽500)','',once(()=>{if(S.money<500){p.lastYear=-1;return toast('Need ₽500.');}S.money-=500;p.rel=clamp(p.rel+ri(8,15),0,100);log(`You gave ${p.name} a gift.`);toast(p.name+' loved it!');}),{dis:done})}
   ${(p.type==='mother'||p.type==='father')&&S.age>=5?item('💰','Ask for money','',once(()=>{if(R()<p.rel/140){const m=ri(1,10)*(S.age<18?50:300);S.money+=m;log(`${p.name} gave you ${fmt(m)}.`,'good');toast('+'+fmt(m));}else{p.rel=clamp(p.rel-4,0,100);log(`${p.name} refused to give you money.`);toast('They said no.');}}),{dis:done}):''}
   ${S.party.length&&p.age>=10&&['friend','rival','sibling','partner','spouse','child'].includes(p.type)?item('⚔️','Pokémon battle','Friendly match (1⚡)',once(()=>{if(!needAlive()||!useAP()){p.lastYear=-1;return;}const res=p.type==='rival'?(rivalBattle(p),null):simBattle(randomTeam(clamp(Math.floor(p.age/6),1,4),avgTopLevel()+ri(-4,1),{region:S.region}),{foeName:p.name});if(res){p.rel=clamp(p.rel+3,0,100);log(`⚔️ You had a friendly battle with ${p.name} and ${res.win?'won':'lost'}.`);showBattle(res,res.win?'You won!':'You lost!');}}),{dis:done}):''}
   ${item('😠','Argue','',once(()=>{p.rel=clamp(p.rel-ri(8,15),0,100);addStat('happiness',-2);log(`You got into an argument with ${p.name}.`,'bad');}),{dis:done})}
   ${p.type==='partner'&&S.age>=18?item('💍','Propose (₽3,000 ring)','',once(()=>{if(S.money<3000){p.lastYear=-1;return toast('Need ₽3,000 for a ring.');}S.money-=3000;if(R()<p.rel/100+(p.years||0)*.05){marryPartner(p);popup({icon:'💒',title:'Just married!',html:`You and ${esc(p.name)} tied the knot.`});}else{p.rel=clamp(p.rel-15,0,100);log(`${p.name} said no to your proposal.`,'bad');addStat('happiness',-10);popup({icon:'💔',title:'They said no',html:'Maybe it was too soon.'});}}),{dis:done}):''}
   ${p.type==='fiance'?item('💒','Get married (₽5,000 wedding)','',once(()=>{if(S.money<5000){p.lastYear=-1;return toast('A wedding costs ₽5,000.');}S.money-=5000;marryPartner(p);popup({icon:'💒',title:'Just married!',html:`You and ${esc(p.name)} tied the knot.`});}),{dis:done}):''}
   ${(p.type==='spouse'||p.type==='partner'||p.type==='fiance')&&S.age>=18&&S.age<=55&&p.age>=18&&p.age<=55?item('👶','Try for a baby','',once(()=>{if(R()<(S.age<40?.5:.25)){const b=haveBaby(p);const g=b.gender;popup({icon:'👶',title:'It\'s a '+(g==='male'?'boy':'girl')+'!',html:`Welcome to the world, ${esc(b.name)}.`});}else{log('No baby this year.');toast('Not this time.');}}),{dis:done}):''}
   ${p.type==='partner'||p.type==='spouse'||p.type==='fiance'?item('💔',p.type==='spouse'?'Divorce':'Break up','',()=>{popup({icon:'💔',title:'Are you sure?',html:p.type==='spouse'?'Divorce will cost you half your money.':'',buttons:[{t:'Yes',cls:'bad',fn:()=>{if(p.type==='spouse'&&S.money>0)S.money=Math.round(S.money/2);log(`💔 You ${p.type==='spouse'?'divorced':'broke up with'} ${p.name}.`,'bad');p.type='ex';addStat('happiness',-8);closeSheet();}},{t:'No',cls:'sec2'}]});}):''}
   ${p.type==='child'&&S.party.length>1&&p.age>=10?item('🎁','Gift a Pokémon','Give your child a party Pokémon',once(()=>{const m=S.party[S.party.length-1];S.party.pop();(p.mons=p.mons||[]).push(m);p.rel=clamp(p.rel+15,0,100);log(`You gave your ${m.nick} to ${p.name}. They'll take good care of it.`,'good');toast(p.name+' is overjoyed!');}),{dis:done}):''}
  </div>`;return h;});}

/* ---------- Career / school ---------- */
function openCareer(){openSheet('Career & School',()=>{let h='';const e=S.edu;
  h+=`<div class="sec">Education</div><div class="card"><div class="kv"><b>Status</b><span>${inSchool()?STAGE_NAME[e.stage]+` (year ${e.years})`:e.done==='none'?(S.age<5?'Too young for school':'Not in school'):'Finished school'}</span><b>Education</b><span>${{none:'No diploma',highschool:'High school diploma',college:'University degree (graduated)',phd:'PhD (graduated)'}[e.done]}</span>${inSchool()?`<b>Grades</b><span>${e.grades}%</span>`:''}</div>
   ${!inSchool()&&e.done==='highschool'&&S.age>=17?`<button class="btn" ${act(applyCollege)}>Apply to university (₽8,000/yr)</button>`:''}
   ${!inSchool()&&e.done==='college'?`<div class="small" style="margin-top:8px">Optional next step: a 5-year PhD (needs 55+ Smarts). You can work instead; your degree already counts for jobs.</div><button class="btn sec2" ${act(applyGrad)}>Apply to PhD program (optional)</button>`:''}
   ${inSchool()&&['high','college','grad'].includes(e.stage)?`<button class="btn bad" ${act(()=>{popup({icon:'🚪',title:'Drop out?',html:'You will leave school without finishing.',buttons:[{t:'Drop out',cls:'bad',fn:()=>{log(`You dropped out of ${STAGE_NAME[e.stage]}.`,'bad');e.stage='none';addStat('happiness',-3);refreshSheet();}},{t:'Stay',cls:'sec2'}]});})}>Drop out</button>`:''}
   ${!inSchool()&&e.done==='none'&&S.age>=18?`<button class="btn" ${act(()=>{if(S.money<1500)return toast('The GED course costs ₽1,500.');S.money-=1500;if(R()<.4+S.stats.smarts/150){e.done='highschool';log('🎓 You earned your GED!','good');}else log('You failed the GED exam.','bad');})}>Take GED exam (₽1,500)</button>`:''}</div>`;
  h+=`<div class="sec">Job</div>`;
  if(S.job){const j=S.job;const c=D.careerById[j.id]||{};h+=`<div class="card"><div style="display:flex;gap:12px;align-items:center"><div style="font-size:36px">${j.emoji||'💼'}</div><div><b>${esc(j.title)}</b><div class="small">${j.salary?fmt(j.salary)+'/yr · ':''}${j.years} yrs · Performance ${j.perf}%</div>${c.description?`<div class="small">${esc(careerText(c,c.description))}</div>`:''}</div></div>
   <div class="relbar" style="height:8px;margin-top:10px"><i style="width:${j.perf}%;background:#3b82f6"></i></div>
   <div class="row"><button class="btn" ${act(()=>{if(!useAP())return;j.perf=clamp(j.perf+ri(10,20),0,100);addStat('happiness',-1);log(`You worked extra hard as ${an(j.title)}.`);toast('Performance up!');})}>Work hard (1⚡)</button><button class="btn sec2" ${act(()=>{if(j.perf>70&&R()<.5){j.salary=Math.round(j.salary*1.1);log(`You asked for a raise and got it: ${fmt(j.salary)}.`,'good');toast('Raise granted!');}else{j.perf=clamp(j.perf-5,0,100);toast('Raise denied.');}})}>Ask for raise</button></div>
   <div class="row"><button class="btn bad" ${act(()=>quitJob())}>Quit</button>${S.age>=60?`<button class="btn warn" ${act(retire)}>Retire</button>`:''}</div></div>`;}
  else h+=`<div class="card small">${S.retired?'You are retired'+(S.pension?' · pension '+fmt(S.pension)+'/yr':'')+'.':'You are not employed.'}</div>`;
  const list=D.careers.filter(c=>(!S.job||c.id!==S.job.id)&&careerRegionOk(c)); // careers locked to another region are hidden
  const cats=[['pokemon','Pokémon careers'],['regular','Regular jobs'],['parttime','Part-time']];
  for(const[k,t]of cats){const cs=list.filter(c=>c.category===k);if(!cs.length)continue;
    h+=`<div class="sec">${t}</div><div class="list">${cs.map(c=>{const rq=careerReqs(c);const ok=rq.every(x=>x[1]);const pk=c.perks||{};const pks=[pk.healFree?'free healing':'',pk.catchBonus?`+${Math.round(pk.catchBonus*100)}% catch`:'',pk.breedEggs?'better eggs':'',pk.badKarma||pk.karma<0?'⚠️ lowers karma':''].filter(Boolean).join(', ');return item(c.emoji||'💼',esc(careerText(c,c.title)),`${c.description?esc(careerText(c,c.description))+'<br>':''}${c.salary?fmt(c.salary)+'/yr · ':''}${rq.map(x=>`${x[1]?'✓':'✗'} ${esc(x[0])}`).join(' · ')}${pks?'<br>Perks: '+esc(pks):''}`,()=>applyJob(c),{dis:!ok});}).join('')}</div>`;}
  return h;});}

/* ---------- Menu, death, legacy ---------- */
function openMenu(){openSheet('Menu',()=>`<div class="card"><div class="kv"><b>Name</b><span>${esc(S.first+' '+S.last)} (Gen ${S.gen})</span><b>Hometown</b><span>${esc(S.town)}, ${esc(S.homeRegion)}</span><b>Net worth</b><span>${fmt(netWorth())}</span><b>Badges</b><span>${totalBadges()}</span><b>Pokédex</b><span>${dexCaught()} caught / ${dexSeen()} seen</span><b>Battles</b><span>${S.cnt.wins}W – ${S.cnt.losses}L</span><b>Karma</b><span>${S.karma}</span>${S.illness.length?`<b>Illness</b><span>${S.illness.map(i=>esc(i.name)).join(', ')}</span>`:''}</div></div>
  <div class="list">${item('📕','Pokédex','',openDex)}${item('🏅','Badges & Titles','',openBadges)}${item('🎒','Bag','',openBag)}${S.family.length?item('🌳','Family legacy',S.family.length+' previous generation(s)',openFamily):''}
  ${item('💾','Save game','Autosaves after every action',()=>{save();toast('Saved!');})}
  ${item('🆕','New Life','Start over from scratch',()=>{popup({icon:'🆕',title:'Start a new life?',html:'Your current life will be erased.',buttons:[{t:'Start over',cls:'bad',fn:()=>{localStorage.removeItem(SAVE_KEY);S=null;closeAllSheets();$('app').classList.add('hidden');showCreate();}},{t:'Cancel',cls:'sec2'}]});})}
  ${!S.alive?item('⚰️','Life summary','',showDeath):''}</div>
  <p class="small center" style="margin-top:14px">PokéLife is an unofficial, non-commercial fan project. Pokémon names are trademarks of Nintendo / Game Freak / The Pokémon Company. No official artwork is used.</p>`);}
function openFamily(){openSheet('Family legacy',()=>S.family.map(f=>`<div class="card"><b>${esc(f.name)}</b> <span class="small">Gen ${f.gen}</span><div class="small">Died at ${f.age} (${esc(f.cause)}) · ${esc(f.career)} · 🏅${f.badges} · 📕${f.dex} · ${f.champ?'👑 '+esc(f.champ):''}</div></div>`).join(''));}
function legacyScore(){return Math.round(totalBadges()*100+Object.keys(S.champion).length*1000+dexCaught()*20+Math.max(0,netWorth())/10000+kids().length*150+S.ribbons.length*50+S.stats.happiness*3);}
function showDeath(){closeAllSheets();const ks=kids();const champ=Object.keys(S.champion);const best=allMons().slice().sort((a,b)=>b.lvl-a.lvl)[0];
  const heirs=ks.filter(k=>k.age>=6);
  popup({icon:'🪦',title:`${S.first} ${S.last}`,noClose:true,html:`<div class="center small">${S.age<1?'':'Age '+S.age+' · '}died of ${esc(S.cause)}</div><div class="card" style="margin-top:10px;box-shadow:none;background:#f5f7fb"><div class="kv">
   <b>Career</b><span>${esc(S.job?S.job.title:S.retired?'Retired':'—')}</span><b>Education</b><span>${{none:'None',highschool:'High school',college:'University',phd:'PhD'}[S.edu.done]}</span>
   <b>Badges</b><span>${totalBadges()} ${REGION_ORDER.filter(r=>badgeCount(r)).map(r=>`(${r} ${badgeCount(r)})`).join(' ')}</span><b>Champion</b><span>${champ.length?champ.join(', '):'—'}</span>
   <b>Pokédex</b><span>${dexCaught()} caught · ${dexSeen()} seen</span><b>Best partner</b><span>${best?esc(best.nick)+' Lv '+best.lvl:'—'}</span><b>Battles</b><span>${S.cnt.wins}W / ${S.cnt.losses}L</span>
   <b>Ribbons</b><span>${S.ribbons.length}</span><b>Net worth</b><span>${fmt(netWorth())}</span><b>Children</b><span>${ks.length}</span><b>Legacy score</b><span><b>${legacyScore()}</b></span></div></div>
   ${heirs.length?'<div class="small center">Continue your legacy as one of your children? They inherit your Pokémon and most of your wealth.</div>':''}`,
   buttons:[...heirs.slice(0,4).map(k=>({t:`Continue as ${k.name.split(' ')[0]} (age ${k.age})`,cls:'good',fn:()=>continueAs(k)})),{t:'New Life',fn:()=>{localStorage.removeItem(SAVE_KEY);S=null;$('app').classList.add('hidden');showCreate();}},{t:'View life log',cls:'sec2',fn:()=>{}}]});}
function continueAs(k){const old=S;const fam=old.family.concat([{name:old.first+' '+old.last,gen:old.gen,age:old.age,cause:old.cause,career:old.job?old.job.title:'—',badges:totalBadges(),dex:dexCaught(),champ:Object.keys(old.champion).join(', ')}]);
  const gross=Math.round(Math.max(0,netWorth())*.7/Math.max(1,kids().length));const itax=Math.round(Math.max(0,gross-50000)*.35);const inherit=gross-itax;const tokens=old.legendTokens||0;
  const sp_=old.people.find(p=>p.alive&&(p.type==='spouse'||p.type==='partner'));
  const parents=[];if(sp_){const pp=Object.assign({},sp_,{type:sp_.gender==='male'?'father':'mother',rel:70});parents.push(pp);}
  parents.push({id:uid(),type:old.gender==='male'?'father':'mother',name:old.first+' '+old.last,gender:old.gender,age:old.age,rel:80,alive:false,lastYear:-1});
  const sibs=old.people.filter(p=>p.type==='child'&&p!==k).map(p=>Object.assign({},p,{type:'sibling'}));
  // Pokémon you gifted to this child come back first (with their old bond), then the rest of your team.
  const gifted=(k.mons||[]).map(m=>Object.assign(m,{hp:1,with:0}));
  const mons=gifted.concat(old.party.concat(old.pc).map(m=>Object.assign(m,{bond:40,hp:1,with:0})));
  const nn=k.name.split(' ');
  newLife({first:nn[0],last:old.last,gender:k.gender,region:old.homeRegion,town:old.town,age:k.age,gen:old.gen+1,family:fam,dex:old.dex,parents,money:inherit,
    inherit:{people:sibs,party:k.age>=10?mons.slice(0,6):[],pc:k.age>=10?mons.slice(6):mons,items:old.items,assets:[]}});
  S.stats.smarts=clamp(Math.round(old.stats.smarts*.5+ri(10,50)),0,100);
  if(k.age>=10){S.starterGiven=true;}
  if(k.age>=5){S.edu.stage=k.age<11?'elementary':k.age<14?'middle':k.age<18?'high':'none';if(k.age>=18)S.edu.done='highschool';}
  S.legendTokens=tokens;
  // Region-locked one-time events are world events (Spear Pillar, Team Galactic...): they stay done for the whole family line.
  for(const e of D.events)if(e.once&&e.requires&&e.requires.region&&old.flags['ev_'+e.id])S.flags['ev_'+e.id]=1;
  log(`🌳 You are ${S.first} ${S.last}, child of the late ${old.first}. You inherited ${fmt(inherit)}${itax?' after '+fmt(itax)+' inheritance tax':''}${mons.length?' and '+mons.length+' Pokémon'+(gifted.length?' (including '+gifted.length+' your parent gave you)':''):''}.`,'big');
  save();render();}

/* ---------- boot ---------- */
async function boot(){
  try{D=normalize(await loadRaw());}catch(e){console.error(e);$('loading').textContent='Failed to load game data: '+e.message;return;}
  if(!D.mons.length){$('loading').textContent='No Pokémon data found (data/pokemon.json).';return;}
  $('loading').classList.add('hidden');
  $('ageBtn').onclick=()=>{closeAllSheets();ageUp();};
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{if(!S||curPop)return;if(!S.alive){SH.length=0;showDeath();return;}SH.length=0;({career:openCareer,pokemon:openPokemon,people:openPeople,activities:openActivities})[b.dataset.nav]();});
  $('menuBtn').onclick=()=>{if(curPop)return;SH.length=0;openMenu();};
  $('sheetBack').onclick=()=>{if(ENC&&SH.length&&SH[SH.length-1].fn===renderEnc){if(!ENC.done){ENC.done=true;log(`You ran from a wild ${ENC.s.name}.`);}ENC=null;}closeSheet();};
  if(load()){render();if(!S.alive)showDeath();else if(S.age===10&&!S.starterGiven)starterPopup();}else showCreate();
}
window.__pl={financeYear,doLottery,doCasino,leagueFoes,gymTeam,startLegendQuest,doLeague,doContest,doDaycare,doDating,applyJob,openActivities,get S(){return S},get D(){return D},ageUp,chooseStarter,doGym,doTrain,doCenter,doTrainerBattle,startEncounter,encThrow,encFight,simBattle,newLife,save,popupBusy,get Q(){return Q},get curPop(){return curPop},nextPop};
boot();

</script>
