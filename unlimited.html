<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d2b53">
<title>(∞ Energy) PokéLife – a Pokémon-world life sim (fan project)</title>
<style>
:root{--bg:#eef1f7;--card:#fff;--ink:#1f2433;--mute:#7a8196;--pri:#2f6fed;--pri2:#1d2b53;--good:#27ae60;--bad:#e74c3c;--warn:#f39c12;--line:#e3e7f0;--rad:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#cfd6e6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.hidden{display:none!important}
#app,#create{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--pri2)}
#top{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:linear-gradient(135deg,#1d2b53,#2f6fed);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:2}
.who{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.avatar{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.pname{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psub{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topright{text-align:right}
.money{font-weight:800;font-size:15px}
.money.neg{color:#ffb3aa}
.ap{font-size:12px;opacity:.9}
.iconbtn{font-size:22px;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
#top .iconbtn{color:#fff;background:rgba(255,255,255,.12)}
#log{flex:1;overflow-y:auto;padding:12px;scroll-behavior:smooth}
.year{background:var(--card);border-radius:var(--rad);padding:10px 12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(20,30,60,.08)}
.year h4{margin:0 0 6px;font-size:13px;color:var(--pri);letter-spacing:.3px;text-transform:uppercase}
.year p{margin:4px 0;font-size:14.5px;line-height:1.4}
.year p.good{color:#1e8449}.year p.bad{color:#c0392b}.year p.poke{color:#6c3483}.year p.big{font-weight:700}
.year p.mute{color:var(--mute);font-size:13px}
#statsbar{background:var(--card);padding:8px 12px 6px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.stat{display:flex;align-items:center;gap:6px;font-size:12px}
.stat .lbl{width:74px;color:var(--mute);white-space:nowrap}
.bar{flex:1;height:9px;background:#e8ebf2;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;transition:width .4s}
.stat .num{width:30px;text-align:right;font-weight:700}
#nav{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--card);padding:6px 6px;padding-bottom:max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:22px;border-radius:12px}
#nav button small{font-size:11px;color:var(--mute);font-weight:600}
#nav button:active{background:#f0f3fa}
.agebtn{width:66px;height:66px;margin:-26px auto 0;border-radius:50%!important;background:linear-gradient(160deg,#34d399,#16a34a)!important;color:#fff!important;box-shadow:0 4px 14px rgba(22,163,74,.45);border:4px solid #fff!important;justify-content:center}
.agebtn b{font-size:30px;line-height:26px}.agebtn small{color:#fff!important;font-size:11px}
.agebtn:disabled{filter:grayscale(1);opacity:.6}
#sheet{position:fixed;inset:0;z-index:50;background:rgba(10,15,30,.35);display:flex;justify-content:center}
.sheet-inner{width:100%;max-width:480px;height:100%;background:var(--bg);display:flex;flex-direction:column;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.3}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:var(--pri2);color:#fff}
.sheet-head h2{flex:1;margin:0;font-size:18px}
.sheet-head .iconbtn{color:#fff;background:rgba(255,255,255,.12);font-size:26px}
#sheetExtra{font-size:13px;opacity:.9}
.sheet-body{flex:1;overflow-y:auto;padding:12px;padding-bottom:40px}
.sec{font-size:12px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.6px;margin:14px 4px 6px}
.list{background:var(--card);border-radius:var(--rad);overflow:hidden;box-shadow:0 1px 3px rgba(20,30,60,.08)}
.item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item:last-child{border-bottom:0}
button.item:active{background:#f3f6fc}
.item .ic{width:40px;height:40px;border-radius:12px;background:#f0f3fa;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.item .tx{flex:1;min-width:0}.item .tx b{display:block;font-size:15px}.item .tx small{color:var(--mute);font-size:12.5px;display:block;margin-top:1px}
.item .rt{font-size:12px;color:var(--mute);text-align:right;white-space:nowrap}
.item.dis{opacity:.45}
.chev::after{content:"›";font-size:22px;color:#b5bccc;margin-left:4px}
.card{background:var(--card);border-radius:var(--rad);padding:14px;box-shadow:0 1px 3px rgba(20,30,60,.08);margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border-radius:12px;background:var(--pri);color:#fff;font-weight:700;font-size:15px;width:100%;margin-top:8px}
.btn.sec2{background:#e8edf8;color:var(--pri2)}.btn.good{background:var(--good)}.btn.bad{background:var(--bad)}.btn.warn{background:var(--warn)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px}.row>*{flex:1}
.type{display:inline-block;padding:2px 8px;border-radius:999px;color:#fff;font-size:11px;font-weight:800;text-shadow:0 1px 1px rgba(0,0,0,.25);margin-right:3px;letter-spacing:.3px}
.picon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;position:relative;border:2px solid rgba(0,0,0,.05)}
.picon.big{width:84px;height:84px;font-size:46px}
.picon .let{font-weight:900;color:#fff;font-size:20px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.picon.big .let{font-size:38px}
.shiny::after{content:"✨";position:absolute;right:-6px;top:-6px;font-size:14px}
.hpbar{height:7px;background:#e8ebf2;border-radius:4px;overflow:hidden;margin-top:4px}
.hpbar i{display:block;height:100%}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:6px;background:#eef1f7;color:var(--mute);margin-left:4px;vertical-align:middle}
.tag.leg{background:#fff3c4;color:#9a6b00}.tag.new{background:#d6f5e3;color:#1e8449}.tag.rare{background:#e8e0ff;color:#5b3fc4}
#modal{position:fixed;inset:0;z-index:100;background:rgba(10,15,30,.55);display:flex;align-items:center;justify-content:center;padding:18px}
.modal-card{width:100%;max-width:400px;max-height:88vh;overflow-y:auto;background:#fff;border-radius:20px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:pop .2s ease}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.modal-card .mi{font-size:46px;text-align:center}
.modal-card h3{margin:4px 0 8px;text-align:center;font-size:19px}
.modal-card .mb{font-size:15px;line-height:1.45;color:#333}
.battlelog{background:#f5f7fb;border-radius:12px;padding:8px 10px;font-size:13px;max-height:40vh;overflow-y:auto;margin-top:8px}
.battlelog div{padding:2px 0;border-bottom:1px dashed #e1e5ee}
.battlelog .se{color:#c0392b;font-weight:700}.battlelog .ko{color:#6c3483;font-weight:700}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(20,25,40,.92);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
input,select{font:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;margin-top:4px}
label.f{display:block;font-size:13px;font-weight:700;color:var(--mute);margin-top:12px}
.seg{display:flex;gap:6px;margin-top:4px}.seg button{flex:1;padding:10px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-weight:700}
.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.create-hero{background:linear-gradient(135deg,#1d2b53,#2f6fed 60%,#34d399);color:#fff;padding:28px 18px 22px;text-align:center}
.create-hero h1{margin:6px 0 2px;font-size:34px;letter-spacing:-1px}.create-hero p{margin:0;opacity:.85}
.logo{width:64px;height:64px;margin:0 auto;border-radius:50%;background:conic-gradient(#ffd166 0 50%,#fff 0 100%);border:5px solid #1d2b53;position:relative;box-shadow:0 0 0 3px #fff}
.logo::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;background:#fff;border:4px solid #1d2b53}
.grid-dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.dexc{background:#fff;border-radius:10px;padding:6px 4px;text-align:center;font-size:10.5px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.dexc .picon{margin:0 auto 3px;width:38px;height:38px;font-size:20px}
.dexc.unk{opacity:.4}.dexc.seen .picon{filter:grayscale(1) brightness(.6)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.kv b{color:var(--mute);font-weight:600}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;background:#eef1f7;font-size:12px;font-weight:700;margin:2px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.badge{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;background:#eef1f7;filter:grayscale(1);opacity:.4}
.badge.on{filter:none;opacity:1;box-shadow:0 0 0 2px #ffd166}
.center{text-align:center}.small{font-size:12.5px;color:var(--mute)}
.relbar{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin-top:4px;width:100%}.relbar i{display:block;height:100%;background:#ff6b8b}

.gymbtn{margin:0;border:0;border-top:1px solid var(--line);background:#fff7e0;color:#7a4b00;font:inherit;font-size:14px;padding:9px 12px;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gymbtn span{color:#a0791f;font-size:12px}.gymbtn.hidden{display:none}
.bondbar{height:4px;background:#eee;border-radius:2px;overflow:hidden;margin-top:3px;width:100%}.bondbar i{display:block;height:100%}
.mergedpop{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;text-align:left}.mi2{font-size:18px}

</style>
</head>
<body>
<div id="app" class="hidden">
  <header id="top">
    <div class="who"><div id="avatar" class="avatar">🧒</div>
      <div><div id="pname" class="pname"></div><div id="psub" class="psub"></div></div></div>

</div>
<div id="create" class="hidden"></div>

  <div id="sheetBody" class="sheet-body"></div></div></div>
<div id="modal" class="hidden"><div id="modalCard" class="modal-card"></div></div>
<div id="toast"></div>
<div id="loading" class="loading">Loading PokéLife…</div>

nt","delta":5}},"result":"You caught a Magikarp! It flopped around, and you let it go."},{"label":"Get bored and throw rocks","effects":{"happiness":1},"result":"You scared away every fish in the lake. {parent} laughed anyway."},{"label":"Ask a million questions","effects":{"smarts":3,"relationship":{"type":"parent","delta":3}},"result":"You learned about Magikarp, Gyarados, and why patience matters."}]},{"id":"growlithe_neighbor","minAge":5,"maxAge":9,"text":"The Officer Jenny who lives down the street lets you pet her Growlithe.","effects":{"happiness":4,"karma":1}},{"id":"jigglypuff_recital","minAge":6,"maxAge":9,"once":true,"requires":{"inSchool":true},"text":"You were cast as Jigglypuff in the school play.","choices":[{"label":"Sing your heart out","effects":{"happiness":4,"looks":2},"result":"The audience fell asleep. You took that as a compliment.","chance":0.7,"failEffects":{"happiness":-3},"failResult":"You forgot the words and froze."},{"label":"Fake being sick","effects":{"health":1,"happiness":-2},"result":"You stayed home and felt guilty all day."}]},{"id":"stole_candy_from_mart","minAge":6,"maxAge":9,"text":"You're tempted to pocket a Rare Candy from the Poké Mart counter.","choices":[{"label":"Take it","effects":{"karma":-6,"happiness":2},"result":"You got away with it, but it tasted like guilt.","chance":0.5,"failEffects":{"karma":-4,"happiness":-5,"relationship":{"type":"parent","delta":-6}},"failResult":"The clerk caught you and called {parent}."},{"label":"Put it back","effects":{"karma":3},"result":"You walked out with a clean conscience."}]},{"id":"fell_off_bike","minAge":6,"maxAge":9,"text":"You were riding your new bike to the nearest route and hit a rock.","choices":[{"label":"Get back on","effects":{"health":-3,"happiness":3},"result":"Scraped knee, but you made it to the route and back."},{"label":"Walk home crying","effects":{"health":-3,"happiness":-2},"result":"{parent} cleaned the scrape and gave you a Pecha Berry."}]},{"id":"bug_catchi d":"adult_memoir","minAge":62,"maxAge":95,"weight":1,"text":"A big publisher wants you to write your memoir.","choices":[{"label":"Write it","effects":{"money":6000,"happiness":6,"smarts":3},"result":"'A Life with Pokémon' became a modest bestseller."},{"label":"Keep your stories private","effects":{"happiness":1},"result":"Some stories are just for family."},{"label":"Pitch it as a TV documentary instead","effects":{"happiness":8,"money":5000},"result":"It aired nationally. Young trainers stop you in the street now."}],"once":true},{"id":"adult_elder_health_scare","minAge":65,"maxAge":100,"weight":1,"text":"You got dizzy at the Poké Mart and had to sit down.","choices":[{"label":"See a doctor right away","effects":{"health":6,"money":-1500},"result":"It was caught early. You'll be fine."},{"label":"Blame it on the heat","effects":{"health":-8},"result":"It happened again the next week."},{"label":"Ask the Pokémon Center's Blissey for help","effects":{"health":4,"bond":4},"result":"Its Softboiled helped more than you expected."}],"requires":{"maxStat":{"health":70}}},{"id":"adult_elder_move","minAge":65,"maxAge":90,"weight":1,"text":"Your family wants you to move somewhere smaller.","choices":[{"label":"Move to a seaside town","effects":{"happiness":6,"money":-5000},"result":"You love the sound of the Wingull."},{"label":"Stay in your old home","effects":{"happiness":3},"result":"This house has too many memories to leave."}]},{"id":"adult_elder_friend_passes","minAge":65,"maxAge":100,"weight":1,"text":"You learned that {friend}, an old traveling companion, has passed away.","choices":[{"label":"Visit the Pokémon memorial to remember","effects":{"happiness":-6,"karma":2,"friendDies":true},"result":"You left a bouquet of flowers. Their Pokémon was there too."},{"label":"Call old friends","effects":{"happiness":-3,"newFriend":true,"friendDies":true},"result":"You reconnected with someone you hadn't talked to in years."}],"requires":{"hasFriend":true}},{"id":"adult_elder_hobby","minAge":60,"maxAge":95,"weight":1,"text":"You have a lot of free time now.","choices":[{"label":"Grow Berries","effects":{"happiness":6,"health":2,"money":500},"result":"Your Pecha bushes are the envy of the block."},{"label":"Join the Game Corner crowd","effects":{"happiness":4,"money":-1000},"result":"You love the slots, even when they don't love you."},{"label":"Teach at the Trainers' School","effects":{"smarts":3,"karma":3},"result":"Kids hang on your every word."}]},{"id":"adult_legacy_gift","minAge":70,"maxAge":110,"weight":1,"text":"You're thinking about what to leave behind.","choices":[{"label":"Donate to the Pokémon Center","effects":{"karma":6,"money":-10000,"happiness":6},"result":"They named a wing after you."},{"label":"Leave it all to family","effects":{"relationship":{"type":"child","delta":10},"happiness":4},"result":"Your family will be taken care of."},{"label":"Spend it on a world tour","effects":{"money":-15000,"happiness":12},"result":"You finally saw all four regions."}],"once":true,"requires":{"minMoney":15000}},{"id":"adult_elder_pokemon_farewell","minAge":70,"maxAge":110,"weight":0.5,"text":"Your oldest Pokémon partner curled up next to you in the sun and slept for hours. It's slowing down, and you treasure every day together.","effects":{"happiness":-4,"bond":5},"once":true,"requires":{"hasPokemon":true}},{"id":"adult_hall_of_fame_visit","minAge":60,"maxAge":100,"weight":1,"text":"You visited the Hall of Fame and showed your old badge case to a crowd of young trainers.","effects":{"happiness":8},"once":true,"requires":{"minBadges":8}},{"id":"adult_birthday_100","minAge":100,"maxAge":105,"weight":5,"text":"You're a centenarian! {town} threw a party, and the whole Pokémon Center staff came.","effects":{"happiness":15,"karma":2},"once":true},{"id":"ger_articuno_seafoam","title":"Articuno over the Seafoam Islands","emoji":"❄️","minAge":12,"maxAge":70,"weight":0.15,"text":"A freak blizzard froze the sea between Fuchsia and Cinnabar. Through the snow at the Seafoam Islands, you glimpse Articuno's long blue tail.","once":true,"requires":{"region":"Kanto","hasPokemon":true,"minBadges":5},"choices":[{"label":"Throw an Ultra Ball into the storm","effects":{"happiness":25,"bond":10,"pokemon":144},"result":"Click. The ball stopped shaking. You caught ARTICUNO!","chance":0.03,"failEffects":{"health":-6,"happiness":-2},"failResult":"Articuno vanished in a whirl of ice. You limped home with frostbitten fingers."},{"label":"Sketch it from the shore","effects":{"smarts":5,"happiness":6},"result":"Your drawing ended up pinned in the Cinnabar Lab."},{"label":"Get out of the cold","effects":{"health":2},"result":"You warmed up with a hot cocoa in Fuchsia City."}]},{"id":"ger_zapdos_power_plant","title":"Blackout at the Power Plant","emoji":"⚡","minAge":8,"maxAge":90,"weight":0.25,"text":"Every light between Cerulean and Lavender went dark. Linemen swear Zapdos has been roosting inside the abandoned Power Plant on Route 10 again.","requires":{"region":"Kanto"},"choices":[{"label":"Sneak in to see it","effects":{"happiness":12,"smarts":3},"result":"You saw Zapdos crackling on the generators. Unforgettable!","chance":0.5,"failEffects":{"health":-10},"failResult":"A stray Thunderbolt knocked you flat. Your hair still stands up."},{"label":"Help the repair crew with candles","effects":{"karma":5,"happiness":3,"newFriend":true},"result":"You made friends in the dark."},{"label":"Complain to the utility company","effects":{"happiness":-2,"money":100},"result":"They sent you a ₽100 credit. Big whoop."}]},{"id":"ger_moltres_mt_ember","title":"Flames on Mt. Ember","emoji":"🔥","minAge":14,"maxAge":70,"weight":0.15,"text":"On a Sevii Islands ferry trip, the peak of Mt. Ember on One Island blazed like a torch. Locals whisper that Moltres has come home.","requires":{"region":"Kanto","hasPokemon":true},"choices":[{"label":"Hike to the summit","effects":{"happiness":14,"health":3,"bond":6},"result":"Moltres spread its burning wings above you, then soared off toward the sun.","chance":0.45,"failEffects":{"health":-12},"failResult":"A lava vent flared up. You got nasty burns on the way down."},{"label":"Soak in the One Island hot springs instead","effects":{"health":6,"looks":2},"result":"Moltres or not, the springs were heavenly."},{"label":"Photograph it from the ferry","effects":{"money":800,"happiness":3},"result":"You sold the photo to a magazine.","chance":0.5,"failEffects":{"happiness":-2},"failResult":"It came out blurry."}]},{"id":"ger_mew_truck_rumor","title":"The Truck by the S.S. Anne","emoji":"🚚","minAge":8,"maxAge":15,"weight":0.3,"text":"A kid at school swears Mew is hiding under the old truck by the S.S. Anne dock in Vermilion City. You just need a Strength Pokémon to push it.","requires":{"region":"Kanto"},"choices":[{"label":"Try to push the truck","effects":{"happiness":10,"smarts":2},"result":"The truck wouldn't budge, but a pink blur giggled and zipped past your head. Was that…?","chance":0.15,"failEffects":{"health":-3,"happiness":-2},"failResult":"You pulled a muscle. There was nothing under there but a Magikarp sticker."},{"label":"Call it a myth","effects":{"smarts":3},"result":"Your classmates called you boring. You called them gullible."}]},{"id":"ger_snorlax_route_12","title":"Snorlax Blocks Route 12","emoji":"😴","minAge":10,"maxAge":80,"weight":0.3,"text":"A giant Snorlax fell asleep across Route 12 south of Lavender Town. Traffic to Fuchsia has been stuck for a week.","requires":{"region":"Kanto","hasPokemon":true},"choices":[{"label":"Borrow a Poké Flute from Mr. Fuji and battle it","effects":{"happiness":12,"bond":8,"pokemon":143},"result":"It woke up grumpy, but your Poké Ball stuck. You caught SNORLAX!","chance":0.25,"failEffects":{"bond":3,"happiness":2},"failResult":"It yawned, rolled over, and lumbered into the sea. At least the road is clear."},{"label":"Take the long way through Route 8","effects":{"health":2,"happiness":-2},"result":"Your legs are sore, but you made it."},{"label":"Sell snacks and lemonade to the stranded drivers","effects":{"money":800,"karma":-1},"result":"₽800 in lemonade sales. Business is booming."}],"once":true},{"id":"ger_viridian_forest_fire","title":"Viridian Forest Fire","emoji":"🌲","minAge":5,"maxAge":90,"weight":0.2,"text":"A wild Charmeleon brawl set Viridian Forest ablaze. Smoke is drifting over Pewter City.","requires":{"region":"Kanto"},"choices":[{"label":"Help the Water-type volunteer brigade","effects":{"karma":8,"happiness":5,"bond":5},"result":"The brigade saved the Pikachu nests, and you helped haul buckets. The Pewter Museum gave you a certificate.","chance":0.7,"failEffects":{"health":-10},"failResult":"You breathed in too much smoke and spent a week coughing."},{"label":"Evacuate and stay safe","effects":{"health":-1,"happiness":-3},"result":"You watched the orange sky from Viridian City."}]},{"id":"ger_shiny_pikachu_viridian","title":"A Sparkling Pikachu","emoji":"✨","minAge":10,"maxAge":70,"weight":0.1,"text":"Deep in Viridian Forest, a Pikachu sparkled as it jumped out of the grass. Its fur is a deeper orange-gold than any you've seen. It's a SHINY!","requires":{"region":"Kanto","hasPokemon":true},"choices":[{"label":"Throw a Poké Ball","effects":{"happiness":20,"looks":3,"pokemon":{"id":25,"shiny":true,"level":10}},"result":"Gotcha! Your shiny Pikachu is the talk of Pewter City.","chance":0.4,"failEffects":{"happiness":-8},"failResult":"It used Quick Attack and was gone. You'll be thinking about it for years."},{"label":"Take a photo instead","effects":{"happiness":6,"money":300},"result":"The Pokémon Fan Club bought your photo for ₽300."}]},{"id":"ger_rocket_game_corner","title":"The Poster in the Game Corner","emoji":"🎰","minAge":11,"maxAge":30,"weight":0.25,"text":"At the Celadon Game Corner, a Team Rocket grunt is guarding a poster on the back wall a little too closely.","requires":{"region":"Kanto","hasPokemon":true},"choices":[{"label":"Battle the grunt and flip the switch","effects":{"money":1500,"karma":6,"bond":6},"result":"You found the Rocket Hideout, freed a stolen Pokémon, and pocketed their slush fund.","chance":0.5,"failEffects":{"health":-8,"money":-300},"failResult":"The grunt's Raticate chased you out and they stole your coin case."},{"label":"Tip off Erika at the Celadon Gym","effects":{"karma":4,"smarts":2},"result":"Erika thanked you with a jar of perfume."},{"label":"Mind your own business and play the slots","effects":{"money":-500,"happiness":2},"result":"You lost ₽500 on the slots. Classic."}]},{"id":"ger_rocket_silph_takeover","title":"Team Rocket Seizes Silph Co.","emoji":"🏢","minAge":16,"maxAge":60,"weight":0.15,"text":"Team Rocket has taken over Silph Co. in Saffron City, and Giovanni is after the Master Ball prototype. The whole city is locked down.","once":true,"requires":{"region":"Kanto","hasPokemon":true},"choices":[{"label":"Fight your way to the president's office","effects":{"karma":10,"happiness":10,"item":{"Master Ball":1}},"result":"You drove off Giovanni! The grateful Silph president gave you a Master Ball.","chance":0.35,"failEffects":{"health":-15,"bond":-3},"failResult":"Giovanni's Nidoking flattened your team. You were thrown out of the lobby."},{"label":"Hide in the Copycat's house next door","effects":{"happiness":-3},"result":"You waited it out until the Rockets left."},{"label":"Hand out supplies to trapped workers","effects":{"karma":5,"money":-300},"result":"Everyone got a Fresh Water and a smile."}]},{"id":"ger_cinnabar_eruption","title":"Cinnabar Volcano Erupts","emoji":"🌋","minAge":10,"maxAge":100,"weight":0.1,"text":"The volcano on Cinnabar Island erupted! Blaine's Gym and the Pokémon Mansion were buried under lava. Only the Pokémon Center was left standing.","once":true,"requires":{"region":"Kanto"},"choices":[{"label":"Help ferry evacuees to Pallet Town","effects":{"karma":10,"health":-3,"happiness":6,"newFriend":true},"result":"You rode a Lapras back and forth all night. People still thank you for it."},{"label":"Watch the news from home","effects":{"smarts":2,"happiness":-3},"result":"Nobody was hurt, thank Arceus. Blaine says he'll open his Gym in the Seafoam Islands."}]},{"id":"ger_suicune_burned_tower","title":"Suicune at the Burned Tower","emoji":"💧","minAge":10,"maxAge":70,"weight":0.2,"text":"In the basement of Ecruteak's Burned Tower, three beasts woke up and bolted. Suicune stopped for a moment and looked straight at you before it dashed off.","once":true,"requires":{"region":"Johto","hasPokemon":true},"choices":[{"label":"Chase it across Johto","effects":{"happiness":12,"health":5,"bond":5},"result":"You followed Suicune to Route 42 and Vermilion's coast. Eusine calls you his rival now.","chance":0.5,"failEffects":{"health":-4,"happiness":-2},"failResult":"It ran over a lake. You didn't. You got soaked."},{"label":"Tell Morty at the Ecruteak Gym","effects":{"smarts":4,"karma":2},"result":"Morty nodded slowly: 'The legend is waking.'"}]},{"id":"ger_raikou_thunderstorm","title":"Thunder Over Your Crib","emoji":"🌩️","minAge":0,"maxAge":4,"weight":0.2,"text":"A violent thunderstorm rolled over {town}. {parent} swears a yellow beast with a storm-cloud mane stood outside your window, watching over you.","once":true,"requires":{"region":"Johto"},"effects":{"happiness":5,"health":2}},{"id":"ger_entei_route_37","title":"Scorched Grass on Route 37","emoji":"🔥","minAge":10,"maxAge":80,"weight":0.2,"text":"The grass on Route 37 is scorched in a trail of huge paw prints, still smoking. Entei is roaming nearby.","requires":{"region":"Johto","hasPokemon":true},"choices":[{"label":"Follow the trail with your Pokémon","effects":{"happiness":10,"bond":6},"result":"Entei roared from a ridge, and a volcano's heat washed over you. Chills.","chance":0.5,"failEffects":{"health":-8},"failResult":"You tripped into a smoldering patch. Burn Heal, please."},{"label":"Report it to the Ecruteak rangers","effects":{"karma":3,"smarts":2},"result":"They thanked you and fenced off the route."}]},{"id":"ger_ho_oh_rainbow","title":"A Rainbow Over the Bell Tower","emoji":"🌈","minAge":0,"maxAge":120,"weight":0.1,"text":"A brilliant rainbow arced over the Bell Tower in Ecruteak City, and a bird with shining seven-colored wings flew through it. Ho-Oh! The Kimono Girls say you are blessed.","once":true,"requires":{"region":"Johto"},"effects":{"happiness":12,"karma":5,"health":3}},{"id":"ger_lugia_whirl_islands","title":"Storm at the Whirl Islands","emoji":"🌊","minAge":14,"maxAge":80,"weight":0.15,"text":"A huge storm churned up the Whirl Islands off Cianwood. Olivine sailors say a silver giant dives in the whirlpools whenever the sea goes wild.","requires":{"region":"Johto","hasPokemon":true},"choices":[{"label":"Sail out to look for Lugia","effects":{"happiness":15,"smarts":3,"bond":5},"result":"Lugia rose out of the sea, and the storm went quiet with a single Aeroblast.","chance":0.3,"failEffects":{"health":-12,"money":-1000},"failResult":"Your boat capsized. You swam to Cianwood and lost your wallet."},{"label":"Help the sailors tie down the ships","effects":{"karma":6,"health":-2,"newFriend":true},"result":"You saved the harbor. The Olivine Café gave you free meals for a month."}]},{"id":"ger_celebi_ilex_shrine","title":"The Shrine in Ilex Forest","emoji":"🍃","minAge":5,"maxAge":12,"weight":0.15,"text":"Lost in Ilex Forest near Azalea Town, you stopped at the little wooden shrine. A tiny green Pokémon with big blue eyes blinked at you and then vanished in a flash of light.","once":true,"requires":{"region":"Johto"},"choices":[{"label":"Leave a Berry at the shrine","effects":{"happiness":10,"karma":6},"result":"Kurt said Celebi only shows itself to children with pure hearts. The forest felt warmer afterward."},{"label":"Try to catch it in your hands","effects":{"happiness":3},"result":"You grabbed empty air. When you got home, {parent} said you'd been gone an entire day. Weird.","chance":0.5,"failEffects":{"health":-3},"failResult":"You tripped over a Farfetch'd."}]},{"id":"ger_red_gyarados","title":"The Red Gyarados","emoji":"🔴","minAge":12,"maxAge":60,"weight":0.12,"text":"Team Rocket's signal from Mahogany Town drove the Magikarp in the Lake of Rage to evolve. One furious RED Gyarados is thrashing in the middle of the lake. A shiny!","once":true,"requires":{"region":"Johto","hasPokemon":true,"minBadges":4},"choices":[{"label":"Battle and throw a ball","effects":{"happiness":20,"bond":10,"pokemon":{"id":130,"shiny":true,"level":30}},"result":"Lance landed on his Dragonite just as you caught it. 'Impressive,' he said.","chance":0.35,"failEffects":{"health":-10},"failResult":"It used Hyper Beam. Your boat is now kindling."},{"label":"Take a Red Scale as a souvenir","effects":{"happiness":5,"money":400},"result":"Mr. Pokémon paid you ₽400 for the scale."}]},{"id":"ger_rocket_radio_tower","title":"Radio Tower Takeover","emoji":"📻","minAge":10,"maxAge":70,"weight":0.15,"text":"Team Rocket seized the Goldenrod Radio Tower and is broadcasting a message to their long-lost boss, Giovanni. Grunts are everywhere on Goldenrod's streets.","once":true,"requires":{"region":"Johto","hasPokemon":true},"choices":[{"label":"Grab a Rocket uniform and go in","effects":{"karma":10,"happiness":8,"bond":6},"result":"You helped free the Director. Team Rocket disbanded again!","chance":0.4,"failEffects":{"health":-12},"failResult":"Executive Ariana saw through your disguise. You got hurt in the fight."},{"label":"Warn the Underground shopkeepers","effects":{"karma":4,"newFriend":true},"result":"The shopkeepers barricaded their doors and got through safely."},{"label":"Stay home and listen to static","effects":{"happiness":-3},"result":"All you heard was Rocket propaganda."}]},{"id":"ger_rocket_slowpoke_well","title":"Trouble at Slowpoke Well","emoji":"🐚","minAge":8,"maxAge":60,"weight":0.2,"text":"In Azalea Town, Team Rocket is cutting off Slowpoke tails in the well to sell. Kurt went down to stop them and hurt his back.","requires":{"region":"Johto","hasPokemon":true},"choices":[{"label":"Go down the well yourself","effects":{"karma":8,"bond":6,"happiness":6},"result":"You drove off the grunts. The Slowpoke yawned at you gratefully.","chance":0.6,"failEffects":{"health":-6},"failResult":"A Koffing's Smog left you dizzy for days."},{"label":"Help Kurt home and make him tea","effects":{"karma":4,"item":{"Great Ball":2}},"result":"Kurt gave you two Great Balls from his workshop."}]},{"id":"ger_sudowoodo_route_36","title":"The Odd Tree on Route 36","emoji":"🌳","minAge":8,"maxAge":80,"weight":0.3,"text":"A weird tree is blocking Route 36 between Violet and Goldenrod. It wiggles when nobody's watching.","requires":{"region":"Johto","hasPokemon":true},"choices":[{"label":"Water it with a Squirtbottle","effects":{"happiness":10,"bond":5,"pokemon":185},"result":"It jumped up and attacked! You caught SUDOWOODO, the fake tree.","chance":0.3,"failEffects":{"happiness":3},"failResult":"It shrieked and ran off into the woods. At least the road is open."},{"label":"Try to cut it down","effects":{"health":-5,"happiness":-2},"result":"The 'tree' hit you back. Hard."}],"once":true},{"id":"ger_mt_silver_blizzard","title":"Blizzard on Mt. Silver","emoji":"🏔️","minAge":16,"maxAge":60,"weight":0.12,"text":"You climbed Mt. Silver on the Kanto-Johto border to train. A blizzard rolled in near the summit, and through the snow you see a silent trainer in a red cap.","once":true,"requires":{"region":"Johto","hasPokemon":true,"minBadges":8},"choices":[{"label":"Challenge the trainer","effects":{"happiness":15,"bond":15,"smarts":3},"result":"You barely won! He just nodded and disappeared into the snow.","chance":0.1,"failEffects":{"health":-8,"bond":4},"failResult":"His Pikachu wiped your whole team. He said nothing. You learned a lot anyway."},{"label":"Head down before the storm gets worse","effects":{"health":2,"smarts":2},"result":"You took shelter in the Pokémon Center at the base."}]},{"id":"ger_olivine_lighthouse_typhoon","title":"Typhoon at Olivine Lighthouse","emoji":"🌀","minAge":10,"maxAge":80,"weight":0.2,"text":"A typhoon hit Olivine City just as the lighthouse Ampharos, Amphy, fell sick. Ships are lost in the dark.","requires":{"region":"Johto","hasPokemon":true},"choices":[{"label":"Surf to Cianwood for the pharmacy's SecretPotion","effects":{"karma":10,"bond":6,"health":-4},"result":"Amphy's light shone again, and Jasmine hugged you on the lighthouse steps.","chance":0.65,"failEffects":{"health":-10},"failResult":"The waves were too rough. You turned back half-drowned."},{"label":"Keep lanterns lit on the pier","effects":{"karma":4,"health":-2},"result":"You helped guide one fishing boat home."}]},{"id":"ger_unown_ruins_of_alph","title":"The Unown Message","emoji":"🔤","minAge":12,"maxAge":90,"weight":0.2,"text":"Researchers at the Ruins of Alph found something new: Unown lining up on the walls to spell out a message.","requires":{"region":"Johto"},"choices":[{"label":"Help decode it","effects":{"smarts":8,"happiness":4},"result":"It read 'FRIEND.' The researchers credited you in their paper.","chance":0.6,"failEffects":{"smarts":2,"happiness":-2},"failResult":"You stared at it for hours and got a migraine."},{"label":"Take photos for the tourists","effects":{"money":500},"result":"You sold Unown postcards for ₽500."}]},{"id":"ger_groudon_drought","title":"The Great Drought","emoji":"☀️","minAge":6,"maxAge":120,"weight":0.15,"text":"The sun is blazing fiercely. Rivers across Hoenn are drying up, and the Weather Institute is pointing toward Groudon in the Cave of Origin.","requires":{"region":"Hoenn"},"choices":[{"label":"Ration water and help the neighbors","effects":{"health":-3,"karma":6},"result":"It was a hard summer, but {town} got through it together."},{"label":"Stock up on Fresh Water","effects":{"money":-800,"health":2,"karma":-3},"result":"You had plenty. Your neighbors noticed."},{"label":"Pray at Sootopolis for Rayquaza","effe comet","title":"The Millennium Comet","emoji":"⭐","minAge":6,"maxAge":14,"weight":0.08,"text":"The Millennium Comet, seen once every thousand years, lit up the Hoenn sky. A little starlike Pokémon floated down and offered to grant ONE wish before it sleeps again.","once":true,"requires":{"region":"Hoenn"},"choices":[{"label":"Wish for riches","effects":{"money":20000,"happiness":5},"result":"₽20,000 fell out of the sky. Jirachi yawned and went back to sleep."},{"label":"Wish to be smart","effects":{"smarts":20},"result":"Jirachi tapped your forehead. Math is suddenly easy."},{"label":"Wish for your family's health","effects":{"health":15,"karma":10,"relationship":{"type":"parent","delta":15}},"result":"Your whole family felt wonderful that year."},{"label":"Wish for Jirachi to be happy","effects":{"happiness":15,"karma":15},"result":"Jirachi giggled. 'Nobody ever wished for me before.'"}]},{"id":"ger_ash_fall_route_113","title":"Ash Fall on Route 113","emoji":"🌫️","minAge":5,"maxAge":90,"weight":0.25,"text":"Mt. Chimney belched a huge cloud, and volcanic ash blanketed Route 113 and Fallarbor Town ankle-deep.","requires":{"region":"Hoenn"},"choices":[{"label":"Collect ash for the Glass Workshop","effects":{"money":600,"health":-3,"item":{"Poké Ball":3}},"result":"The glassblower made you a flute and paid you in Poké Balls and cash."},{"label":"Wear a mask and stay inside","effects":{"health":1,"happiness":-2},"result":"Your lungs thanked you. Your boredom did not."}]},{"id":"ger_shiny_zigzagoon_route_101","title":"Golden Zigzagoon","emoji":"✨","minAge":8,"maxAge":70,"weight":0.1,"text":"On Route 101 outside Littleroot, a Zigzagoon with a gleaming golden coat zigzagged across your path. A shiny!","requires":{"region":"Hoenn","hasPokemon":true},"choices":[{"label":"Throw a Poké Ball","effects":{"happiness":18,"pokemon":{"id":263,"shiny":true,"level":5}},"result":"Got it! Professor Birch nearly fell over.","chance":0.45,"failEffects":{"happiness":-6},"failResult":"It zi ppiness":5},"result":"Shaymin seems to respect you and leaves peacefully. Your team feels stronger for the experience."},{"label":"Keep your distance","effects":{"smarts":2},"result":"You watch Shaymin from far away. It's something you'll never forget."}]},{"id":"comos_mythical_arceus","minAge":20,"maxAge":70,"weight":0.01,"once":true,"requires":{"hasPokemon":true,"region":"Sinnoh","minBadges":8},"text":"You find a mysterious flute. When you play it at the Spear Pillar, a stairway of light appears and Arceus descends.","choices":[{"label":"Throw everything you've got to catch Arceus","chance":0.1,"effects":{"pokemon":493,"happiness":15},"result":"The ball clicks shut. You caught Arceus! People across {region} can't stop talking about it.","failEffects":{"happiness":-5,"health":-5},"failResult":"Arceus breaks free and vanishes. You may never see it again."},{"label":"Battle it with honor, then let it go","effects":{"bond":8,"karma":5,"happiness":5},"result":"Arceus seems to respect you and leaves peacefully. Your team feels stronger for the experience."},{"label":"Keep your distance","effects":{"smarts":2},"result":"You watch Arceus from far away. It's something you'll never forget."}]},{"id":"rich_baby_name_debate","minAge":0,"maxAge":0,"once":true,"emoji":"👶","text":"Your parents argued for a week about naming you after a Pokémon. {name} won out. Just barely.","effects":{"happiness":2}},{"id":"rich_baby_teething","minAge":0,"maxAge":1,"emoji":"🧸","text":"You teethed so hard on a Teddiursa plush that its ear came off.","effects":{"health":-1,"happiness":-1}},{"id":"rich_baby_snorlax_nap","minAge":0,"maxAge":2,"emoji":"😴","text":"You fell asleep on the belly of the neighbor's Snorlax. Neither of you moved for three hours.","effects":{"happiness":4,"health":1}},{"id":"rich_baby_lullaby","minAge":0,"maxAge":1,"emoji":"🎵","text":"{parent} sang you to sleep with the Jigglypuff song every night. It worked on the whole house.","effects":{"happiness":3}},{"id":"rich_baby_first_ferry","minAge":1,"maxAge":4,"emoji":"⛴️","text":"Your family took you on your first ferry ride. A flock of Wingull followed the boat the whole way.","effects":{"happiness":4}},{"id":"rich_baby_cheri_berry","minAge":1,"maxAge":3,"emoji":"🍒","text":"You grabbed a Cheri Berry off the kitchen counter and bit into it. It was spicy!","choices":[{"label":"Spit it out","effects":{"happiness":-1},"result":"You spat it across the room and cried. {parent} laughed a little."},{"label":"Keep chewing","effects":{"health":1,"happiness":2},"result":"Your face turned red, but you kept going. A spice lover is born."}]},{"id":"rich_baby_marill_swim","minAge":1,"maxAge":3,"emoji":"🏊","text":"Your parents signed you up for toddler swim lessons with a floaty Marill.","choices":[{"label":"Splash around","effects":{"health":3,"happiness":3},"result":"You kicked and splashed like a Psyduck. The Marill approved."},{"label":"Cling to the Marill","effects":{"happiness":1},"result":"You refused to let go of the Marill for the entire lesson."}]},{"id":"rich_baby_first_haircut","minAge":2,"maxAge":3,"emoji":"💇","text":"Time for your first haircut. The barber's Scyther is only there for decoration. Probably.","choices":[{"label":"Sit still","effects":{"looks":3},"result":"You sat perfectly still. The barber gave you a lollipop."},{"label":"Wiggle and scream","effects":{"looks":-2,"happiness":-1},"result":"Your bangs are now crooked. Your baby photos will never recover."}]},{"id":"rich_baby_daycare_toys","minAge":2,"maxAge":4,"emoji":"🧸","text":"At day care, another toddler grabbed your Poké Doll.","choices":[{"label":"Share it","effects":{"happiness":2,"karma":3,"newFriend":true},"result":"You shared. The teacher gave you a gold star sticker."},{"label":"Grab it back","effects":{"happiness":1,"karma":-2},"result":"You won the tug-of-war. Nobody sat with you at snack time."},{"label":"Cry for help","effects":{"smarts":1},"result":"A teacher sorted it out. Everyone got a turn."}]},{"id":"rich_baby_pokedoll_choice","minAge":3,"maxAge":4,"emoji":"🛍️","text":"For your birthday, {parent} let you pick out one plush.","choices":[{"label":"Pikachu doll","effects":{"happiness":4},"result":"You named it Sparky and slept with it every night for years."},{"label":"Clefairy doll","effects":{"happiness":3,"smarts":1},"result":"You swore it came from the moon. It kind of did."},{"label":"Gengar doll","effects":{"happiness":3},"result":"It creeped out the whole family. You loved it."}]},{"id":"rich_baby_potty","minAge":2,"maxAge":4,"once":true,"emoji":"🚽","text":"You finally figured out the potty. The whole family clapped like you'd won a badge.","effects":{"happiness":3,"smarts":1}},{"id":"rich_baby_hoothoot_window","minAge":3,"maxAge":4,"emoji":"🦉","text":"A Hoothoot kept hooting outside your window at night.","choices":[{"label":"Hide under the blanket","effects":{"health":-1,"happiness":-2},"result":"You didn't sleep a wink."},{"label":"Hoot back at it","effects":{"happiness":4},"result":"You hooted back. It hooted back. You became best friends through the glass."}]},{"id":"rich_baby_crayons_wall","minAge":3,"maxAge":4,"emoji":"🖍️","text":"You found the crayons and a big, empty wall.","choices":[{"label":"Draw a Pikachu","effects":{"happiness":3,"smarts":1},"result":"It looked more like a Psyduck, but {parent} kept it and painted around it."},{"label":"Draw on the Growlithe instead","effects":{"happiness":2,"karma":-1},"result":"The family Growlithe now has blue stripes. Nobody is happy about it."}]},{"id":"rich_baby_imaginary_mew","minAge":3,"maxAge":4,"emoji":"🩷","text":"You had an imaginary friend: a pink Mew only you could see. You set a plate for it at dinner.","effects":{"happiness":3,"smarts":1}},{"id":"rich_baby_wurmple_stroller","minAge":1,"maxAge":4,"emoji":"🐛","requires":{"region":"Hoenn"},"text":"A Wurmple crawled onto your stroller on Route 102. You tried to eat it. It tried to eat you.","effects":{"happiness":1,"health":-1}},{"id":"rich_baby_first_snow","minAge":1,"maxAge":4,"emoji":"❄️","requires":{"region":"Sinnoh"},"text":"You saw snow for the first time. A Snover wandered by, and you thought it was a talking tree.","effects":{"happiness":4}},{"id":"rich_baby_pallet_breeze","minAge":1,"maxAge":4,"emoji":"🌾","requires":{"region":"Kanto"},"text":"{parent} pushed your stroller along Route 1 every morning. You waved at every Pidgey and Rattata.","effects":{"happiness":3,"health":1}},{"id":"rich_baby_ecruteak_festival","minAge":2,"maxAge":4,"emoji":"👘","requires":{"region":"Johto"},"text":"Your family took you to watch the Kimono Girls dance in Ecruteak. You clapped all the way through.","effects":{"happiness":4}},{"id":"rich_child_spelling_bee","minAge":7,"maxAge":11,"emoji":"🐝","requires":{"inSchool":true},"text":"You made it to the final round of the school spelling bee. Your word: \"Farfetch'd.\"","choices":[{"label":"Spell it carefully","effects":{"smarts":5,"happiness":5},"result":"F-A-R-F-E-T-C-H-apostrophe-D. You won the trophy!","chance":0.55,"failEffects":{"happiness":-3},"failResult":"You forgot the apostrophe. So close."},{"label":"Guess fast and hope","effects":{"happiness":4},"result":"You guessed right by pure luck!","chance":0.25,"failEffects":{"happiness":-2},"failResult":"Nope. It had way more letters than you thought."}]},{"id":"rich_child_lost_skitty","minAge":6,"maxAge":12,"emoji":"🐱","text":"A 'LOST SKITTY' poster went up on every pole in {town}.","choices":[{"label":"Search the neighborhood","effects":{"money":200,"karma":5,"happiness":4},"result":"You found it napping in a flower bed. The owner gave you ₽200.","chance":0.5,"failEffects":{"health":-1},"failResult":"You searched till dark. Someone else found it."},{"label":"Tell a grown-up you saw one","effects":{"karma":3},"result":"Your tip helped. The owner baked you cookies."},{"label":"Keep playing","effects":{},"result":"You kept playing. You hope it got home."}]},{"id":"rich_child_moomoo_stand","minAge":6,"maxAge":10,"emoji":"🥛","text":"You set up a Moomoo Milk stand at the end of the driveway.","choices":[{"label":"Charge ₽10 a cup","effects":{"money":120,"happiness":3},"result":"You made ₽120 and drank the rest yourself."},{"label":"Give it away free","effects":{"karma":4,"happiness":4,"newFriend":true},"result":"Every trainer on the block stopped by. You were the most popular kid in town."},{"label":"Charge ₽100 a cup","effects":{"money":100,"happiness":-1},"result":"One Rich Boy paid. Everyone else laughed."}]},{"id":"rich_child_sleepover","minAge":7,"maxAge":12,"emoji":"🏕️","text":"You got invited to {friend}'s sleepover, full of scary Pokémon stories.","choices":[{"label":"Tell the Pokémon Tower ghost story","effects":{"happiness":5,"newFriend":true},"result":"You scared everyone so badly that someone called their mom."},{"label":"Fall asleep first","effects":{"looks":-1,"happiness":-1},"result":"You woke up with a mustache drawn on your face."},{"label":"Stay home","effects":{"smarts":1},"result":"You stayed in and read comics."}]},{"id":"rich_child_tree_fall","minAge":6,"maxAge":12,"emoji":"🌳","text":"You fell out of an Apricorn tree reaching for a Pink Apricorn.","choices":[{"label":"Tough it out","effects":{"health":-2,"happiness":2},"result":"Just a bruise. You got the Apricorn too.","chance":0.6,"failEffects":{"health":-6,"illness":"sprained ankle"},"failResult":"You sprained your ankle and missed a week of recess."},{"label":"Go straight to {parent}","effects":{"health":-1,"relationship":{"type":"parent","delta":3}},"result":"Ice pack, cookie, all better."}]},{"id":"rich_child_time_capsule","minAge":8,"maxAge":11,"once":true,"emoji":"⏳","requires":{"inSchool":true},"text":"Your class is burying a time capsule behind the school, to be dug up in sixty years.","choices":[{"label":"Put in your favorite Pokémon card","effects":{"happiness":3},"result":"You wrapped it carefully. Future you had better appreciate it."},{"label":"Write a letter to future you","effects":{"smarts":2,"happiness":2},"result":"'Dear old me, did you become Champion?' You sealed it with a sticker."},{"label":"Put in a half-eaten sandwich","effects":{"happiness":2,"karma":-1},"result":"Your classmates were horrified. Future archaeologists will be too."}]},{"id":"rich_child_class_pet","minAge":6,"maxAge":9,"emoji":"🦫","requires":{"inSchool":true},"text":"Your class adopted a Bidoof as a class pet. Someone has to take it home for the weekend.","choices":[{"label":"Volunteer","effects":{"happiness":5,"karma":2},"result":"It chewed a table leg and snored loudly. You loved every minute."},{"label":"Let someone else do it","effects":{},"result":"The Bidoof came back Monday wearing a tiny hat. You're jealous."}]},{"id":"rich_child_first_catch","minAge":10,"maxAge":12,"once":true,"emoji":"⚪","requires":{"hasPokemon":true},"text":"A wild {randomPokemon} jumped out of the grass on your very first day on the road. Your hands were shaking.","choices":[{"label":"Weaken it first, then throw","effects":{"pokemon":"random","happiness":8,"bond":4},"result":"You battled carefully, then threw. Click! Your first catch!","chance":0.65,"failEffects":{"happiness":-2},"failResult":"It broke free and ran off. Next time!"},{"label":"Throw a Poké Ball right away","effects":{"pokemon":"random","happiness":8},"result":"Beginner's luck. It stayed in the ball!","chance":0.35,"failEffects":{"happiness":-3},"failResult":"The ball bounced off its head. It looked insulted and ran."},{"label":"Just watch it","effects":{"smarts":1},"result":"You watched it hop away. Some Pokémon are just for looking at."}]},{"id":"rich_child_starter_ball","minAge":10,"maxAge":11,"once":true,"emoji":"🎒","requires":{"hasPokemon":true},"text":"{pokemon} refuses to go back into its Poké Ball. It wants to ride on your shoulder instead.","choices":[{"label":"Let it ride","effects":{"bond":10,"happiness":5},"result":"You walked everywhere with {pokemon} on your shoulder. You're a team now."},{"label":"Insist on the ball","effects":{"bond":-3,"smarts":1},"result":"{pokemon} sulked for a week but eventually got used to it."}]},{"id":"rich_child_mom_savings","minAge":10,"maxAge":12,"emoji":"📞","requires":{"hasPokemon":true},"text":"{parent} called the Pokémon Center to check on you. 'Should I save some of your money for you, sweetie?'","choices":[{"label":"Yes, please save it","effects":{"money":300,"item":{"Great Ball":1},"relationship":{"type":"parent","delta":5}},"result":"Your savings quietly grew. {parent} even bought you a Great Ball with some of it."},{"label":"No thanks, I've got it","effects":{"happiness":2},"result":"You spent it all on Lemonade from a vending machine."},{"label":"Say you're too busy to talk","effects":{"relationship":{"type":"parent","delta":-4}},"result":"You hung up fast. You feel a little guilty."}]},{"id":"rich_child_pokegear","minAge":10,"maxAge":12,"once":true,"emoji":"📱","text":"Your family gave you a brand-new Pokégear for the road. It has a map, a radio, and a phone.","choices":[{"label":"Register every trainer you meet","effects":{"happiness":3,"newFriend":true},"result":"Your phone rang nonstop. Mostly about Rattata."},{"label":"Keep it for emergencies","effects":{"smarts":2},"result":"It stayed charged and quiet, just the way you like it."}]},{"id":"rich_child_youngster_call","minAge":10,"maxAge":12,"emoji":"📞","requires":{"hasPokemon":true,"region":"Johto"},"text":"Youngster Joey called again. His Rattata is 'in the top percentage of Rattata.'","choices":[{"label":"Battle him for old times' sake","effects":{"happiness":3,"bond":3},"result":"You won. Joey says his Rattata had an off day."},{"label":"Let it go to voicemail","effects":{"happiness":-1},"result":"He called back four more times."},{"label":"Give him training tips","effects":{"karma":3,"smarts":1},"result":"His Rattata got stronger. Joey is thrilled."}]},{"id":"rich_child_fan_club","minAge":8,"maxAge":12,"emoji":"🗣️","requires":{"region":"Kanto"},"text":"The chairman of the Pokémon Fan Club in Vermilion City grabbed you and started talking about his Rapidash.","choices":[{"label":"Listen politely","effects":{"karma":3,"happiness":2,"smarts":1},"result":"Two hours later, he thanked you for listening and gave you a Rapidash sticker."},{"label":"Make an excuse and run","effects":{"happiness":1},"result":"You escaped. He's still talking to the wall."}]},{"id":"rich_child_berry_planting","minAge":6,"maxAge":12,"emoji":"🫐","text":"You found an Oran Berry and planted it in the soft soil by the road.","choices":[{"label":"Water it every day","effects":{"happiness":4,"karma":3,"health":1},"result":"It grew into a tree full of Berries. You shared them with every passing trainer."},{"label":"Forget about it","effects":{},"result":"A wild Zigzagoon ate the sprout."}]},{"id":"rich_child_report_card","minAge":7,"maxAge":12,"emoji":"📝","requires":{"inSchool":true},"text":"Report cards came out today.","choices":[{"label":"Show {parent} right away","effects":{"happiness":4,"relationship":{"type":"parent","delta":4}},"result":"Mostly good grades! {parent} took you out for ice cream.","chance":0.6,"failEffects":{"happiness":-3,"smarts":1},"failResult":"Not great. {parent} set up a study schedule. Ugh."},{"label":"Hide it under your bed","effects":{"happiness":-4,"relationship":{"type":"parent","delta":-5}},"result":"{parent} found it anyway. You're grounded."}]},{"id":"rich_child_bully","minAge":8,"maxAge":12,"emoji":"😠","requires":{"inSchool":true},"text":"A bigger kid keeps stealing your lunch money behind the Trainers' School.","choices":[{"label":"Stand up to them","effects":{"happiness":6,"karma":2},"result":"You told them to back off, and they did. Huh.","chance":0.5,"failEffects":{"health":-4,"happiness":-4},"failResult":"They shoved you into a puddle. Still, you stood your ground."},{"label":"Tell a teacher","effects":{"smarts":1,"happiness":2},"result":"The bully got detention and a long talk."},{"label":"Start packing a lunch","effects":{"money":-50,"smarts":1},"result":"Problem solved. Kind of."}]},{"id":"rich_child_valentine","minAge":10,"maxAge":12,"emoji":"💌","text":"Someone left a Luvdisc-shaped valentine in your locker. It isn't signed.","choices":[{"label":"Try to figure out who","effects":{"happiness":5},"result":"You never found out, but you smiled all week."},{"label":"Show it to everyone","effects":{"happiness":-2,"looks":1},"result":"Your classmates teased you for a month."}]},{"id":"rich_child_new_house","minAge":6,"maxAge":12,"once":true,"emoji":"🏡","text":"Your family moved into a bigger house across {town}. Your new room has a window facing the route.","effects":{"happiness":4}},{"id":"rich_child_pokemon_chores","minAge":10,"maxAge":12,"emoji":"🧺","requires":{"hasPokemon":true},"text":"{parent} asked if {pokemon} could help around the house while you're home.","choices":[{"label":"Put {pokemon} to work","effects":{"bond":4,"money":100,"relationship":{"type":"parent","delta":4}},"result":"{pokemon} dried the laundry faster than any machine. {parent} was impressed."},{"label":"Say {pokemon} is a battler, not a maid","effects":{"relationship":{"type":"parent","delta":-3}},"result":"{pokemon} took a nap on the couch while you argued."}]},{"id":"rich_child_haunted_chateau","minAge":8,"maxAge":12,"emoji":"👻","requires":{"region":"Sinnoh"},"text":"Kids dared you to spend a night in the Old Chateau in Eterna Forest.","choices":[{"label":"Accept the dare","effects":{"happiness":4,"health":-1,"newFriend":true},"result":"A TV turned on by itself. You ran home screaming, but you're a legend at school now."},{"label":"Decline","effects":{"smarts":1},"result":"They called you a Torchic. You didn't care."}]},{"id":"rich_child_mansion_dare","minAge":8,"maxAge":12,"emoji":"🏚️","requires":{"region":"Kanto"},"text":"Kids dared you to sneak into the burned-out Pokémon Mansion on Cinnabar Island.","choices":[{"label":"Sneak in","effects":{"happiness":3,"smarts":3},"result":"You found an old journal: 'Mew gave birth...' Then a Grimer oozed by and you bolted.","chance":0.8,"failEffects":{"health":-4},"failResult":"You tripped over a broken statue and scraped your knee."},{"label":"Nope","effects":{"smarts":1},"result":"Smart. That place is falling apart."}]},{"id":"rich_child_music_lessons","minAge":6,"maxAge":12,"emoji":"🎹","text":"{parent} wants you to take piano lessons.","choices":[{"label":"Practice every day","effects":{"smarts":3,"happiness":2},"result":"By the end of the year, you could play the Pokémon Center theme perfectly."},{"label":"Beg to quit","effects":{"happiness":2,"relationship":{"type":"parent","delta":-2}},"result":"You quit after three lessons. The piano is now a very expensive shelf."}]},{"id":"rich_child_summer_camp","minAge":8,"maxAge":12,"emoji":"⛺","text":"You went to a week of Pokémon summer camp by the lake.","choices":[{"label":"Join the canoe race","effects":{"health":3,"happiness":4,"newFriend":true},"result":"Your team won! You also fell in twice."},{"label":"Hang out at the arts and crafts cabin","effects":{"happiness":3,"smarts":1},"result":"You made a lopsided clay Bulbasaur. It's beautiful."},{"label":"Call home crying","effects":{"happiness":-2},"result":"{parent} picked you up early. You kind of regret it."}]},{"id":"rich_child_nugget_bridge","minAge":11,"maxAge":12,"emoji":"🌉","requires":{"region":"Kanto","hasPokemon":true},"text":"Five trainers were lined up on Nugget Bridge north of Cerulean. The prize: a Nugget.","choices":[{"label":"Take them all on","effects":{"money":5000,"bond":5,"happiness":5},"result":"You beat all five and pocketed the Nugget. It sold for ₽5,000!","chance":0.45,"failEffects":{"money":-300,"happiness":-3},"failResult":"You lost to the fourth trainer and paid out prize money."},{"label":"Wade across the river instead","effects":{"health":-1},"result":"You got soaked, but kept your money."}]},{"id":"rich_teen_prom","minAge":16,"maxAge":17,"once":true,"emoji":"💃","requires":{"inSchool":true},"text":"Prom night is coming up. The theme is const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>(n<0?'-':'')+'₽'+Math.abs(Math.round(n)).toLocaleString('en-US');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const an=w=>{w=String(w==null?'':w);return(/^[aeiou]/i.test(w)&&!/^(uni|use|eu|one|ub)/i.test(w)?'an ':'a ')+w;};
function wpick(arr,wf){let t=0;const ws=arr.map(x=>{const w=Math.max(0,wf(x)||0);t+=w;return w});if(t<=0)return null;let r=R()*t;for(let i=0;i<arr.length;i++){r-=ws[i];if(r<=0)return arr[i];}return arr[arr.length-1];}
let _uid=Date.now()%100000;const uid=()=>(++_uid).toString(36)+Math.floor(R()*1e4).toString(36);

/* ---------- data loading & normalization ---------- */
async function loadRaw(){
  if(window.POKELIFE_DATA)return window.POKELIFE_DATA;
  const f=n=>fetch('data/'+n+'.json').then(r=>{if(!r.ok)throw new Error(n);return r.json()}).catch(e=>{console.warn('Missing data file',n,e);return null});
  const [pokemon,gyms,events,careers]=await Promise.all(['pokemon','gyms','events','careers'].map(f));
  return {pokemon,gyms,events,careers};
}
function arr(x,key){if(!x)return[];if(Array.isArray(x))return x;if(Array.isArray(x[key]))return x[key];return[];}
function regionOf(id){for(const r of REGION_ORDER){const[a,b]=REGION_RANGE[r];if(id>=a&&id<=b)return r;}return'Kanto';}
function normalize(raw){
  const d={mons:[],byId:{},byName:{},regions:{},events:[],careers:[],careerById:{},pre:{},minLv:{}};
  for(const p0 of arr(raw.pokemon,'pokemon')){
    if(!p0||!p0.id||!p0.name)continue;const id=+p0.id;
    let types=(Array.isArray(p0.types)?p0.types:[p0.types||'Normal']).map(t=>String(t).charAt(0).toUpperCase()+String(t).slice(1).toLowerCase()).filter(t=>TYPES.includes(t));
    if(!types.length)types=['Normal'];
    const b=p0.base||p0.baseStats||{};const base={};for(const k of['hp','atk','def','spa','spd','spe'])base[k]=+b[k]||50;
    let evs=(p0.evolutions||[]).map(e=>({to:+(e.to||e.id),method:e.method||'level',level:e.level!=null?+e.level:null,item:e.item||null,condition:e.condition||null})).filter(e=>e.to);
    const catchRate=clamp(+p0.catchRate||+p0.catch_rate||45,1,255);
    let rarity=p0.rarity;if(!(rarity in RARITY_W))rarity=catchRate>=190?'common':catchRate>=100?'uncommon':catchRate>=45?'rare':catchRate>3?'very_rare':'legendary';
    const region=REGION_ORDER.includes(p0.region)?p0.region:regionOf(id);
    let hab=(Array.isArray(p0.habitats)?p0.habitats:p0.habitat?[p0.habitat]:['grassland']).map(h=>String(h).toLowerCase());
    const sp={id,name:String(p0.name),types:types.slice(0,2),base,evolutions:evs,catchRate,rarity,region,habitats:hab,emoji:p0.emoji||null};
    d.mons.push(sp);d.byId[id]=sp;d.byName[sp.name.toLowerCase()]=sp;
  }
  d.mons.sort((a,b)=>a.id-b.id);
  for(const sp of d.mons)sp.evolutions=sp.evolutions.filter(e=>d.byId[e.to]);
  for(const sp of d.mons)for(const e of sp.evolutions){if(!d.pre[e.to])d.pre[e.to]={from:sp.id,e};}
  const evoLv=e=>e.level||({level:16,stone:22,friendship:20,trade:32,item:32,other:28}[e.method]||25);
  const ml=(id,depth=0)=>{if(d.minLv[id])return d.minLv[id];const p=d.pre[id];let v=2;if(p&&depth<5)v=Math.max(ml(p.from,depth+1),evoLv(p.e));d.minLv[id]=v;return v};
  d.mons.forEach(s=>ml(s.id));
  d.evoLv=evoLv;
  const G=(raw.gyms&&raw.gyms.regions)||raw.gyms||{};
  for(const r of REGION_ORDER){const g=G[r]||{};
    const locs=(g.locations||DEFAULT_LOCATIONS[r]||[]).map(l=>Array.isArray(l)?{name:l[0],habitats:l[1].split(' '),minBadges:l[2],emoji:l[3]}:{name:l.name,habitats:l.habitats||['grassland'],minBadges:l.minBadges||0,emoji:l.emoji||'🌿'});
    d.regions[r]={name:r,professor:g.professor||'the Professor',starters:(g.starters||[]).filter(i=>d.byId[i]),towns:(g.towns&&g.towns.length)?g.towns:[r+' Town'],
      gyms:(g.gyms||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0)).slice(0,8),eliteFour:(g.eliteFour||[]).slice(0,4),champion:g.champion||null,locations:locs};
    if(!d.regions[r].starters.length){const s=d.mons.filter(m=>m.rarity==='starter'&&m.region===r&&!d.pre[m.id]).map(m=>m.id);d.regions[r].starters=s.slice(0,3);}
    if(!d.regions[r].starters.length)d.regions[r].starters=d.mons.filter(m=>!d.pre[m.id]&&m.evolutions.length&&m.rarity!=='legendary'&&m.rarity!=='mythical').slice(0,3).map(m=>m.id);
  }
  d.events=arr(raw.events,'events').filter(e=>e&&e.text).map(e=>Object.assign({minAge:0,maxAge:120,weight:1},e));
  d.careers=arr(raw.careers,'careers').filter(c=>c&&c.id&&c.title).map(c=>Object.assign({category:'regular',minAge:18,salary:20000,requires:{},promotions:[],stress:5,perks:{},emoji:'💼',description:''},c));
  if(!d.careers.find(c=>c.id==='trainer'))d.careers.unshift({id:'trainer',title:'Pokémon Trainer',category:'pokemon',emoji:'🎒',description:'Battle for prize money.',minAge:10,salary:0,requires:{},promotions:[],stress:3,perks:{}});
  d.careers.forEach(c=>d.careerById[c.id]=c);
  return d;
}


/* ---------- species helpers ---------- */

function monStats(s,l){const b=s.base,f=x=>Math.floor((2*x+15)*l/100)+5;return{hp:Math.floor((2*b.hp+15)*l/100)+l+10,atk:f(b.atk),def:f(b.def),spa:f(b.spa),spd:f(b.spd),spe:f(b.spe)};}

function markSeen(id){if(!S.dex.seen[id])S.dex.seen[id]=1;}

function addMon(m,quiet){markCaught(m.id);if(S.party.length<6){S.party.push(m);return'party'}S.pc.push(m);return'PC';}
const allMons=()=>S.party.concat(S.pc);
const alive=()=>S.party.filter(m=>m.hp>0);
const isLegend=s=>s.rarity==='legendary'||s.rarity==='mythical';
function avgTopLevel(){const l=S.party.map(m=>m.lvl).sort((a,b)=>b-a).slice(0,3);return l.length?l.reduce((a,b)=>a+b,0)/l.length:5;}
function nextLvGain(L){return Math.max(.22,(74-L)/26);}
function gainXp(m,amt,lines){m.xp+=amt;let up=0;while(m.xp>=1&&m.lvl<100){m.xp-=1;m.lvl++;up++;checkEvolve(m,lines,true);}if(m.lvl>=100)m.xp=0;return up;}
function evolveTo(m,to,lines){const old=sp(m.id),nw=sp(to);if(!nw)return;const wasNamed=m.nick===old.name;m.id=to;if(wasNamed)m.nick=nw.name;markCaught(to);S.cnt.evolved++;
  const t=`✨ What? ${wasNamed?old.name:m.nick+' ('+old.name+')'} evolved into ${nw.name}!`;if(lines)lines.push(t);log(t,'poke big');toast(`${old.name} evolved into ${nw.name}!`);}
function checkEvolve(m,lines,levelUp){const s=sp(m.id);if(!s||!s.evolutions.length)return false;
  const ok=s.evolutions.filter(e=>{if(e.method==='level')return m.lvl>=(e.level||16);if(e.method==='friendship')return levelUp&&m.bond>=85&&m.lvl>=(e.level||10);return false;});
  if(!ok.length)return false;let e=pick(ok);
  if(ok.length>1&&ok.some(x=>x.condition)){const night=R()<.5;const c=ok.find(x=>x.condition&&(night?/night/i:/day/i).test(x.condition));if(c)e=c;}
  const from=m.id;evolveTo(m,e.to,lines);
  const bonus=s.evolutions.find(x=>x.method==='other'&&x.condition&&/empty party slot/i.test(x.condition));
  if(bonus&&bonus.to!==e.to&&S.party.length<6&&(S.items['Poké Ball']||0)>0){S.items['Poké Ball']--;const b=makeMon(bonus.to,m.lvl,{met:'evolution'});addMon(b);const t=`✨ An empty Poké Ball in your bag twitched… ${sp(bonus.to).name} appeared!`;if(lines)lines.push(t);log(t,'poke big');}
  checkEvolve(m,lines,false);return true;}
function tradeEvo(m){const s=sp(m.id);if(!s)return null;const ts=s.evolutions.filter(e=>e.method==='trade');return ts.find(e=>!e.item||(S.items[e.item]||0)>0)||ts[0]||null;}
function specialEvos(m){const s=sp(m.id);return s?s.evolutions.filter(e=>e.method==='other'&&!(e.condition&&/empty party slot/i.test(e.condition))):[];}
function itemEvos(m,item){const s=sp(m.id);return s?s.evolutions.filter(e=>(e.method==='stone'||e.method==='item')&&e.item&&e.item.toLowerCase()===item.toLowerCase()):[];}

/* ---------- battle simulation ---------- */
function combatant(s,lvl,m){const st=monStats(s,lvl);return{s,lvl,m,st,hp:m?Math.max(0,Math.round(st.hp*m.hp)):st.hp,bm:m?1+(m.bond-50)/500:1};}
function attack(a,d){let best=null;for(const t of a.s.types.concat(['Normal'])){const e=eff(t,d.s.types);const v=e*(a.s.types.includes(t)?1.5:1);if(!best||v>best.v)best={t,e,v};}
  const phys=a.st.atk>=a.st.spa;const A=phys?a.st.atk:a.st.spa,Df=phys?d.st.def:d.st.spd;
  if(best.e===0)return{dmg:0,e:0,t:best.t};const crit=R()<.0625;const miss=R()<.05;if(miss)return{dmg:0,miss:1,e:best.e,t:best.t};
  let dm=((2*a.lvl/5+2)*70*A/Df)/50+2;dm*=best.v*(.85+R()*.15)*a.bm*(crit?1.5:1);return{dmg:Math.max(1,Math.floor(dm)),e:best.e,t:best.t,crit};}
/* Battle = resumable state machine. Auto battles run straight through; interactive ones pause
   when the foe sends out a new Pokémon so the player can use their one switch. */
function battleInit(foes,o={}){
  const A=S.party.filter(m=>m.hp>0).map(m=>combatant(sp(m.id),m.lvl,m)).filter(c=>c.s);
  const B=foes.map(f=>sp(f.id)?combatant(sp(f.id),f.lvl||f.level,null):null).filter(Boolean);
  B.forEach(b=>markSeen(b.s.id));
  const st={A,B,o,ai:0,bi:0,pot:0,rounds:0,lines:[],used:new Set(),maxPot:o.noPotions?0:3,switchLeft:o.interactive?1:0,decide:false};
  const nm=c=>(c.m?c.m.nick:c.s.name);st.nm=nm;
  if(A.length)st.lines.push(`Go, ${nm(A[0])}! (Lv ${A[0].lvl})`);
  if(B.length)st.lines.push(`${o.foeName||'Foe'} sent out ${B[0].s.name} (Lv ${B[0].lvl}).`);
  st.decide=st.switchLeft>0; // first decision point: right after the foe's lead is revealed
  return st;}
function benchAlive(st){return st.A.slice(st.ai+1).filter(c=>c.hp>0);}
function battleSwitch(st,j){const A=st.A;if(st.switchLeft<=0||j<=st.ai||j>=A.length)return;
  const cur=A[st.ai];[A[st.ai],A[j]]=[A[j],A[st.ai]];st.switchLeft--;const nw=A[st.ai],b=st.B[st.bi];
  st.lines.push({t:`You called back ${st.nm(cur)} and sent out ${st.nm(nw)}!`,c:'se'});
  if(b&&b.hp>0){const r=attack(b,nw);nw.hp-=r.dmg;st.used.add(nw);if(nw.hp<=0){nw.hp=0;st.lines.push({t:`${st.nm(nw)} fainted on the switch-in!`,c:'ko'});st.ai++;if(st.ai<A.length)st.lines.push(`Go, ${st.nm(A[st.ai])}!`);}}}
function battleRun(st){const{A,B,o,nm}=st;
  while(st.ai<A.length&&st.bi<B.length&&st.rounds++<500){
    if(st.decide){st.decide=false;if(st.switchLeft>0&&benchAlive(st).length)return'decide';}
    const a=A[st.ai],b=B[st.bi];st.used.add(a);
    if(a.hp<a.st.hp*.25&&st.pot<st.maxPot){const pn=['Hyper Potion','Super Potion','Potion'].find(p=>(S.items[p]||0)>0);
      if(pn){S.items[pn]--;st.pot++;const h={'Potion':.4,'Super Potion':.7,'Hyper Potion':1}[pn];a.hp=Math.min(a.st.hp,a.hp+Math.round(a.st.hp*h));st.lines.push(`You used a ${pn} on ${nm(a)}.`);
        const r=attack(b,a);a.hp-=r.dmg;if(a.hp<=0){a.hp=0;st.lines.push({t:`${nm(a)} fainted!`,c:'ko'});st.ai++;if(st.ai<A.length)st.lines.push(`Go, ${nm(A[st.ai])}!`);}continue;}}
    const order=(a.st.spe*(1+R()*.2)>=b.st.spe*(1+R()*.2))?[[a,b],[b,a]]:[[b,a],[a,b]];
    for(const[x,y]of order){if(x.hp<=0||y.hp<=0)continue;const r=attack(x,y);y.hp-=r.dmg;
      if(r.e>=2&&r.dmg&&R()<.5)st.lines.push({t:`${nm(x)}'s ${r.t} attack is super effective on ${nm(y)}!`,c:'se'});
      else if(r.e===0&&R()<.5)st.lines.push(`It doesn't affect ${nm(y)}…`);
      if(r.crit&&R()<.4)st.lines.push(`A critical hit from ${nm(x)}!`);
      if(y.hp<=0){y.hp=0;st.lines.push({t:`${y.m?'Your ':'Foe '}${nm(y)} fainted!`,c:'ko'});
        if(y===a){st.ai++;if(st.ai<A.length)st.lines.push(`Go, ${nm(A[st.ai])}! (Lv ${A[st.ai].lvl})`);}
        else{st.bi++;if(st.bi<B.length){st.lines.push(`${o.foeName||'Foe'} sent out ${B[st.bi].s.name} (Lv ${B[st.bi].lvl}).`);st.decide=true;}}
      }}
  }
  return'done';}
function battleFinish(st){const{A,B,o,used,lines}=st;
  const win=st.bi>=B.length&&B.length>0;
  A.forEach(c=>{c.m.hp=Math.max(0,c.hp/c.st.hp);c.m.touched=true;});
  const foeAvg=B.reduce((s,b)=>s+b.lvl,0)/Math.max(1,B.length);const evoLines=[];
  used.forEach(c=>{const ratio=clamp(foeAvg/c.lvl,.3,1.6);const g=nextLvGain(c.lvl)*(win?.75:.25)*ratio*(o.xpMult||1);gainXp(c.m,g,evoLines);c.m.bond=clamp(c.m.bond+(win?2:0),0,100);});
  lines.push({t:win?'🏆 You won the battle!':'💀 You lost the battle…',c:'ko'});
  evoLines.forEach(l=>lines.push({t:l,c:'ko'}));
  if(win)S.cnt.wins++;else S.cnt.losses++;
  if(perk('healFree'))S.party.forEach(m=>m.hp=1);
  return{win,lines,foeAvg};}
function simBattle(foes,o={}){const st=battleInit(foes,Object.assign({},o,{interactive:false}));battleRun(st);return battleFinish(st);}
function randomTeam(n,lvl,opts={}){const pool=D.mons.filter(s=>!isLegend(s)&&(opts.type?s.types.includes(opts.type):true)&&(!opts.region||s.region===opts.region||R()<.04));
  const team=[];for(let i=0;i<n;i++){const L=clamp(Math.round(lvl+ri(-3,2)),2,100);
    let c=wpick(pool,s=>(D.minLv[s.id]<=L?1:.02)*(s.evolutions.length&&L>D.minLv[s.id]+20?.2:1)*(RARITY_W[s.rarity]+2));if(!c)c=pick(D.mons);team.push({id:c.id,lvl:L});}
  return team;}
function resolveTeam(team,type){return(team||[]).map(t=>{const L=t.level||t.lvl||20;if(sp(t.id))return{id:t.id,lvl:L};return randomTeam(1,L,{type})[0];});}
function evolveForLevel(id,L){let cur=id;for(let i=0;i<3;i++){const s=sp(cur);if(!s||!s.evolutions.length)break;const e=s.evolutions.find(e=>L>=D.evoLv(e)+(e.method==='level'?0:4));if(!e)break;cur=e.to;}return cur;}
/* Home region (first life only) uses data levels. Every other region, and every region for heirs,
   scales to a snapshot of your team's level taken when you first challenge that region. */
function regionScaled(){return S.gen>1||S.region!==S.homeRegion;}
// Snapshot = average of your 3 strongest Pokémon (party AND PC, so you can't lower it by
// challenging with a weak party), taken at your first Gym/League challenge in that region.
function regionBase(){S.regionBase=S.regionBase||{};if(S.regionBase[S.region]==null){const l=allMons().map(m=>m.lvl).sort((a,b)=>b-a).slice(0,3);S.regionBase[S.region]=l.length?Math.round(l.reduce((a,b)=>a+b,0)/l.length):5;}return S.regionBase[S.region];}
function scaleTeam(team,order,type){if(!regionScaled())return team;const base=regionBase();
  // gyms 1-8: base-6.5 … base+4; Elite Four (order 9-12): base+3 … base+6; Champion (order 14): base+7
  // Near the Lv100 cap the player can't out-train a +9 champion, so offsets shrink as base approaches 100.
  const rel=(order<=8?-8+1.5*order:order<=12?order-6:7)*clamp((100-base)/25,.35,1);
  const target=Math.min(100,Math.max(...team.map(t=>t.lvl),Math.round(base+rel)));const top=Math.max(...team.map(t=>t.lvl));const d=target-top;if(d<=0)return team;
  const out=team.map(t=>{const L=clamp(t.lvl+d,2,100);return{id:evolveForLevel(t.id,L),lvl:L};});
  const want=Math.min(6,order<=8?Math.max(team.length,2+Math.ceil(order/3)):team.length); // pad small early-gym teams only
  if(out.length<want)randomTeam(want-out.length,target-2,{type:TYPES.includes(type)?type:null}).forEach(t=>out.push({id:evolveForLevel(t.id,t.lvl),lvl:t.lvl}));
  return out;}
function perk(k){if(!S||!S.job)return null;const c=D.careerById[S.job.id];return c&&c.perks?c.perks[k]:null;}

/* ---------- state ---------- */
function newPerson(type,o={}){const g=o.gender||(R()<.5?'male':'female');
  // avoid two living relatives (or the player) sharing a first name within the family
  const taken=new Set(S?[S.first].concat((S.people||[]).filter(p=>p.alive).map(p=>p.name.split(' ')[0])):[]);
  let fn=pick(NAMES[g]);for(let i=0;i<12&&taken.has(fn);i++)fn=pick(NAMES[g]);
  return Object.assign({id:uid(),type,name:fn+(o.last?' '+o.last:''),gender:g,age:0,rel:ri(55,90),alive:true,lastYear:-1,looks:ri(20,95)},o);}
function newLife(o){
  const g=o.gender||'male';const clean=x=>x&&String(x).replace(/[<>&"]/g,'').trim();o.first=clean(o.first);const last=clean(o.last)||pick(LASTNAMES);
  S={v:1,first:o.first||pick(NAMES[g]),last,gender:g,homeRegion:o.region,region:o.region,town:o.town,age:0,alive:true,cause:null,
    stats:{health:o.stats?o.stats.health:ri(60,100),happiness:o.stats?o.stats.happiness:ri(55,100),smarts:o.stats?o.stats.smarts:ri(15,95),looks:o.stats?o.stats.looks:ri(15,95)},
    money:o.money||0,karma:50,ap:2,log:[],party:[],pc:[],dex:o.dex||{seen:{},caught:{}},items:{},badges:{},champion:{},ribbons:[],contestRank:{},
    edu:{stage:'none',done:'none',grades:50,years:0},job:null,retired:false,pension:0,people:[],assets:[],illness:[],flags:{},cnt:{wins:0,losses:0,evolved:0,caughtN:0,contests:0,jobs:0},
    gen:o.gen||1,family:o.family||[],rivalId:null,egg:null,starterGiven:false};
  CUR={age:0,lines:[]};S.log.push(CUR);
  const mom=newPerson('mother',{gender:'female',last,age:ri(21,38)}),dad=newPerson('father',{gender:'male',last,age:ri(22,42)});
  mom.rel=ri(60,95);dad.rel=ri(45,95);
  if(o.parents){S.people=o.parents;}else S.people.push(mom,dad);
  const sibs=o.parents?0:(R()<.5?0:R()<.7?1:2);for(let i=0;i<sibs;i++)S.people.push(newPerson('sibling',{last,age:ri(1,8)}));
  if(o.inherit){S.people=S.people.concat(o.inherit.people||[]);S.party=o.inherit.party||[];S.pc=o.inherit.pc||[];S.items=o.inherit.items||{};S.assets=o.inherit.assets||[];}
  if(o.age){S.age=o.age;CUR.age=o.age;}
  const ps=S.people.filter(p=>p.type==='mother'||p.type==='father'),par=ps.map(p=>p.name).join(' and ');
  if(!o.age){log(`👶 You were born a ${g==='nonbinary'?'baby':g==='male'?'boy':'girl'} in ${S.town}, ${S.region}.`,'big');
    if(par)log(`Your parents are ${par}.`);
    const sb=S.people.filter(p=>p.type==='sibling');if(sb.length)log(`You have ${sb.length===1?'an older sibling, '+sb[0].name:'older siblings '+sb.map(s=>s.name).join(' and ')}.`);

function maxAP(){const a=S.age;return a<3?1:a<10?3:a<70?6:4;}

const person=id=>S.people.find(p=>p.id===id);

const TAX_FREE=8000;
function taxRate(inc){return inc<=TAX_FREE?0:clamp(.30+inc/1500000,.30,.40);}
/* Yearly finances for adults: income tax on everything earned last year (salary, prizes, sponsorships,

function financeYear(){const inc=S.yrInc||0;S.yrInc=0;if(S.age<18)return;

  const student=S.edu.stage==='college'||S.edu.stage==='grad';
  const ownsHome=S.assets.some(a=>a.k==='home');
  const net=Math.max(0,inc-tax);
  // Young adults can live with a parent rent-free; otherwise rent scales with income (₽3k-15k).
  const atHome=!ownsHome&&S.age<26&&peopleOf('mother','father').length>0;
  const rent=ownsHome||atHome||student?0:clamp(3000+net*.12,3000,15000);

  const fullLiving=(student?4000:5000)+rent+net*.3+Math.max(0,net-25000)*.3;
  // Low earners live within their means: living costs are capped at 50% of net pay up to ₽8k net, then ₽4k + 90% of
  // anything above (only bites below ~₽22k net). With no income you live on support and pay nothing.
  const livingCap=net<=8000?net*.5:4000+(net-8000)*.9;
  const living=Math.round(Math.min(fullLiving,livingCap));
  const upkeep=Math.round(S.assets.reduce((a,x)=>a+x.value*(x.k==='home'?.02:.05),0));
  const kidCost=kids().filter(k=>k.age<18).length*Math.round(net<8000?net*.05:clamp(1000+net*.1,1000,5000)); // ₽1k-5k per child by income; child benefit covers most of it below ₽8k net
  const total=tax+living+upkeep+kidCost;S.money-=total;
  S.lastFin={inc,tax,living,upkeep,kidCost,total};
  log(`💸 Taxes & living costs: ${fmt(total)} <span class="mute">(tax ${fmt(tax)}, living ${fmt(living)}${upkeep?', upkeep '+fmt(upkeep):''}${kidCost?', kids '+fmt(kidCost):''})</span>`,'mute');}
function netWorth(){return S.money+S.assets.reduce((a,b)=>a+b.value,0);}
function addStat(k,d){if(k==='money'){S.money+=d;return}if(S.stats[k]==null&&!['health','happiness','smarts','looks'].includes(k))return;S.stats[k]=clamp(Math.round(S.stats[k]+d),0,100);}

/* Gifted/bought Pokémon are capped by age and badges (8..100): min(age×1.5, 10 + 8 per badge). An evolved

/* Eggs: a gift with egg:true or an explicit level 1-5 hatches. It is always the base stage of a family that can breed

function eggSpecies(id){const b=baseForm(id);if(canBreed(b))return b;const reg=S.region;let pool=D.mons.filter(x=>!D.pre[x.id]&&canBreed(x.id)&&x.region===reg);if(!pool.length)pool=D.mons.filter(x=>!D.pre[x.id]&&canBreed(x.id));return pick(pool).id;}

function giveGiftMon(spec,ctx){const o=spec&&typeof spec==='object'?spec:{};const isEgg=isEggSpec(o);

/* addBadge: awards the next badge in the current region (needs a Pokémon and fewer than 8 badges there). */

function eligibleCareers(){return D.careers.filter(c=>(!S.job||c.id!==S.job.id)&&careerReqs(c).every(x=>x[1]));}

function randLegend(region){const l=D.mons.filter(s=>isLegend(s)&&s.region===region);return l.length?pick(l):randSpecies(region);}
function fill(t,ctx){ctx=ctx||{};t=String(t==null?'':t);const first=p=>p?p.name.split(' ')[0]:null;
